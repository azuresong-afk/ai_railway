      description: >-
        Право `sessions.manage` (УПД.4). Пишет `auth.sessions_revoked`. По
        умолчанию в той же транзакции отзываются и токены API пользователя
        (`revoke_reason` = `sessions_revoked`, их число — в подробностях
        записи аудита); `revoke_api_tokens=false` оставляет токены.
      x-permission: sessions.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFToken'
        - name: revoke_api_tokens
          in: query
          required: false
          description: Отозвать токены API пользователя (по умолчанию — да).
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Сессии завершены
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, description: Сколько сессий завершено }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/gateways/register:
    post:
      summary: Регистрация шлюза — сертификат внутреннего УЦ по одноразовому токену
      description: |
        ИАФ.10, решение Р8, ADR-0009. Открыт, но требует одноразовый токен из вывода
        `aisec-cli gateway token` (`aisec_gwreg_` и 43 символа base64url, срок по умолчанию —
        24 часа). Шлюз сам создаёт ключ ECDSA P-256 и присылает CSR; закрытый ключ сервер не
        видит. Из CSR берётся только открытый ключ: CN сертификата — ID шлюза, назначение —
        только `clientAuth`, срок — 365 дней, но не дольше УЦ. Неверный CSR — 400 до проверки
        токена (токен не тратится). Неверный, истёкший или погашенный токен, токен
        отозванного шлюза — 403 без уточнения причины. Токен гасится в одной транзакции с
        выпуском сертификата и записью `gateway.register`; отказы тоже пишутся в аудит (без
        токена). Повторная регистрация того же шлюза (новый токен с `-reregister`) заменяет
        сертификат и закреплённый ключ получателя (`bundle_key`): прежний сертификат перестаёт
        приниматься внутренним API сразу. Без внутреннего УЦ
        на сервере (`-ca-cert`) — 503. Предел частоты — 10 запросов в минуту с адреса.
        Без `Idempotency-Key`: ответ содержит выпущенный сертификат.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayRegisterRequest' }
      responses:
        '201':
          description: Сертификат выпущен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayRegistration' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/users/{id}/role:
    put:
      summary: Назначить роль пользователю
      description: |
        Право `roles.manage` (УПД.1–2). Все сессии пользователя завершаются: новые права
        действуют со следующего входа. Свою роль сменить нельзя (422). Права текущей и
        новой роли пользователя должны входить в права назначающего (403). Снять роль
        `security_admin` с последнего активного администратора безопасности нельзя (409);
        назначение уже назначенной роли — тоже 409 (ничего не меняется).
        Пишет `user.role_changed`; отказ по правам — ту же запись с результатом `denied`.
      security: [{ sessionCookie: [] }]
      x-permission: roles.manage
      parameters:
