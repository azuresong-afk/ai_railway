        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/providers/{id}/external:
    put:
      summary: Изменить признак «внешний»
      description: |
        Право `providers.external` (признак `security`: только администратор безопасности,
        токену API недоступно). Снятие признака — ослабление защиты (DM-40): в режиме `monitor`
        данные к провайдеру больше не маскируются. Причина обязательна. Снятие признака требует
        повторной проверки (Н32 ревью 2.r3b): текущий пароль (`password`) или код TOTP (`code`),
        ровно одно из двух, иначе 400; неверное значение — 403 `reauthentication_failed`. Пишет
        `provider.external_changed` с `weakening: true` при снятии; без изменения — 200 без записи.
      x-permission: providers.external
