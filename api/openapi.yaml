# Контракт API — источник истины (ТЗ, раздел 13).
# Здесь — интерфейсы шлюза для приложений и API управления (aisec-server,
# префикс /api/v1), которые добавляются по мере реализации. Ошибки API
# управления — Problem Details (RFC 9457), ошибки шлюза — формат OpenAI.
# OpenAI-совместимые /v1/chat/completions и /v1/models пока описаны только в
# docs/cert/attack-surface.md. Контрактный тест internal/api сверяет маршруты
# сервера с этим файлом в обе стороны.
# У каждой защищённой операции API управления есть расширение x-permission —
# имя разрешения из internal/auth/permissions.go (УПД.3). Из него строится
# матрица «роль × эндпоинт» (docs/cert/rbac-matrix.md, tools/rbac-matrix).
openapi: 3.1.0
info:
  title: AISec API
  version: 0.0.0
security:
  - appKey: []
paths:
  /guard/v1/check:
    post:
      summary: Check API — проверка текста по политике приложения
      description: >
        Текст проверяется конвейером шлюза без обращения к модели (ТЗ, 5.1).
        Блокировка политикой — ответ 200 с `blocked: true` (проверяйте поле `blocked` или заголовок `X-AISec-Decision`, а не только код ответа) и без преобразованного
        текста. Сбой проверки при `fail_closed` — 503 `check_unavailable`;
        при `fail_open` проверка идёт дальше, ответ помечается `incomplete`.
        Действие `pseudonymize` политики выполняется как `redact`: обратной
        подстановки у Check API нет. Квоты приложения (частота, размер) действуют,
        токены модели не тратятся.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
      responses:
        '200':
          description: Решение по тексту
          headers:
            X-AISec-Event-Id: { $ref: '#/components/headers/EventId' }
            X-AISec-Decision: { $ref: '#/components/headers/Decision' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AppNotConfigured' }
        '408': { $ref: '#/components/responses/InvalidRequest' }
        '413': { $ref: '#/components/responses/InvalidRequest' }
        '415': { $ref: '#/components/responses/InvalidRequest' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/CheckUnavailable' }
  /v1/embeddings:
    post:
      summary: Эмбеддинги — OpenAI-совместимый запрос с проверкой входного текста
      description: >
        Вход проверяется конвейером; допустимы только `redact` и `block`
        (`pseudonymize` выполняется как `redact`, это видно в событии).
        `encoding_format` — только `float`; массивы токенов не принимаются.
        Идентификатор пользователя внешнему провайдеру не передаётся.
        Провайдер без поддержки эмбеддингов (GigaChat, YandexGPT на этапе 1) —
        501 `embeddings_not_supported`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbeddingsRequest' }
      responses:
        '200':
          description: Векторы по одному на строку входа
          headers:
            X-AISec-Event-Id: { $ref: '#/components/headers/EventId' }
            X-AISec-Decision: { $ref: '#/components/headers/Decision' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingsResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AppNotConfigured' }
        '404': { $ref: '#/components/responses/InvalidRequest' }
        '408': { $ref: '#/components/responses/InvalidRequest' }
        '413': { $ref: '#/components/responses/InvalidRequest' }
        '415': { $ref: '#/components/responses/InvalidRequest' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/InvalidRequest' }
        '502': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/CheckUnavailable' }
        '504': { $ref: '#/components/responses/InvalidRequest' }
        default:
          description: Ошибка провайдера модели с его кодом ответа (`upstream_error`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /healthz:
    get:
      summary: Живость процесса (шлюз и сервер управления)
      security: []
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /readyz:
    get:
      summary: 'Готовность к работе (сервер управления: доступна база данных)'
      security: []
      responses:
        '200':
          description: Готов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/system/info:
    get:
      summary: Сведения о сервере (версия)
      description: Право `system.read`. Служит образцом защищённого эндпоинта каркаса.
      x-permission: system.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Сведения о сервере
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/system/settings:
    get:
      summary: Настройки установки
      description: |
        Право `system.read`. Часовой пояс показа времени (ВРМ.2) и режим хранения содержимого по умолчанию
        для новых приложений (ТЗ 5.5). Задаются при первичной настройке; это единственный источник часового
        пояса (H-Р10, В26 ревью 2.r5). До первичной настройки — умолчания `Europe/Moscow` и `masked`.
      x-permission: system.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallSettings' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
    put:
      summary: Изменить настройки установки
      description: |
        Право `settings.manage` (функция безопасности, только администратор безопасности). Пустое или
        пропущенное поле оставляет прежнее значение. Пишет `setup.settings_changed` со значениями до и после.
        Новый режим хранения по умолчанию `none` или `full` ослабляет защиту (DM-40): нужен текущий пароль
        или код TOTP — без них 400 с полем `password`, неверные — 403 `reauthentication_failed`; запись — с
        `weakening`. Действующие приложения не меняются: умолчание применяется к новым.
      x-permission: settings.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallSettingsUpdate' }
      responses:
        '200':
          description: Настройки сохранены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallSettings' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/system/status:
    get:
      summary: Состояние системы
      description: |
        Право `system.read` (ТЗ 6.2 п. 12). Компоненты и версии, шлюзы
        (последний контакт, версия пакета, итоги самотеста и целостности,
        присланные шлюзом в heartbeat), итоги контроля целостности и
        самотестирования сервера, синхронизация времени ядром ОС (ВРМ.1, без
        обращений к NTP; на системах без `adjtimex` — `unknown`), часовой пояс
        показа (ВРМ.2, настройки установки, `GET /api/v1/system/settings`), отброшенные и отклонённые
        события (счётчики шлюзов с их последнего запуска), заполнение журнала
        аудита (РСБ.5; предел и порог — настройки), итог последней проверки
        цепочки журнала аудита (РСБ.4; сервер проверяет её при запуске и раз в
        `-audit-verify-interval`) и уведомления раздела 7 (ИАФ.4, УПД.6,
        РСБ.4, РСБ.5, ОЦЛ.5, ВРМ.1). Доставка уведомлений по каналам —
        этап 3; на этапе 2 при смене состояния ВРМ.1, РСБ.4, РСБ.5 или ОЦЛ.5
        сервер пишет в журнал аудита запись `system.alert`. Запрос ничего не
        записывает. Если раздел собрать не удалось, его имя — в `unavailable`,
        остальные разделы корректны.
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      x-permission: system.read
      responses:
        '200':
          description: Состояние системы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/system/integrity:
    get:
      summary: Итоги контроля целостности по компонентам
      description: |
        Право `system.read`. Последняя проверка каждого компонента, записанная
        в БД: сервер — при запуске, раз в `-integrity-interval` и по команде;
        `aisec-cli verify` — при запуске с `AISEC_DATABASE_URL` (ОЦЛ.2, ОЦЛ.5).
        Шлюз пишет итоги в технический журнал.
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      x-permission: system.read
      responses:
        '200':
          description: Итоги проверок
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/system/integrity/verify:
    post:
      summary: Проверить целостность сервера по команде администратора
      description: |
        Право `integrity.verify` (ОЦЛ.2): из предустановленных ролей — только у
        администратора безопасности (задача 2.9). Сверяет исполняемый файл сервера
        и встроенную статику веб-консоли с подписанным манифестом; итог пишется в
        `integrity_checks` и журнал аудита (`integrity.check`) от имени
        пользователя. Нарушение — `ok: false` с ответом 200; при
        `-integrity-action stop` сервер после ответа останавливается. Манифест
        собран раньше манифеста последней успешной проверки — `manifest_rollback`
        (откат на старый выпуск, В20 ревью 2.r4). Итог не удалось записать в
        журнал аудита — 503 (Н36 ревью 2.r4), итог остаётся в техническом журнале.
        Заодно всем действующим шлюзам передаётся запрос проверки (Н38 ревью 2.r4,
        запись `integrity.verify_requested`, число — `gateways_requested`): шлюз
        получает его в ответе heartbeat, проверяет себя и присылает итог; итог
        каждого шлюза пишется в журнал аудита (`integrity.check`, `trigger: manual`)
        и виден в «Состоянии системы». Запрос не записан — 503.
      security: [{ sessionCookie: [] }]
      x-permission: integrity.verify
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Итог проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityCheck' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/audit:
    get:
      summary: Записи журнала аудита за период по фильтру
      description: |
        Право `audit.read` (ТЗ 6.3 п. 11, задача 2.4a): из предустановленных ролей — у аудитора и
        администратора безопасности. Только чтение: изменить или удалить запись через API
        нельзя (УПД.2). Порядок — от новых к старым по времени и номеру записи; записи с
        нечитаемым временем (подмена в обход продукта, `ts: null`) — в начале любой выборки.
        Период — не длиннее
        31 суток (по умолчанию последние 7). Фильтры по белому списку: `action` (до 20 раз;
        точный код `auth.login` или группа `auth.*`), `actor_type`, `actor` (ID или имя
        субъекта, точное совпадение), `object_type`, `object_id`, `result`; неизвестный
        параметр — 400. Секреты в подробностях замаскированы при записи (`[скрыто]`),
        исходных значений в журнале нет. Пишет `audit.list` (отключаемое событие) после
        выборки и до ответа: в текущую страницу запись не попадает, а если записать её не
        удалось — 503 без данных (Н30 ревью 2.r3b). Одновременно — не больше 2 выборок на
        пользователя или токен и 4 на сервер, сверх этого — 429 с `Retry-After`; выборка идёт
        в отдельном пуле соединений с пределом 10 с, дольше — 503 (В17 ревью 2.r3b).
      x-permission: audit.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - name: from
          in: query
          description: Начало периода включительно (RFC 3339); по умолчанию to минус 7 суток
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/To'
        - name: action
          in: query
          description: Код события или группа `группа.*`; повторяется до 20 раз, совпадение с любым
          schema:
            type: array
            maxItems: 20
            items: { type: string, maxLength: 66 }
          style: form
          explode: true
        - name: actor_type
          in: query
          schema: { type: string, enum: [user, api_token, system, gateway, cli] }
        - name: actor
          in: query
          description: ID или имя субъекта (логин), точное совпадение
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: object_type
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: object_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: result
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/audit/verify:
    post:
      summary: Проверить цепочку журнала аудита по команде
      description: |
        Право `audit.verify` (РСБ.4, DM-43, задача 2.4a): у аудитора и администратора
        безопасности; проверка ничего не меняет, кроме записи своего итога. Выполняет ту же
        проверку, что фоновая (одна реализация, общая опора с имитовставкой головы). Если
        проверка уже идёт (фоновая или по другой команде) — 409 с `Retry-After`. Не чаще
        5 раз в минуту с адреса. Обрыв соединения проверку не прерывает; предел — 5 минут.
        Итог пишется в `audit_verifications` (раздел `audit_chain` «Состояния системы») и в
        журнал аудита (`audit.chain_verified` или `audit.chain_broken`) от имени субъекта с
        адресом. Нарушение — `ok: false` с ответом 200. Тело не нужно. Если последняя проверка
        сервера моложе 10 минут, новая не выполняется: ответ — её итог с `cached: true`, без
        записи в журнал (Н31 ревью 2.r3b); немедленная проверка — `aisec-cli audit verify`. Если последняя проверка не завершилась (сбой, истёк срок) меньше 10 минут назад — 503 с
        `Retry-After`, новая не запускается.
      x-permission: audit.verify
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Итог проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditVerification' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/setup:
    get:
      summary: Нужна ли первичная настройка
      description: Открыт. `setup_required` — в установке ещё нет ни одной учётной записи (ЗИ.4).
      security: []
      responses:
        '200':
          description: Состояние настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
    post:
      summary: Первичная настройка — создание первого администратора безопасности
      description: |
        ЗИ.4, ИАФ.1. Открыт, но требует одноразовый токен из вывода `aisec-cli init`
        (`aisec_setup_` и 43 символа base64url, срок — 24 часа). Пароль задаёт сам
        администратор, он проверяется по парольной политике. Токен гасится в одной транзакции
        с созданием учётной записи; параллельные запросы создадут ровно одного администратора.
        Неверный, истёкший или погашенный токен, а также уже выполненная настройка — 403
        без уточнения причины. Пишет `setup.completed` (успех и отказ, без токена). Сессию не
        открывает: дальше — обычный вход.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Администратор безопасности создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/auth/login:
    post:
      summary: Вход в консоль по логину и паролю
      description: |
        ИАФ.1–4, УПД.4, решение Р6. Любой отказ (нет учётной записи, неверный пароль,
        блокировка после неудач, деактивация, истёкший временный пароль) — один и тот же
        ответ 401: по ответу нельзя перебирать логины. Причина пишется в журнал аудита
        (`auth.login_failed`, `auth.locked`). При успехе выдаются cookie `__Host-aisec_session`
        (HttpOnly, Secure, SameSite=Strict) и `__Host-aisec_csrf` (Secure, SameSite=Strict,
        читается интерфейсом). Если пароль временный или истёк, сессия получает
        `session_state: password_change` — доступны только `/api/v1/me`, смена пароля и выход.
        Второй фактор (ИАФ.5): если он подключён, сессия получает `mfa_pending` (дальше —
        `/api/v1/auth/mfa/verify`), если обязателен, но не подключён — `mfa_setup`
        (`/api/v1/auth/mfa/setup`). Без ключа данных на сервере такой вход — 503.
        Тело — только `application/json`, поэтому HTML-форма с чужого сайта вход не выполнит.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Вход выполнен
          headers:
            Set-Cookie: { description: '`__Host-aisec_session` и `__Host-aisec_csrf`', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/logout:
    post:
      summary: Выход — завершение текущей сессии
      description: Право `session` (любое состояние сессии). Изменяющий запрос — с заголовком `X-CSRF-Token`. Пишет `auth.logout`.
      x-permission: session
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Сессия завершена, cookie удалены }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/auth/password:
    post:
      summary: Смена своего пароля
      description: |
        Право `self`; доступно и сессии `password_change` (ИАФ.3). Проверяются текущий
        пароль, парольная политика и история (ИАФ.2). Неверный текущий пароль считается
        неудачной попыткой (ИАФ.4): при блокировке завершаются все сессии. После смены
        остальные сессии пользователя завершаются, текущая получает полный доступ.
        Пока учётная запись заблокирована, пароль не меняется и текущий не проверяется — 409.
        Пишет `auth.password_changed`.
      x-permission: self
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Пароль изменён }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/auth/policy:
    get:
      summary: Парольная политика и настройки входа
      description: Право `auth_policy.read` (ИАФ.2, ИАФ.4, УПД.4).
      x-permission: auth_policy.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPolicy' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
    put:
      summary: Изменить парольную политику и настройки входа
      description: |
        Право `auth_policy.manage`. Все поля обязательны. Пишет `auth.policy_changed` со значениями до и после.
        Ослабление (длина, классы или история пароля меньше; срок пароля больше или бессрочный; порог блокировки
        выше; блокировка короче или по времени вместо бессрочной; бездействие, сессии, срок временного пароля
        больше; `mfa_required_all` снят) требует текущий пароль или код TOTP: без них — 400 с полем `password`,
        неверные — 403 `reauthentication_failed`; запись — с `weakening` и списком `weakened` (В24 ревью 2.r5).
      x-permission: auth_policy.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPolicyUpdate' }
      responses:
        '200':
          description: Настройки сохранены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPolicy' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/auth/mfa/setup:
    post:
      summary: Выдать секрет TOTP для подключения второго фактора
      description: |
        ИАФ.5, решения Р1, Р2, ADR-0006. Право `session`; доступно сессии `mfa_setup`
        (первый вход роли, где второй фактор обязателен) и полной сессии без подключённого
        фактора, иначе 409. Из полной сессии нужен текущий пароль (`current_password`):
        пустой — 400, неверный — 400 и неудачная попытка входа (ИАФ.4). Возвращает секрет,
        ссылку `otpauth://` и матрицу QR-кода — показываются один раз; на сервере секрет
        хранится только шифротекстом ключа данных. Повторный вызов заменяет неподтверждённый
        секрет. Пишет `auth.mfa_setup_started`. Без ключа данных на сервере — 503.
      security: [{ sessionCookie: [] }]
      x-permission: session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFASetupRequest' }
      responses:
        '200':
          description: Секрет выдан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFASetup' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/mfa/setup/confirm:
    post:
      summary: Подтвердить подключение второго фактора кодом из приложения
      description: |
        ИАФ.5. Право `session`. Код принимается один раз (шаг не меньше последнего
        принятого); неверный код — 400 и неудачная попытка входа (ИАФ.4). При успехе
        фактор подключён, выдаются 10 кодов восстановления (показываются один раз). Сессия
        `mfa_setup` заменяется новой (`active` или `password_change`) с новыми cookie, прежняя
        завершается с причиной `mfa_passed`; полная сессия остаётся прежней. Пишет `auth.mfa_enabled`.
      security: [{ sessionCookie: [] }]
      x-permission: session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFACode' }
      responses:
        '200':
          description: Фактор подключён
          headers:
            Set-Cookie: { description: 'Новые `__Host-aisec_session` и `__Host-aisec_csrf` — только при переходе из `mfa_setup`', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/mfa/verify:
    post:
      summary: Второй шаг входа — код TOTP или код восстановления
      description: |
        ИАФ.4, ИАФ.5. Право `session`; только для сессии `mfa_pending` (живёт 5 минут), иначе
        409. Ровно одно поле: `code` (6 цифр из приложения) или `recovery_code` (одноразовый,
        регистр, дефисы и пробелы не важны). Неверный код — 400 и неудачная попытка входа:
        счётчик неудач общий с паролем и до принятого кода не сбрасывается; на пороге
        учётная запись блокируется, сессии завершаются. Попытки по всем сессиям пользователя
        проверяются по очереди под блокировкой строки — параллельные запросы порог не обходят.
        При успехе сессия заменяется новой (`active` или `password_change`) с новыми cookie,
        прежняя завершается с причиной `mfa_passed`. Пишет `auth.mfa_verified` или
        `auth.recovery_code_used`.
      security: [{ sessionCookie: [] }]
      x-permission: session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFAVerify' }
      responses:
        '200':
          description: Вход выполнен
          headers:
            Set-Cookie: { description: 'Новые `__Host-aisec_session` и `__Host-aisec_csrf`', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/mfa/recovery-codes:
    post:
      summary: Выпустить новые коды восстановления
      description: |
        ИАФ.5. Право `session`; только полная сессия с подключённым фактором, по текущему коду
        TOTP. Прежние неиспользованные коды гасятся. Неверный код — 400 и неудачная попытка
        (ИАФ.4). Пишет `auth.recovery_codes_regenerated`.
      security: [{ sessionCookie: [] }]
      x-permission: session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFACode' }
      responses:
        '200':
          description: Новые коды выданы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/me:
    get:
      summary: Текущий пользователь и состояние сессии
      description: Право `session` (любое состояние сессии). Вне `/api/v1/auth/`, чтобы строгий предел частоты входа не мешал консоли.
      x-permission: session
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/users:
    get:
      summary: Список учётных записей
      description: Право `users.read`. Порядок — по времени создания.
      x-permission: users.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
    post:
      summary: Создать учётную запись с временным паролем
      description: |
        Право `users.manage` (ИАФ.1, ИАФ.3). Временный пароль генерирует сервер и
        показывает один раз; при первом входе его нужно сменить. Без `Idempotency-Key`:
        ответ с паролем не запоминается, повтор отклоняется по занятому логину (409).
        Пишет `user.create`.
      x-permission: users.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
      responses:
        '201':
          description: Учётная запись создана
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserWithPassword' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/users/{id}:
    get:
      summary: Учётная запись
      description: Право `users.read`.
      x-permission: users.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: Учётная запись
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/users/{id}/deactivate:
    post:
      summary: Деактивировать учётную запись
      description: |
        Право `users.manage` (УПД.5). Учётные записи не удаляются. Сессии завершаются.
        Нельзя деактивировать себя (422) и последнего активного администратора
        безопасности (409). Пишет `user.deactivate`.
      x-permission: users.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Учётная запись деактивирована
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/users/{id}/activate:
    post:
      summary: Повторно активировать учётную запись и снять блокировку
      description: Право `users.manage` (УПД.5, ИАФ.4). Снимает и блокировку после неудачных попыток. Пишет `user.activate`.
      x-permission: users.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Учётная запись активна
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/users/{id}/password-reset:
    post:
      summary: Сбросить пароль пользователя на временный
      description: |
        Право `users.manage` (ИАФ.3). Новый временный пароль показывается один раз,
        блокировка снимается, сессии пользователя завершаются, его токены API отзываются
        (`revoke_reason` = `password_reset`, В8 ревью 2.r2). Свой пароль так не
        сбрасывается (422). Пишет `user.password_reset`.
      x-permission: users.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Временный пароль выдан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserWithPassword' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/users/{id}/mfa/reset:
    post:
      summary: Сбросить второй фактор пользователя
      description: |
        Право `users.manage` (ИАФ.5). Секрет и коды восстановления уничтожаются, сессии
        пользователя завершаются; при следующем входе фактор подключается заново. Свой
        фактор так не сбрасывается (422); фактор не подключён — 409. Пишет `auth.mfa_reset`.
      security: [{ sessionCookie: [] }]
      x-permission: users.manage
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Второй фактор сброшен }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/users/{id}/sessions:
    get:
      summary: Незавершённые сессии пользователя
      description: Право `sessions.read` (УПД.4). Токены не выдаются.
      x-permission: sessions.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
