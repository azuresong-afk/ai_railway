        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/notify-channels/{id}/test:
    post:
      summary: Тестовая отправка в канал
      description: |
        Право `notify_channels.manage`. Одна попытка отправки тестового уведомления (в том числе в
        отключённый канал — до включения); итог — строка журнала доставки с `kind: test` и код
        ошибки без текста ответа получателя. Код теста обобщён: `dial`, `timeout`, `tls`,
        `starttls_unsupported`, `write` → `unreachable`, чтобы тест не служил сканером портов в
        сетях сервера; адрес loopback, link-local, метаданных облака — `config`, если сеть не
        разрешена параметром сервера `-notify-allowed-networks` (3Н31 ревью 3.r2). Не чаще 5 раз
        в минуту на канал — иначе 429. Пишет `notify_channel.test` (итог, код ошибки).
