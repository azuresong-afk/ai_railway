      parameters:
        - $ref: '#/components/parameters/EventID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventContentRequest' }
      responses:
        '200':
          description: Содержимое
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventContent' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/{id}/mark:
    put:
      summary: Отметить событие «ложное срабатывание» или «подтверждено»
      description: |
        Право `events.mark` (ТЗ 5.5, задача 3.22). Отметка хранится отдельно от события (событие
        неизменяемо), одна на событие: новая заменяет прежнюю. Каждая смена пишет
        `events.mark_set` (значение и прежнее значение, без текста комментария) той же
        транзакцией. `mark: none` снимает отметку (`events.mark_removed`, ответ 204; у события без
        отметки — 404). Для `false_positive` ответ содержит черновик исключения по событию
        (`draft`) — как GET `/exception-draft`. Комментарий — до 1000 символов без управляющих
        символов, кроме перевода строки.
      x-permission: events.mark
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/EventID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventMarkRequest' }
      responses:
        '200':
          description: Отметка поставлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventMarkResult' }
        '204': { description: Отметка снята }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/{id}/exception-draft:
    get:
      summary: Черновик исключения по событию
      description: |
        Право `events.read` (ТЗ 5.3, задача 3.22). Условия по находкам, давшим итоговое действие
        (все находки, если итог — allow или log): детектор, категория, шаблон (правило
        детектора), хеш фрагмента (HMAC на ключе шлюза с ID приложения; только субъекту с
        `events.content.read` или `policies.manage`), источник текста находки и приложение
        события; срок — 30 суток.
        Содержимое запроса в черновик не копируется. `base_version` — текущая версия политики
        события; `template: true` — политика события — шаблон, исключение добавляется в её копию.
        Создаёт исключение только администратор безопасности: POST `/api/v1/policies/{id}/exceptions`.
      x-permission: events.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExceptionDraft' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/export:
    post:
      summary: Выгрузка событий в CSV или JSON
      description: |
        Право `events.export` (ТЗ 5.5). Только метаданные, без содержимого; хеши фрагментов
        находок в JSON — только с `events.content.read` или `policies.manage` (3Н41). Тот же фильтр и
        период, что у списка; не больше 100 000 строк (иначе 422). Подсчёт и выгрузка — по
        одному снимку базы (транзакция REPEATABLE READ): число строк в заголовке и в аудите
        совпадает с переданным. До передачи данных пишет `data.export` с форматом, фильтром,
        периодом и числом строк; если запись не удалась — 503. Одновременно — не больше одной
        выгрузки на пользователя или токен и двух на сервер, иначе 429 с `Retry-After`; вся
        выгрузка — не дольше 2 минут. CSV: UTF-8 с BOM, разделитель — запятая, каждое поле в
        кавычках; перед `=`, `+`, `-`, `@` в начале поля и после `,`, `;`, табуляции или
        перевода строки (через пробелы и кавычки) ставится апостроф — защита от формул и при
        делении строки по «;» (русская локаль Excel). JSON — массив объектов `Event`.
      x-permission: events.export
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventExportRequest' }
      responses:
        '200':
          description: Файл выгрузки (Content-Disposition attachment)
          headers:
            X-Export-Rows: { description: Число строк в выгрузке, schema: { type: integer } }
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/stats:
    get:
      summary: Агрегаты событий по минутам или часам
      description: |
        Право `events.read` (ТЗ 5.5, 5.8). Агрегаты считает фоновое задание раз в минуту:
        данные последней минуты могут ещё не войти. `minute` — период до суток, `hour` — до
        31 суток; не больше 10 000 строк (иначе 422).
      x-permission: events.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - name: interval
          in: query
          schema: { type: string, enum: [minute, hour], default: hour }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: app
          in: query
          description: Только одно приложение
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Агрегаты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventStats' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/filters:
    get:
      summary: Свои сохранённые фильтры
      description: Право `events.read`. Фильтры личные — видны только их автору.
      x-permission: events.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Фильтры по имени
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilterList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Сохранить фильтр
      description: |
        Право `events.read`. Фильтр проверяется и хранится в канонической записи. Не больше
        50 фильтров на пользователя (422), имя уникально у пользователя (409).
      x-permission: events.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSavedFilter' }
      responses:
        '201':
          description: Фильтр сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilter' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/filters/{id}:
    delete:
      summary: Удалить свой фильтр
