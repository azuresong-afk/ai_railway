      description: |
        Право `roles.read` (УПД.1). Сначала предустановленные роли (права задаёт
        продукт, изменить их нельзя), затем свои по ID. Все роли — на одной странице.
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
