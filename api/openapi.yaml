        умолчанию в той же транзакции отзываются и токены API пользователя
        (`revoke_reason` = `sessions_revoked`, их число — в подробностях
        записи аудита); `revoke_api_tokens=false` оставляет токены.
      x-permission: sessions.manage
      security: [{ sessionCookie: [] }]
      parameters:
