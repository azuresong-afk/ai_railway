        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtectionUpdate' }
      responses:
        '200':
          description: Поля защиты изменены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
