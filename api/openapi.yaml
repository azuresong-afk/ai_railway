        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/notify-channels/{id}/deliveries:
    get:
      summary: Журнал доставки канала
      description: |
        Право `notify_channels.read`. Последние строки журнала доставки, новые сначала (`limit` — от
        1 до 200, по умолчанию 50). Без содержимого запросов и секретов. Повторы: 5 попыток с
        задержкой 30 с, 2, 8 и 10 минут; после пятой — `failed` и оповещение «Уведомление не
        доставлено» (DM-44).
