          schema: { type: integer, minimum: 1 }
        - name: comment
          in: query
          description: Комментарий к версии
          schema: { type: string, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string, maxLength: 1048576 }
          application/json:
            schema: { $ref: '#/components/schemas/PolicyImport' }
      responses:
        '200':
          description: Новая версия политики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '201':
          description: Политика создана
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/policies/test:
    post:
      summary: Проверить текст в песочнице
      description: |
        Право `policies.test` (ТЗ 5.3). Текст проверяется тем же конвейером, что Check API
        шлюза (`endpoint=check`), сохранённой версией, шаблоном или черновиком `spec`; с
        `application_id` — с режимом политики, `fail_mode`, словарями `lists`, доменами
        `output.exfil` и признаком «внешний» провайдера приложения (нужно право
        `applications.read` на это приложение). Без приложения провайдер считается внешним.
        Ничего не сохраняется: ни событие, ни текст; к модели запрос не идёт. Пишет
        необязательную запись `policy.test` без текста (РСБ.3). Тело — до 256 КиБ.
      x-permission: policies.test
