        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/policies/import:
    post:
      summary: Загрузить политику из YAML
      description: |
        Право `policies.manage`. Тело — документ YAML до 1 МиБ по строгой схеме этапа 1
        (`docs/cert/security-functions.md`, «Политики»): неизвестное поле, второй документ, лишний размер, неизвестный
        детектор — 400. Политики с таким `id` нет — создаётся (201); есть — новая версия поверх
        `base_version` (200), без него — 409. Пустой `non_text` при загрузке — `allow_unchecked`,
        как в шлюзе этапа 1. Пишет `policy.import` (сводка изменений и признак `weakening`).
        Изменение, после которого пакет конфигурации шлюзов не соберётся (например, правило `lists.*` на словарь, которого нет у приложения), — 422 с причиной и ID приложений в `detail` (В16 ревью 2.r3b).
        Версия, ослабляющая защиту (`weakening`), принимается только в обёртке JSON (`PolicyImport`) с текущим паролем
        или кодом TOTP: без них — 400 с полем `password`, неверные — 403 `reauthentication_failed` (В23 ревью 2.r5).
        В обёртке `base_version` и `comment` берутся из тела, параметры запроса не читаются.
      x-permission: policies.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: base_version
          in: query
