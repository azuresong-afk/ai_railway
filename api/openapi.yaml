  /api/v1/api-tokens:
    get:
      summary: Токены API
      description: |
        Право `api_tokens.read` (ИАФ.9). С областью `own` — только свои токены, с `all` —
        все токены организации (УПД.8). Порядок — по времени выпуска. Секретов в ответе нет.
      security: [{ sessionCookie: [] }]
      x-permission: api_tokens.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APITokenPage' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
    post:
      summary: Выпустить себе токен API
      description: |
        Право `api_tokens.manage` (ИАФ.9), только из сессии консоли. Токен действует от
        имени выпустившего: его права — пересечение указанных разрешений с текущими
        правами роли владельца, понижение роли сразу сужает токен. Разрешения с признаком
        `security` и разрешения на сами токены токену не выдаются (400); разрешение, которого
        нет у пользователя, — 403. Срок обязателен: 1–365 дней, по умолчанию 90. Не больше
        20 действующих токенов на пользователя (422). Сам токен показывается один раз, в
        журналы не попадает. Без `Idempotency-Key`: сохранённый ответ содержал бы токен.
        Нужна повторная проверка (В8 ревью 2.r2): текущий пароль (`password`) или код
        TOTP (`code`), ровно одно из двух, иначе 400. Неверное значение — 403 с кодом
        `reauthentication_failed` и неудачная попытка ИАФ.4 (общий счётчик блокировки;
        запись `api_token.create` с итогом failure или `auth.mfa_failed`).
        Пишет `api_token.create`.
      security: [{ sessionCookie: [] }]
      x-permission: api_tokens.manage
      parameters:
