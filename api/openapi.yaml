        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/alert-rules:
    get:
      summary: Правила оповещений
      description: |
        Право `alert_rules.read`. Все правила организации: встроенные (`builtin`) и созданные
        администратором, по времени создания. `effective_roles` — роли-получатели вместе с
        обязательными `security_admin` и `auditor`.
      x-permission: alert_rules.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Правила
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuleList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Создать правило оповещения
      description: |
        Право `alert_rules.manage` (признак `security`: только администратор безопасности, не
        токену). Через API создаются правила «порог» (`threshold`: фильтр событий языка
        `GET /api/v1/events` и/или наименьшая серьёзность, до 4 полей группировки) и «новое»
        (`new`: поле `model`, `provider`, `user` или `app`, ключ — его значение). Фоновая задача
        сервера раз в минуту считает «частоту» (`frequency`: условие как у «порога», `count`
        событий за `window_minutes` по ключу группировки), «аномалию» (`anomaly`: метрика `metric`
        последнего часа выше медианы того же часа недели за 2–8 недель в `factor` раз и не меньше
        `min_volume`; группировка — нет или `app`; первые 14 суток данных молчит) и «бюджет»
        (`budget`: `warn_percent` и 100 % месячного бюджета приложения, по одному оповещению на
        порог в месяц; группировка — `app`). Окно подавления после закрытия — `suppress_minutes`
        (по умолчанию 60, до 10 080). Не больше 200 правил — иначе 422. Пишет `alert_rule.create`.
      x-permission: alert_rules.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '201':
          description: Правило создано
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/alert-rules/{id}:
    get:
      summary: Правило оповещения
      description: Право `alert_rules.read`.
      x-permission: alert_rules.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/AlertRuleID'
      responses:
        '200':
          description: Правило
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      summary: Изменить правило оповещения
      description: |
        Право `alert_rules.manage`. Полная замена настроек; `version` — версия, которую открыли
        для изменения (устаревшая — 409). Вид правила не меняется. У системных правил и правил
        безопасности (`locked`) меняются только получатели; отключение и другие поля — 422.
        Ослабление (DM-40) — отключение, смена условия или группировки, повышение
        `min_severity`, понижение серьёзности, увеличение окна, удаление получателя — пишется с
        `weakening: true` и требует текущего пароля (`password`) или кода TOTP (`code`): без них
        400 (поле `password`), неверное значение — 403 `reauthentication_failed`. Изменение получателей порождает
        оповещение «Изменены получатели оповещений» (ТЗ 5.6). Без изменений — 200 без записи.
        Пишет `alert_rule.update` (до, после).
      x-permission: alert_rules.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AlertRuleID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleUpdate' }
      responses:
        '200':
          description: Правило изменено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/alert-rules/{id}/state:
    get:
      summary: Состояние правила фоновой задачи
      description: |
        Право `alert_rules.read`. Что посчитала фоновая задача сервера (раз в минуту) по правилу
        «частота», «аномалия» или «бюджет»: время вычисления, обучение базовой линии «аномалии»
        (первые 14 суток данных ключа правило молчит, `learning: true` и `learning_until`), ключи
        группировки с текущим объёмом, медианой базовой линии и числом недель в ней (не больше 50,
        всего — `keys_total`); у «бюджета» — месяц и процент расхода; у «частоты» — ключи, сработавшие
        в последнем проходе. Объёмы «аномалии» показываются только с правом `events.read`, расход
        «бюджета» — с `budgets.read`, иначе `keys` пуст и `keys_hidden: true`. У остальных видов и
        до первого вычисления — `evaluated: false`. Содержимого событий нет.
      x-permission: alert_rules.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/AlertRuleID'
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuleState' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/alert-settings:
    get:
      summary: Срок хранения оповещений
      description: Право `alert_rules.read`. Срок хранения закрытых оповещений, суток (по умолчанию 365).
      x-permission: alert_rules.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      summary: Изменить срок хранения оповещений
      description: |
        Право `alert_rules.manage`. Закрытые оповещения без инцидента старше срока удаляются фоновой
        задачей раз в час вместе со ссылками на события, историей и доставками (`alert.retention` в
        аудите); открытые и принятые в работу не удаляются никогда. Срок — от 90 до 1825 суток.
        Сокращение необратимо и требует текущего пароля (`password`) или кода TOTP (`code`): без них
        400 с полем `password`, неверное значение — 403 `reauthentication_failed`; пишется с `weakening: true` и
        порождает оповещение «Ослабление защиты» (DM-40). До первичной настройки — 409. Пишет
        `alert.settings_changed` (до, после).
      x-permission: alert_rules.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertSettingsUpdate' }
      responses:
        '200':
          description: Срок изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
