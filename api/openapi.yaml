        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/{id}/content:
    post:
      summary: Содержимое события с указанием причины
      description: |
        Право `events.content.read` (УПД.7, ТЗ 5.5). Причина обязательна: 3–500 символов.
        Каждое обращение пишет `events.content_read` с ID события и причиной до ответа; если
        запись в журнал аудита не удалась — 503, содержимое не выдаётся. Содержимое `full`
