        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotifyChannelInput' }
      responses:
        '201':
          description: Канал создан
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyChannel' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/notify-channels/{id}:
    get:
      summary: Канал уведомлений
      description: Право `notify_channels.read`. Без секретов.
      x-permission: notify_channels.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/NotifyChannelID'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyChannel' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      summary: Изменить канал уведомлений
      description: |
        Право `notify_channels.manage`. Полная замена настроек; `version` — версия, которую открыли
        для изменения (устаревшая — 409). Тип канала не меняется. Секрет, не переданный в `secrets`,
        остаётся прежним; пустая строка удаляет необязательный секрет. Каналы не удаляются —
        отключаются. Ослабление (DM-40) — отключение, повышение `min_severity`, смена узла, порта или
        адреса webhook, смена корневых сертификатов, удаление адресата письма, снятие подписки на
        журнал аудита (`audit_stream`), смена ключа подписи webhook или формата syslog, удаление
        пароля SMTP (вместе с логином) — пишется с
        `weakening: true` и требует текущего пароля (`password`) или кода TOTP (`code`): без них
        400 с полем `password`, неверное значение — 403 `reauthentication_failed`. Пишет `notify_channel.update` (до,
        после, какие секреты изменены — без значений).
      x-permission: notify_channels.manage
