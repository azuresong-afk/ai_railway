      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/FilterID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Фильтр удалён }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/settings:
    get:
      summary: Сроки хранения событий
      description: Право `events.read` (ТЗ 5.5).
      x-permission: events.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Сроки хранения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventRetention' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      summary: Изменить сроки хранения событий
      description: |
        Право `events.retention.manage` (ТЗ 5.5). Метаданные — 30–3650 суток, содержимое —
        7–3650 и не дольше метаданных. Изменение и запись `events.settings_changed` (до, после,
        признак сокращения `reduced`) — одной транзакцией. Данные старше нового срока удаляет
        фоновое задание целыми суточными секциями (раз в час).
        Сокращение любого срока необратимо удаляет данные и требует повторной проверки
        (В13 ревью 2.r3a): текущий пароль (`password`) или код TOTP (`code`), ровно одно из
        двух, иначе 400. Неверное значение — 403 с кодом `reauthentication_failed` и неудачная
        попытка ИАФ.4 (общий счётчик блокировки; запись `events.settings_changed` с итогом
        failure или `auth.mfa_failed`). Увеличение и сохранение тех же сроков — без проверки.
        Только из сессии консоли.
      x-permission: events.retention.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventRetentionInput' }
      responses:
        '200':
          description: Сроки изменены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventRetention' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/providers:
    get:
      summary: Провайдеры
      description: |
        Право `providers.read` (ТЗ 5.4). Все провайдеры организации по `slug`, не больше 1000.
        Учётных данных в ответе нет — только признак `credential_set` и время установки.
      x-permission: providers.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Список провайдеров
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Создать провайдера
      description: |
        Право `providers.manage` (ТЗ 5.4). Новый провайдер всегда внешний (`external: true`);
        снять признак можно только отдельным действием с правом `providers.external`.
        Корневые сертификаты (`ca_pem`, до 256 КиБ) обязательны: доверие системному хранилищу —
        только его содержимым. Учётные данные задаются отдельно (`PUT …/credentials`).
        `slug` — ID провайдера в пакете для шлюзов, неизменяем. Пишет `provider.create`.
      x-permission: providers.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewProvider' }
      responses:
        '201':
          description: Провайдер создан
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/providers/{id}:
    get:
      summary: Провайдер
      description: Право `providers.read`. Учётных данных в ответе нет.
      x-permission: providers.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProviderID'
      responses:
        '200':
          description: Провайдер
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      summary: Изменить провайдера
      description: |
        Право `providers.manage`. Меняются все поля, кроме `slug`, признака «внешний» и
        учётных данных. Смена адресата — узла (схема, хост, порт) `base_url` или `auth_url`,
        `ca_pem` или `type` — сбрасывает учётные данные и возвращает признак «внешний» (В14
        ревью 2.r3b): их задают заново, снятие признака — снова через `PUT …/external`. Пишет
        `provider.update` (до и после, без учётных данных; сертификаты — только размером; при
        смене адресата — `credential_reset`, `external_reset`).
      x-permission: providers.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderFields' }
      responses:
        '200':
          description: Провайдер изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      summary: Удалить провайдера
      description: |
        Право `providers.manage`. Только провайдера, который не указан ни в одном приложении,
        в том числе архивном (иначе 409). Зашифрованные учётные данные удаляются вместе с ним.
        Пишет `provider.delete`.
      x-permission: providers.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Провайдер удалён }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/providers/{id}/credentials:
    put:
      summary: Задать учётные данные провайдера
      description: |
        Право `providers.manage` (ЗИ.1). Ключ API или авторизационные данные (до 16 КиБ)
        шифруются ключом данных с AAD `providers|credential|<id>` и не возвращаются ни в одном
        ответе; в журналы не попадают. Без ключа данных — 503. Пишет `provider.credentials_set`
        (только признак замены).
      x-permission: providers.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCredential' }
      responses:
        '200':
          description: Учётные данные сохранены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/providers/{id}/external:
    put:
      summary: Изменить признак «внешний»
      description: |
        Право `providers.external` (признак `security`: только администратор безопасности,
        токену API недоступно). Снятие признака — ослабление защиты (DM-40): в режиме `monitor`
        данные к провайдеру больше не маскируются. Причина обязательна. Снятие признака требует
        повторной проверки (Н32 ревью 2.r3b): текущий пароль (`password`) или код TOTP (`code`),
        ровно одно из двух, иначе 400; неверное значение — 403 `reauthentication_failed`. Пишет
        `provider.external_changed` с `weakening: true` при снятии; без изменения — 200 без записи.
      x-permission: providers.external
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderExternal' }
      responses:
        '200':
          description: Признак изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
