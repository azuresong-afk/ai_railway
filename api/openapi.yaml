      summary: Бюджет и расход приложения
      description: Право `budgets.read`. Бюджет (или `null`) и расход приложения за месяц `month`.
      x-permission: budgets.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/BudgetMonth'
      responses:
        '200':
          description: Бюджет и расход
          content:
