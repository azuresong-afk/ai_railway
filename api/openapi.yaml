        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/incidents/{id}/export:
    get:
      summary: Выгрузить карточку инцидента в JSON
      description: |
        Право `incidents.export` (ТЗ 5.7). Карточка в формате `aisec-incident/1` для передачи в
        SIEM или IRP заказчика (ГосСОПКА — через его сертифицированные системы, ТЗ 10.1): поля,
        этапы, хронология, комментарии, оповещения и ссылки на события, без содержимого событий.
        Файл `incident-<номер>.json`. Запись `data.export` пишется до выдачи данных.
      x-permission: incidents.export
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentID'
      responses:
        '200':
          description: Карточка
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDocument' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/incident-categories:
    get:
      summary: Категории инцидентов и инструкции реагирования
      description: |
        Право `incidents.read`. Категории ТЗ 5.7 со строками матрицы обнаружения (ТЗ 5.16), из
        которых они выводятся, и действующей инструкцией: `default` — текст по умолчанию.
      x-permission: incidents.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentCategoryList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/incident-categories/{category}:
    put:
      summary: Изменить инструкцию реагирования
      description: |
        Право `incident_categories.manage` (признак `security`: только администратор безопасности,
        не токену). Новая версия текста (до 8000 символов); прежние версии хранятся. `version` —
        версия, открытая для правки (у текста по умолчанию — 1); устаревшая — 409. Без изменений —
        200 без записи. Пишет `incident_category.update` (версии до и после).
      x-permission: incident_categories.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - name: category
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IncidentCategoryID' }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentInstructionsUpdate' }
      responses:
        '200':
          description: Инструкция сохранена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentInstruction' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/notify-channels/{id}/audit-stream:
    get:
      summary: Передача журнала аудита в SIEM
      description: |
        Право `notify_channels.read`. Состояние передачи журнала аудита в канал с подпиской
        `audit_stream` (РСБ.6, задача 3.14 этапа 3, ADR-0020 п. 15): последняя переданная запись
        (`last_seq`), конец журнала (`head_seq`), не передано записей (`pending`) и время самой
        старой из них, неудачные попытки подряд и код последней ошибки. Записи передаются по порядку
        `seq`, с момента подписки; при недоступности приёмника повторы бессрочны (задержка до 10
        минут), записи не теряются — источник истины сам журнал. `lagging` — отставание выше порога
        DM-44: не передано больше 10 000 записей или самая старая из них старше 15 минут; при
        возникновении и снятии пишется `system.alert` (`audit_stream_lag:<ID канала>`), возникшее
        условие поднимает оповещение встроенного правила `system.audit_stream_lag`. Без подписки —
        `subscribed: false` и нули.
      x-permission: notify_channels.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/NotifyChannelID'
      responses:
        '200':
          description: Состояние передачи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditStreamState' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/reports/{kind}:
    get:
      summary: Отчёт за период
      description: |
        Право `reports.read` (владелец приложения — на своих приложениях). Виды: `summary` (сводный),
        `incidents` (по инцидентам), `pilot` («Итоги пилота», сценарий S10). Данные — только агрегаты
        дашбордов, инциденты, оповещения, бюджеты и отметки аналитиков: содержимого запросов и ответов
        и значений находок в отчёте нет. Период — `from` и `to`, дни `ГГГГ-ММ-ДД` часового пояса
        установки, оба включительно; начало не в будущем, конец позже сегодняшнего урезается до
        сегодняшнего дня, не больше 366 суток. `format`: `html` (по умолчанию; страница для просмотра
        и печати в PDF средствами браузера, без скриптов, со своей политикой CSP и допустимой рамкой
        консоли того же адреса), `csv` (UTF-8 с BOM, защита от формул), `xlsx` (один лист, без формул
        и макросов). `app` — slug приложения: отчёт только по нему (инциденты, оповещения и бюджеты в
        сводный отчёт по приложению не входят). Владельцу приложения доступен только `summary` с `app`
        своего приложения; чужое приложение — 404, другой вид — 403. Каждая выгрузка пишет
        `data.export` до выдачи данных (DM-41); без записи отчёт не выдаётся (503). Одновременно — одна
        выгрузка на пользователя, сверх предела 429. Без `from` и `to` — последние 30 суток по сегодняшний
        день; одна дата без другой — 400.
      x-permission: reports.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - name: kind
          in: path
          required: true
          description: Вид отчёта
          schema: { type: string, enum: [summary, incidents, pilot] }
        - name: from
          in: query
          required: false
          description: Первый день периода, ГГГГ-ММ-ДД; вместе с `to`
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        - name: to
          in: query
          required: false
          description: Последний день периода включительно, ГГГГ-ММ-ДД; вместе с `from`
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [html, csv, xlsx], default: html }
        - name: app
          in: query
          required: false
          description: Slug приложения
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
      responses:
        '200':
          description: Отчёт; `X-Export-Rows` — число строк данных
          headers:
            X-Export-Rows: { schema: { type: integer } }
          content:
            text/html: { schema: { type: string } }
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/report-schedules:
    get:
      summary: Расписания рассылки отчётов
      description: Право `reports.schedules.read`. Все расписания установки (не больше 50).
      x-permission: reports.schedules.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Расписания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportScheduleList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Создать расписание рассылки отчёта
      description: |
        Право `reports.schedules.manage`. Периодичность: `daily`, `weekly` (с `weekday`, 1 —
        понедельник … 7 — воскресенье), `monthly` (с `day`, 1–28). Время `at` (ЧЧ:ММ) — в часовом
        поясе установки. Отчёт за предыдущие полные сутки, неделю (понедельник–воскресенье) или
        календарный месяц; во вложении HTML или XLSX. Получатели и сервер SMTP — почтовый канал
        уведомлений (`channel_id`, включённый, с получателями). Пропущенный после простоя запуск
        отправляется один раз. Не больше 50 расписаний — иначе 422; повтор названия — 400. Пишет
        `report_schedule.create`.
      x-permission: reports.schedules.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportScheduleInput' }
      responses:
        '201':
          description: Расписание создано
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSchedule' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/report-schedules/{id}:
    get:
      summary: Расписание рассылки отчёта
      description: Право `reports.schedules.read`.
      x-permission: reports.schedules.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportScheduleID'
      responses:
        '200':
          description: Расписание
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSchedule' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      summary: Изменить расписание рассылки отчёта
      description: |
        Право `reports.schedules.manage`. Полная замена настроек; `version` — версия, которую открыли
        для изменения (устаревшая — 409). Ближайший запуск пересчитывается от текущего момента. Пишет
        `report_schedule.update` (до и после).
      x-permission: reports.schedules.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportScheduleID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportScheduleInput' }
      responses:
        '200':
          description: Расписание изменено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSchedule' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      summary: Удалить расписание рассылки отчёта
      description: Право `reports.schedules.manage`. Удаляет расписание вместе с его журналом рассылки. Пишет `report_schedule.delete`.
      x-permission: reports.schedules.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportScheduleID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Расписание удалено
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/report-schedules/{id}/runs:
    get:
      summary: Журнал рассылки расписания
      description: |
        Право `reports.schedules.read`. Последние 100 запусков, новые сначала: период отчёта, число
        попыток (не больше 5, задержки 30 с, 2 мин, 8 мин, 10 мин), статус и код ошибки без текста
        ответа почтового сервера.
      x-permission: reports.schedules.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportScheduleID'
      responses:
        '200':
          description: Журнал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRunList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/report-channels:
    get:
      summary: Почтовые каналы для рассылки отчётов
      description: |
        Право `reports.schedules.manage`. Включённые почтовые каналы уведомлений с получателями —
        только ID и название, без адресов и настроек сервера: тот, кто ведёт расписания, выбирает
        канал без права `notify_channels.read`.
      x-permission: reports.schedules.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Каналы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportChannelList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    appKey:
      type: http
      scheme: bearer
      description: Ключ приложения `aisec_<префикс>_<секрет>` (ИАФ.8)
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-aisec_session
      description: Сессия веб-консоли (HttpOnly, Secure, SameSite=Strict); изменяющие запросы — с CSRF-токеном
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Токен API `aisec_pat_<префикс>_<секрет>` для автоматизации (ИАФ.9). С заголовком
        `Authorization` cookie не проверяется, CSRF не нужен. Права — пересечение области
        токена с правами роли владельца; разрешения своих данных (`self`, `session`), с
        признаком `security` и на токены токену недоступны. Операции, доступные токену,
        перечисляют `bearerToken` в `security`. Каждый запрос пишет `api_token.used`.
  parameters:
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из `next_cursor` предыдущей страницы
      schema: { type: string, maxLength: 256 }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Значение cookie `__Host-aisec_csrf` (двойная отправка, решение Р6); без него изменяющий запрос сессии — 403
      schema: { type: string, minLength: 43, maxLength: 43 }
    UserID:
      name: id
      in: path
      required: true
      description: ID учётной записи (UUID)
      schema: { type: string, format: uuid }
    RoleID:
      name: id
      in: path
      required: true
      description: ID роли
      schema: { $ref: '#/components/schemas/Role' }
    APITokenID:
      name: id
      in: path
      required: true
      description: ID токена API (UUID)
      schema: { type: string, format: uuid }
    EventID:
      name: id
      in: path
      required: true
      description: ID события (UUIDv7)
      schema: { type: string, format: uuid }
    ProviderID:
      name: id
      in: path
      required: true
      description: ID провайдера (UUID)
      schema: { type: string, format: uuid }
    PriceID:
      name: id
      in: path
      required: true
      description: ID цены модели (UUID)
      schema: { type: string, format: uuid }
    BudgetMonth:
      name: month
      in: query
      description: Месяц «ГГГГ-ММ» в часовом поясе установки; по умолчанию текущий
      schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
    ApplicationID:
      name: id
      in: path
      required: true
      description: ID приложения (UUID)
      schema: { type: string, format: uuid }
    ExceptionID:
      name: exc
      in: path
      required: true
      description: ID исключения политики
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    PolicyID:
      name: id
      in: path
      required: true
      description: ID политики или шаблона
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    AppKeyID:
      name: id
      in: path
      required: true
      description: ID ключа приложения (UUID)
      schema: { type: string, format: uuid }
    FilterID:
      name: id
      in: path
      required: true
      description: ID сохранённого фильтра (UUIDv7)
      schema: { type: string, format: uuid }
    AlertID:
      name: id
      in: path
      required: true
      description: ID оповещения (UUIDv7)
      schema: { type: string, format: uuid }
    AlertRuleID:
      name: id
      in: path
      required: true
      description: ID правила оповещения (UUIDv7)
      schema: { type: string, format: uuid }
    ReportScheduleID:
      name: id
      in: path
      required: true
      description: ID расписания рассылки отчёта (UUIDv7)
      schema: { type: string, format: uuid }
    NotifyChannelID:
      name: id
      in: path
      required: true
      description: ID канала уведомлений (UUIDv7)
      schema: { type: string, format: uuid }
    IncidentID:
      name: id
      in: path
      required: true
      description: ID инцидента (UUIDv7)
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      description: Начало периода включительно (RFC 3339); по умолчанию to минус 24 часа
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Конец периода, не включая (RFC 3339); по умолчанию — текущее время
      schema: { type: string, format: date-time }
    DashPeriod:
      name: period
      in: query
      description: Именованный период дашборда; не сочетается с from и to. По умолчанию 24h
      schema: { type: string, enum: ['15m', '1h', '24h', '7d', '30d'] }
    DashFrom:
      name: from
      in: query
      description: Начало произвольного периода (RFC 3339); вместе с to
      schema: { type: string, format: date-time }
    DashTo:
      name: to
      in: query
      description: Конец произвольного периода, не включая (RFC 3339); по умолчанию и в будущем — текущий момент
      schema: { type: string, format: date-time }
    DashFeed:
      name: feed
      in: query
      description: '«Лента решений»: all — все решения, actions — только с действием (по умолчанию)'
      schema: { type: string, enum: [all, actions] }
    EventFilter:
      name: filter
      in: query
      description: Фильтр событий (язык — в описании GET /api/v1/events), до 2048 байт
      schema: { type: string, maxLength: 2048 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Ключ повторяемости создающего запроса, 1–64 символа `[A-Za-z0-9._-]`
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
  headers:
    EventId:
      description: Идентификатор события check или gateway_request
      schema: { type: string }
    Decision:
      description: Что сделано с текстом
      schema: { type: string, enum: [allow, redact, pseudonymize, block] }
  responses:
    InvalidRequest:
      description: Ошибка запроса или провайдера в формате OpenAI
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Ключ приложения не принят (`invalid_api_key`)
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QuotaExceeded:
      description: Превышена квота приложения (`quota_exceeded`), исчерпан жёсткий месячный бюджет приложения (`budget_exceeded`, `Retry-After` — до начала следующего месяца в часовом поясе установки; только chat/completions и embeddings, задача 3.18) или частота неудачных попыток аутентификации с адреса клиента (`auth_rate_limited`, тип `rate_limit_error`, DM-38)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AppNotConfigured:
      description: Ключ принят, но приложение не настроено в шлюзе (`app_not_configured`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Внутренняя ошибка шлюза (`internal_error`); текст не проверен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CheckUnavailable:
      description: Проверка не состоялась при `fail_closed` (`check_unavailable`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProblemUnauthorized:
      description: Требуется вход (`unauthorized`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemForbidden:
      description: Недостаточно прав (`forbidden`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemInternal:
      description: Внутренняя ошибка (`internal_error`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemInvalid:
      description: Неверный запрос (`invalid_request`); ошибки полей — в `errors`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemNotFound:
      description: Не найдено (`not_found`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemConflict:
      description: Конфликт с состоянием (`conflict`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemUnprocessable:
      description: Действие недопустимо (`unprocessable`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemTooLarge:
      description: Тело запроса больше допустимого (`payload_too_large`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemUnsupportedMedia:
      description: Тело не в формате JSON (`unsupported_media_type`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Превышен предел частоты запросов (`rate_limited`, ЗИ.6)
      headers:
        Retry-After: { description: Через сколько секунд повторить, schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Сервер не готов (`service_unavailable`)
      headers:
        Retry-After: { description: Через сколько секунд повторить, schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
    SystemInfo:
      type: object
      required: [version]
      properties:
        version: { type: string }
    SystemStatus:
      type: object
      required: [generated_at, server, gateways, events, time, storage, audit_chain, bundle, notifications, unavailable]
      additionalProperties: false
      properties:
        generated_at: { type: string, format: date-time }
        server:
          type: object
          required: [version, started_at, selftest, integrity]
          additionalProperties: false
          properties:
            version: { type: string }
            started_at: { type: string, format: date-time }
            selftest:
              oneOf: [{ $ref: '#/components/schemas/StatusReport' }, { type: 'null' }]
            integrity:
              type: array
              items: { $ref: '#/components/schemas/StatusIntegrity' }
        gateways:
          type: array
          items: { $ref: '#/components/schemas/StatusGateway' }
        events:
          type: object
          description: Суммы счётчиков по шлюзам, каждый — с последнего запуска шлюза
          required: [dropped, rejected]
          additionalProperties: false
          properties:
            dropped: { type: integer, minimum: 0, description: 'Отброшены шлюзом: очередь переполнена (DM-44)' }
            rejected: { type: integer, minimum: 0, description: Отклонены сервером }
        time:
          type: object
          required: [server_time, timezone, sync, error_micros]
          additionalProperties: false
          properties:
            server_time: { type: string, format: date-time, description: Время сервера в UTC }
            timezone: { type: string, description: 'Часовой пояс показа, имя IANA (ВРМ.2)' }
            sync: { type: string, enum: [synchronized, unsynchronized, unknown] }
            error_micros: { type: [integer, 'null'], minimum: 0, description: 'Оценка ошибки времени ядром, мкс' }
        storage:
          type: object
          description: Заполнение журнала аудита (РСБ.5)
          required: [available, audit_bytes, limit_bytes, used_percent, warn_percent, warn_exceeded]
          additionalProperties: false
          properties:
            available: { type: boolean, description: 'Размер определён; иначе остальные поля — только настройки' }
            audit_bytes: { type: integer, minimum: 0 }
            limit_bytes: { type: integer, minimum: 1 }
            used_percent: { type: integer, minimum: 0, maximum: 100 }
            warn_percent: { type: integer, minimum: 1, maximum: 100 }
            warn_exceeded: { type: boolean }
        audit_chain:
          description: 'Последняя проверка цепочки журнала аудита — фоновая или aisec-cli audit verify (РСБ.4); null — проверок не было'
          oneOf:
            - type: 'null'
            - type: object
              required: [checked_at, ok, checked, last_seq, reason, broken_seq]
              additionalProperties: false
              properties:
                checked_at: { type: string, format: date-time }
                ok: { type: boolean }
                checked: { type: integer, minimum: 0, description: Проверено записей }
                last_seq: { type: integer, minimum: 0, description: Последняя проверенная запись }
                reason:
                  type: string
                  enum: [ok, hash_mismatch, prev_mismatch, gap, head_missing, tail_truncated, rewritten, alg_mismatch,
                    invalid_record, checkpoint_invalid, anchor_forged]
                broken_seq: { type: [integer, 'null'], minimum: 0, description: 'Запись, на которой цепочка нарушена' }
        bundle:
          description: 'Пакет конфигурации шлюзов (ОЦЛ.3; В16, Н28 ревью 2.r3b); null — сервер без внутреннего порта для шлюзов'
          oneOf:
            - type: 'null'
            - type: object
              required: [version, etag, built_at, complete, excluded, lagging]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 0, description: 'Текущая корректная версия; 0 — её нет' }
                etag: { type: string }
                built_at: { type: [string, 'null'], format: date-time }
                complete: { type: boolean, description: 'В версии все действующие приложения' }
                reason: { type: string, description: 'Почему содержимое не собрано целиком (например, размер); шлюзам выдаётся прежняя версия' }
                excluded:
                  type: array
                  description: 'Приложения, исключённые из пакета: шлюз принимает их ключи и отвечает 503 app_unavailable'
                  items:
                    type: object
                    required: [application, reason]
                    additionalProperties: false
                    properties:
                      application: { type: string }
                      reason: { type: string }
                lagging:
                  type: array
                  description: 'Шлюзы на связи, которые дольше 10 минут работают на другой версии'
                  items: { type: string }
        notifications:
          type: array
          items:
            type: object
            required: [condition, requirement, title, active, since, count]
            additionalProperties: false
            properties:
              condition:
                type: string
                enum: [account_lockout, access_denied, audit_chain, audit_storage, integrity, time_sync, config_bundle, config_bundle_lag, test_build,
                  gateway_offline, events_dropped, reports_stale, cert_expiry, gateway_clock, gateway_tls, ca_expiry, customer_cert_expiry, alert_job_stale]
                description: 'gateway_clock (ВРМ.1) — часы шлюза на связи в последнем heartbeat расходятся с часами сервера больше чем на минуту, 3Н40 ревью 3.r3. gateway_tls (ЗИ.4) — шлюз на текущем пакете конфигурации дольше 10 минут после его сборки отвечает приложениям не тем сертификатом, что загружен в консоли (по часам шлюза он ещё не действует или истёк; без сертификата заказчика — не своим), 3Н43 ревью 3.r3. alert_job_stale (РСБ.7, DM-44) — фоновая задача правил «частота», «аномалия» и «бюджет» не отмечала проход дольше 5 минут при работающем сервере, 3В17 ревью 3.r2. ca_expiry (ИАФ.10) — действующему корню внутреннего УЦ осталось 60 суток и меньше, нужна ротация `aisec-cli keys rotate-ca`; system.alert пишется за 60 суток (ca_expiry) и за 7 суток (ca_expiry:critical), 3В5 ревью 3.r1. customer_cert_expiry (ЗИ.4) — сертификату заказчика для адреса шлюза осталось 30 суток и меньше; system.alert пишется за 30 суток (customer_cert_expiry) и за 7 суток (customer_cert_expiry:critical), задача 3.27'
              requirement: { type: string, enum: [ИАФ.4, ИАФ.10, УПД.6, РСБ.4, РСБ.5, РСБ.7, ОЦЛ.1, ОЦЛ.3, ОЦЛ.5, ВРМ.1, ЗИ.4] }
              components:
                type: array
                items: { type: string }
                description: 'Компоненты с активным условием (integrity — server или gateway:<ID>, config_bundle_lag, gateway_offline, events_dropped, reports_stale, cert_expiry — gateway:<ID>); каждое ведётся отдельно и пишется в system.alert (В18 ревью 2.r3b), а возникшее условие порождает оповещение системного правила (задача 3.11 этапа 3, DM-42–DM-44). test_build (ОЦЛ.1) — компоненты, собранные с тестовым ключом манифеста (Н34 ревью 2.r4); integrity шлюза поднимает и откат выпуска, и чужой ключ проверки пакетов (В19, В20 ревью 2.r4). DM-44: gateway_offline — шлюз не на связи дольше трёх периодов heartbeat, events_dropped — счётчик отброшенных событий вырос за 15 минут, cert_expiry — сертификат истекает меньше чем через 14 суток, reports_stale — итог целостности старше двух часов или не приходит (Н29)'
              title: { type: string }
              active: { type: boolean }
              since: { type: [string, 'null'], format: date-time, description: 'Когда условие возникло; у ИАФ.4 и УПД.6 не задаётся' }
              count: { type: [integer, 'null'], minimum: 0, description: 'Число событий за 24 часа (только ИАФ.4 и УПД.6)' }
        unavailable:
          type: array
          items: { type: string, enum: [integrity, gateways, events, storage, audit_chain, bundle, notifications] }
    StatusReport:
      type: object
      required: [ok, checked_at, failed]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        checked_at: { type: string, format: date-time }
        reason: { type: string, description: 'Причина итога целостности; у самотеста не задаётся' }
        failed: { type: integer, minimum: 0 }
        stale: { type: boolean, description: 'Итог старше двух периодов проверки — «нет данных» (Н29); только у целостности шлюза' }
    StatusIntegrity:
      type: object
      required: [component, trigger, checked_at, ok, reason, manifest_version, test_signed, failed]
      additionalProperties: false
      properties:
        component: { type: string }
        trigger: { type: string, enum: [startup, periodic, manual] }
        checked_at: { type: string, format: date-time }
        ok: { type: boolean }
        reason: { type: string }
        manifest_version: { type: string }
        test_signed: { type: boolean }
        failed: { type: integer, minimum: 0, description: 'Число нарушений, включая не вошедшие в список' }
    StatusGateway:
      type: object
      required: [id, name, state, last_seen_at, version, bundle_etag, cert_not_after, selftest, integrity, events]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        state:
          type: string
          enum: [online, offline, pending, revoked]
          description: '`offline` — нет heartbeat дольше трёх периодов (90 секунд) или контакта не было'
        last_seen_at: { type: [string, 'null'], format: date-time }
        version: { type: string }
        bundle_etag: { type: string }
        cert_not_after: { type: [string, 'null'], format: date-time }
        selftest:
          oneOf: [{ $ref: '#/components/schemas/StatusReport' }, { type: 'null' }]
        integrity:
          oneOf: [{ $ref: '#/components/schemas/StatusReport' }, { type: 'null' }]
        events:
          oneOf:
            - type: object
              required: [dropped, rejected, started_at, reported_at]
              additionalProperties: false
              properties:
                dropped: { type: integer, minimum: 0 }
                rejected: { type: integer, minimum: 0 }
                started_at: { type: string, format: date-time, description: Запуск шлюза }
                reported_at: { type: string, format: date-time }
            - type: 'null'
    IntegrityList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IntegrityCheck' }
    IntegrityCheck:
      type: object
      description: Итог проверки целостности компонента (ОЦЛ.2, ОЦЛ.5, DM-42)
      required: [component, trigger, checked_at, ok, reason, manifest_version, manifest_created, test_signed, checked_files, failures, omitted]
      additionalProperties: false
      properties:
        component: { type: string, description: 'server, gateway или cli' }
        trigger: { type: string, enum: [startup, periodic, manual] }
        checked_at: { type: string, format: date-time }
        ok: { type: boolean }
        reason:
          type: string
          enum: [ok, manifest_missing, manifest_invalid, signature_invalid, files_mismatch, manifest_rollback]
          description: '`manifest_rollback` — манифест подписан верно, но собран раньше манифеста последней успешной проверки (откат выпуска)'
        manifest_version: { type: string, description: 'Версия продукта из манифеста; пусто, если манифест не принят' }
        manifest_created: { type: [string, 'null'], format: date-time, description: 'Время сборки манифеста; null, если манифест не принят' }
        test_signed: { type: boolean, description: 'Сборка с тестовым ключом манифеста — не для поставки' }
        checked_files: { type: integer, minimum: 0 }
        failures:
          type: array
          maxItems: 100
          items:
            type: object
            required: [path, problem]
            additionalProperties: false
            properties:
              path: { type: string }
              problem:
                type: string
                enum: [modified, size, missing, extra, not_regular, unreadable, no_entry, changed]
        omitted: { type: integer, minimum: 0, description: 'Сколько нарушений не вошло в failures' }
        gateways_requested: { type: integer, minimum: 0, description: 'Только в ответе на проверку по команде: скольким действующим шлюзам передан запрос проверки (Н38 ревью 2.r4)' }
    SetupStatus:
      type: object
      required: [setup_required]
      additionalProperties: false
      properties:
        setup_required: { type: boolean }
    GatewayRegisterRequest:
      type: object
      required: [token, csr]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 128, format: password, description: 'Токен из вывода aisec-cli gateway token' }
        csr: { type: string, minLength: 1, maxLength: 16384, description: 'CSR (PKCS#10) в PEM на ключ ECDSA P-256' }
        bundle_key:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: |
            Открытый ключ получателя секретов пакета конфигурации (X25519, 32 байта,
            base64url без дополнения; ADR-0018, п. 7). Сервер закрепляет его за шлюзом:
            пакет для другого ключа не выдаётся (409 `bundle_key_mismatch` на внутреннем
            порту). Нет поля — ключ закрепляется при первом запросе пакета.
    GatewayRegistration:
      type: object
      required: [gateway_id, name, certificate, ca_certificate, not_after]
      properties:
        gateway_id: { type: string, format: uuid, description: 'ID шлюза; он же CN сертификата' }
        name: { type: string }
        certificate: { type: string, description: 'Клиентский сертификат шлюза в PEM' }
        ca_certificate: { type: string, description: 'Сертификат внутреннего УЦ в PEM' }
        not_after: { type: string, format: date-time }
    SetupRequest:
      type: object
      required: [token, login, display_name, password]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 128, format: password, description: 'Токен из вывода aisec-cli init' }
        login: { type: string, minLength: 1, maxLength: 256 }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
        timezone:
          type: string
          maxLength: 64
          default: Europe/Moscow
          description: 'Часовой пояс показа времени (ВРМ.2), имя IANA; «Local» не принимается. Хранение — всегда UTC'
        retention_mode:
          type: string
          enum: [none, masked, full]
          default: masked
          description: 'Режим хранения содержимого по умолчанию для новых приложений (ТЗ 5.5)'
    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login: { type: string, minLength: 1, maxLength: 256, description: 'Логин без учёта регистра: латиница, цифры, «.», «_», «-», до 64 символов' }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, description: 'По парольной политике (ИАФ.2), не совпадает с текущим и последними из истории' }
    AuthPolicy:
      type: object
      additionalProperties: false
      required: [password_min_length, password_min_classes, password_history, password_max_age_days,
                 password_warn_days, lockout_threshold, lockout_minutes, session_idle_minutes,
                 session_max_per_user, temp_password_hours, mfa_required_all]
      properties:
        password_min_length: { type: integer, minimum: 8, maximum: 64, default: 12 }
        password_min_classes: { type: integer, minimum: 1, maximum: 4, default: 3, description: 'Строчные, прописные, цифры, прочие символы' }
        password_history: { type: integer, minimum: 0, maximum: 24, default: 5 }
        password_max_age_days: { type: integer, minimum: 0, maximum: 365, default: 90, description: '0 — бессрочно' }
        password_warn_days: { type: integer, minimum: 0, maximum: 60, default: 14 }
        lockout_threshold: { type: integer, minimum: 3, maximum: 20, default: 5 }
        lockout_minutes: { type: integer, minimum: 0, maximum: 1440, default: 15, description: '0 — до разблокировки администратором' }
        session_idle_minutes: { type: integer, minimum: 1, maximum: 240, default: 15 }
        session_max_per_user: { type: integer, minimum: 1, maximum: 20, default: 5 }
        temp_password_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }
        mfa_required_all: { type: boolean, default: false, description: 'Второй фактор обязателен для всех ролей (для security_admin и system_admin — всегда)' }
    InstallSettings:
      type: object
      required: [timezone, retention_mode]
      properties:
        timezone: { type: string, maxLength: 64, description: 'Часовой пояс показа времени, имя IANA (ВРМ.2); хранение всегда в UTC', example: Europe/Moscow }
        retention_mode: { type: string, enum: [none, masked, full], description: 'Режим хранения содержимого для новых приложений без явного выбора (ТЗ 5.5)' }
    InstallSettingsUpdate:
      allOf:
        - type: object
          properties:
            timezone: { type: string, maxLength: 64, description: 'Имя IANA, например Europe/Moscow или UTC; пусто — без изменений' }
            retention_mode: { type: string, enum: ['', none, masked, full], description: 'Пусто — без изменений' }
        - $ref: '#/components/schemas/Reauth'
    AuthPolicyUpdate:
      allOf:
        - $ref: '#/components/schemas/AuthPolicy'
        - $ref: '#/components/schemas/Reauth'
    Role:
      type: string
      pattern: '^[a-z][a-z0-9_]{2,47}$'
      description: |
        ID роли. Предустановленные: `security_admin`, `system_admin`, `analyst`, `auditor`,
        `app_owner` (ТЗ 1.3); свои роли — латиница, цифры и «_» (УПД.1).
    Permission:
      type: object
      required: [name, title, group, security, ownable]
      properties:
        name: { type: string, description: 'Имя разрешения, например `users.read`' }
        title: { type: string }
        group: { type: string, description: Раздел консоли }
        security: { type: boolean, description: 'Управление функциями безопасности: администратору системы не выдаётся (УПД.2)' }
        ownable: { type: boolean, description: 'Может выдаваться только на свои объекты (scope `own`, УПД.8)' }
    PermissionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    Grant:
      type: object
      required: [permission]
      additionalProperties: false
      properties:
        permission: { type: string, maxLength: 64 }
        scope: { type: string, enum: [all, own], default: all, description: '`own` — только свои объекты (УПД.8)' }
    RoleInput:
      type: object
      required: [display_name, permissions]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Role', description: 'Если указан, совпадает с ID в пути' }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 500 }
        mfa_required: { type: boolean, description: 'Требовать второй фактор; включается принудительно, если есть разрешение на изменение' }
        permissions: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/Grant' } }
    NewRole:
      allOf:
        - $ref: '#/components/schemas/RoleInput'
        - type: object
          required: [id]
    RoleDetails:
      type: object
      required: [id, display_name, description, builtin, mfa_required, permissions, users]
      properties:
        id: { $ref: '#/components/schemas/Role' }
        display_name: { type: string }
        description: { type: string }
        builtin: { type: boolean, description: Предустановленная роль не изменяется }
        mfa_required: { type: boolean }
        permissions:
          type: array
          description: 'Без `session` и `self`: их добавляет сессия, в роль они не назначаются'
          items:
            type: object
            required: [permission, scope]
            properties:
              permission: { type: string }
              scope: { type: string, enum: [all, own] }
        users: { type: integer, description: Число учётных записей с ролью, включая деактивированные }
        created_at: { type: string, format: date-time, description: Только у своих ролей }
        updated_at: { type: string, format: date-time, description: Только у своих ролей }
    RoleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoleDetails' } }
    RoleAssignment:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
    APIToken:
      type: object
      required: [id, user_id, name, prefix, permissions, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: Владелец — от его имени действует токен }
        name: { type: string }
        prefix: { type: string, pattern: '^aisec_pat_[a-z0-9]{8}$', description: Начало токена для поиска и показа; не секрет }
        permissions:
          type: array
          description: Область токена; действуют только разрешения, которые есть и у роли владельца
          items: { $ref: '#/components/schemas/Grant' }
        status: { type: string, enum: [active, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        last_used_ip: { type: string }
        revoked_at: { type: string, format: date-time }
        revoke_reason: { type: string, enum: [owner, admin, password_reset, sessions_revoked, backup_restore] }
    APITokenPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/APIToken' }
    NewAPIToken:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
        permissions:
          type: array
          minItems: 1
          description: Разрешения без признака `security` и не на токены
          items: { $ref: '#/components/schemas/Grant' }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль (повторная проверка, ровно одно из password и code)' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора, если второй фактор подключён' }
    CreatedAPIToken:
      type: object
      required: [api_token, token]
      properties:
        api_token: { $ref: '#/components/schemas/APIToken' }
        token:
          type: string
          pattern: '^aisec_pat_[a-z0-9]{8}_[A-Za-z0-9_-]{43}$'
          description: 'Токен для заголовка `Authorization: Bearer`. Показывается один раз'
    ProviderTimeouts:
      type: object
      additionalProperties: false
      description: Таймауты, секунды; 0 — значение шлюза по умолчанию
      properties:
        connect: { type: integer, minimum: 0, maximum: 600 }
        header: { type: integer, minimum: 0, maximum: 600 }
        response: { type: integer, minimum: 0, maximum: 600 }
        stream_idle: { type: integer, minimum: 0, maximum: 600 }
    ProviderFields:
      type: object
      required: [name, type, base_url, ca_pem]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [openai, gigachat, yandexgpt] }
        base_url: { type: string, maxLength: 2048, description: '`https`, с версией API (`https://llm.example/v1`), без учётных данных и параметров' }
        ca_pem: { type: string, maxLength: 262144, description: Корневые сертификаты провайдера в PEM }
        auth_url: { type: string, maxLength: 2048, description: Только GigaChat — адрес выдачи токена }
        scope: { type: string, enum: [GIGACHAT_API_PERS, GIGACHAT_API_B2B, GIGACHAT_API_CORP], description: 'Только GigaChat, обязателен' }
        folder_id: { type: string, pattern: '^[a-z0-9]{1,50}$', description: 'Только YandexGPT, обязателен' }
        timeouts: { $ref: '#/components/schemas/ProviderTimeouts' }
    NewProvider:
      allOf:
        - $ref: '#/components/schemas/ProviderFields'
        - type: object
          required: [slug]
          properties:
            slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    Provider:
      type: object
      required: [id, slug, name, type, base_url, ca_pem, timeouts, external, credential_set, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        type: { type: string, enum: [openai, gigachat, yandexgpt] }
        base_url: { type: string }
        ca_pem: { type: string }
        auth_url: { type: string }
        scope: { type: string }
        folder_id: { type: string }
        timeouts: { $ref: '#/components/schemas/ProviderTimeouts' }
        external: { type: boolean, description: Провайдер вне контура заказчика (ТЗ 5.4) }
        credential_set: { type: boolean, description: Учётные данные заданы; само значение не возвращается }
        credential_set_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModelPriceFields:
      type: object
      required: [input_price, output_price]
      additionalProperties: false
      properties:
        input_price: { $ref: '#/components/schemas/PriceAmount' }
        output_price: { $ref: '#/components/schemas/PriceAmount' }
    NewModelPrice:
      type: object
      required: [provider_id, model, input_price, output_price]
      additionalProperties: false
      properties:
        provider_id: { type: string, format: uuid }
        model: { type: string, minLength: 1, maxLength: 128, description: 'Имя модели у провайдера (цель псевдонима), печатные символы' }
        input_price: { $ref: '#/components/schemas/PriceAmount' }
        output_price: { $ref: '#/components/schemas/PriceAmount' }
    PriceAmount:
      type: string
      maxLength: 32
      pattern: '^[0-9]+(\.[0-9]{1,4})?$'
      description: 'Рубли за 1 000 токенов, до 4 знаков после точки, от 0 до 1000000; например "0.1500"'
    ModelPrice:
      type: object
      required: [id, provider_id, model, input_price, output_price, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        model: { type: string }
        input_price: { type: string, description: Рубли за 1 000 токенов входа, 4 знака после точки }
        output_price: { type: string, description: Рубли за 1 000 токенов выхода, 4 знака после точки }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModelPriceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModelPrice' }
    GatewayCertificateUpload:
      type: object
      required: [host, chain_pem, key_pem]
      additionalProperties: false
      properties:
        host: { type: string, maxLength: 253, description: 'Имя адреса шлюза для приложений: DNS-имя или IP-адрес из SAN' }
        chain_pem: { type: string, maxLength: 65536, description: 'Цепочка в PEM: сертификат шлюза, промежуточные и корневой' }
        key_pem: { type: string, maxLength: 16384, writeOnly: true, description: 'Закрытый ключ в PEM без пароля; в ответах не возвращается' }
    GatewayCertificate:
      type: object
      required: [configured, key_set]
      properties:
        configured: { type: boolean, description: 'false — сертификата заказчика нет, остальных полей тоже' }
        host: { type: string }
        subject: { type: string, description: Кому выдан }
        issuer: { type: string, description: Кем выдан }
        serial: { type: string }
        fingerprint: { type: string, description: SHA-256 сертификата шлюза в DER, hex }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time, description: Самый ранний срок сертификатов цепочки }
        days_left: { type: integer, minimum: 0 }
        dns_names: { type: array, items: { type: string } }
        ip_addresses: { type: array, items: { type: string } }
        key_alg: { type: string, description: '«RSA 2048», «ECDSA P-256»…' }
        chain_len: { type: integer }
        key_set: { type: boolean, description: Закрытый ключ задан }
        updated_at: { type: string, format: date-time }
    BudgetFields:
      type: object
      required: [mode, monthly_limit]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [soft, hard], description: '`soft` — учёт и оповещения; `hard` — запросы сверх бюджета отклоняются' }
        monthly_limit:
          type: string
          maxLength: 32
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          description: 'Рубли в месяц, от 0.01 до 1000000000, до 2 знаков после точки'
    Budget:
      type: object
      required: [mode, monthly_limit, updated_at]
      properties:
        mode: { type: string, enum: [soft, hard] }
        monthly_limit: { type: string, description: Рубли в месяц, 2 знака после точки }
        updated_at: { type: string, format: date-time }
    BudgetStatus:
      type: object
      required: [application_id, application, name, month, budget, spent, priced_tokens, unpriced_tokens, requests, unpriced_requests, percent, exhausted]
      properties:
        application_id: { type: string, format: uuid }
        application: { type: string, description: ID (slug) приложения }
        name: { type: string }
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        budget:
          description: Бюджет; `null` — не задан
          oneOf: [{ $ref: '#/components/schemas/Budget' }, { type: 'null' }]
        spent: { type: string, description: 'Расход по моделям с ценой, рубли с копейками (округление вверх)' }
        priced_tokens: { type: integer, format: int64, minimum: 0 }
        unpriced_tokens: { type: integer, format: int64, minimum: 0, description: Токены моделей без цены }
        requests: { type: integer, format: int64, minimum: 0, description: Запросы, ушедшие провайдеру }
        unpriced_requests: { type: integer, format: int64, minimum: 0, description: 'Из них к моделям без цены: стоимость не определена' }
        percent: { type: integer, format: int64, minimum: 0, description: Доля расхода от бюджета, целые проценты вниз; без бюджета 0 }
        exhausted: { type: boolean, description: 'Расход достиг бюджета (≥ 100 %)' }
    DashPeriodInfo:
      type: object
      required: [name, from, to, unit, timezone, aggregates_ready]
      properties:
        name: { type: string, description: 'Именованный период или custom' }
        from: { type: string, format: date-time, description: 'Начало; для часовых данных округлено до часа вниз' }
        to: { type: string, format: date-time }
        unit: { type: string, enum: [minute, hour, day], description: 'Шаг рядов' }
        timezone: { type: string, description: 'Часовой пояс установки' }
        aggregates_ready: { type: boolean, description: 'Досчёт прошлых периодов закончен: цифры полные' }
    DashTotals:
      type: object
      required: [requests, with_findings, non_text_unchecked, blocked, would_block, masked, tokens_prompt, tokens_completion, cost, unpriced_requests]
      properties:
        requests: { type: integer, format: int64 }
        with_findings: { type: integer, format: int64 }
        non_text_unchecked: { type: integer, format: int64 }
        blocked: { type: integer, format: int64, description: 'Заблокировано (режим enforce)' }
        would_block: { type: integer, format: int64, description: 'Заблокировало бы (режим monitor)' }
        masked: { type: integer, format: int64, description: 'Замаскировано или псевдонимизировано' }
        tokens_prompt: { type: integer, format: int64 }
        tokens_completion: { type: integer, format: int64 }
        cost: { type: string, description: 'Стоимость, рубли, 7 знаков после точки' }
        unpriced_requests: { type: integer, format: int64, description: 'Запросы моделей без цены' }
    DashLatency:
      type: object
      required: [p95_ms, overflow, requests]
      properties:
        p95_ms: { type: integer, description: 'Верхняя граница корзины p95 задержки шлюза, мс; 0 — данных нет' }
        overflow: { type: boolean, description: 'p95 больше последней границы (5 с)' }
        requests: { type: integer, format: int64 }
    DashPoint:
      type: object
      required: [bucket, key, value]
      properties:
        bucket: { type: string, format: date-time }
        key: { type: string }
        value: { type: integer, format: int64 }
    DashTop:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: integer, format: int64 }
    DashRequestRow:
      type: object
      required: [key, requests, with_findings, blocked, would_block, masked, tokens_prompt, tokens_completion, cost, unpriced_requests]
      properties:
        key: { type: string, description: 'Приложение, модель, провайдер, подразделение или псевдоним пользователя; пусто — не указано' }
        requests: { type: integer, format: int64 }
        with_findings: { type: integer, format: int64 }
        blocked: { type: integer, format: int64 }
        would_block: { type: integer, format: int64 }
        masked: { type: integer, format: int64 }
        tokens_prompt: { type: integer, format: int64 }
        tokens_completion: { type: integer, format: int64 }
        cost: { type: string }
        unpriced_requests: { type: integer, format: int64 }
    DashFeedItem:
      type: object
      description: Решение в ленте — метаданные события без содержимого; карточка — GET /api/v1/events/{id}
      required: [id, time, app, model, action, policy_mode, severity, rule, threats]
      properties:
        id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        app: { type: string }
        model: { type: string }
        action: { type: string }
        policy_mode: { type: string }
        severity: { type: string }
        rule: { type: string }
        threats: { type: array, items: { type: string, pattern: '^DM-[0-9]{2}$' } }
    DashCell:
      type: object
      required: [weekday, hour, findings]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: '1 — понедельник' }
        hour: { type: integer, minimum: 0, maximum: 23, description: 'Час суток в поясе установки' }
        findings: { type: integer, format: int64 }
    DashPIIRow:
      type: object
      required: [category, app, action, findings]
      properties:
        category: { type: string, pattern: '^pii\.' }
        app: { type: string }
        action: { type: string }
        findings: { type: integer, format: int64 }
    DashboardOverview:
      type: object
      required: [period, totals, latency, decisions, top_detectors, apps, feed, feed_hidden]
      properties:
        period: { $ref: '#/components/schemas/DashPeriodInfo' }
        totals: { $ref: '#/components/schemas/DashTotals' }
        latency: { $ref: '#/components/schemas/DashLatency' }
        decisions: { type: array, items: { $ref: '#/components/schemas/DashPoint' }, description: 'Ключи: blocked, would_block, masked, allowed' }
        top_detectors: { type: array, items: { $ref: '#/components/schemas/DashTop' } }
        apps: { type: array, items: { $ref: '#/components/schemas/DashRequestRow' } }
        feed: { type: array, items: { $ref: '#/components/schemas/DashFeedItem' } }
        feed_hidden: { type: boolean, description: 'Ленты нет: у субъекта нет events.read на все объекты (лента — метаданные каждого события, УПД.2); feed пустой' }
    DashboardThreats:
      type: object
      required: [period, totals, non_text_unchecked_share, top_threats, top_categories, top_detectors, by_threat, by_category, by_detector, heatmap]
      properties:
        period: { $ref: '#/components/schemas/DashPeriodInfo' }
        totals: { $ref: '#/components/schemas/DashTotals' }
        non_text_unchecked_share: { type: number, minimum: 0, maximum: 1 }
        top_threats: { type: array, items: { $ref: '#/components/schemas/DashTop' } }
        top_categories: { type: array, items: { $ref: '#/components/schemas/DashTop' } }
        top_detectors: { type: array, items: { $ref: '#/components/schemas/DashTop' } }
        by_threat: { type: array, items: { $ref: '#/components/schemas/DashPoint' } }
        by_category: { type: array, items: { $ref: '#/components/schemas/DashPoint' } }
        by_detector: { type: array, items: { $ref: '#/components/schemas/DashPoint' } }
        heatmap: { type: array, items: { $ref: '#/components/schemas/DashCell' } }
    DashboardPII:
      type: object
      required: [period, findings, types, rows, series]
      properties:
        period: { $ref: '#/components/schemas/DashPeriodInfo' }
        findings: { type: integer, format: int64 }
        types: { type: array, items: { $ref: '#/components/schemas/DashTop' } }
        rows: { type: array, items: { $ref: '#/components/schemas/DashPIIRow' } }
        series: { type: array, items: { $ref: '#/components/schemas/DashPoint' } }
    DashAppRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
    DashboardApp:
      type: object
      required: [period, application, totals, latency, decisions, top_detectors, models, feed, feed_hidden]
      properties:
        period: { $ref: '#/components/schemas/DashPeriodInfo' }
        application: { $ref: '#/components/schemas/DashAppRef' }
        totals: { $ref: '#/components/schemas/DashTotals' }
        latency: { $ref: '#/components/schemas/DashLatency' }
        decisions: { type: array, items: { $ref: '#/components/schemas/DashPoint' } }
        top_detectors: { type: array, items: { $ref: '#/components/schemas/DashTop' } }
        models: { type: array, items: { $ref: '#/components/schemas/DashRequestRow' } }
        feed: { type: array, items: { $ref: '#/components/schemas/DashFeedItem' } }
        feed_hidden: { type: boolean, description: 'Ленты нет: у субъекта нет events.read на все объекты (лента — метаданные каждого события, УПД.2); feed пустой' }
    DashUsagePoint:
      type: object
      required: [bucket, requests, tokens, cost]
      properties:
        bucket: { type: string, format: date-time }
        requests: { type: integer, format: int64 }
        tokens: { type: integer, format: int64 }
        cost: { type: string }
    DashForecast:
      type: object
      required: [month, spent, projected, enough, month_elapsed]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        spent: { type: string, description: 'Расход с начала месяца по цене на момент запросов' }
        projected: { type: string, description: 'Линейный прогноз до конца месяца' }
        enough: { type: boolean, description: 'Данных достаточно: прошли сутки месяца и есть расход' }
        month_elapsed: { type: number, minimum: 0, maximum: 1 }
    DashboardConsumption:
      type: object
      required: [period, totals, series, by_app, by_model, by_provider, by_department, by_user, forecast, budgets]
      properties:
        period: { $ref: '#/components/schemas/DashPeriodInfo' }
        totals: { $ref: '#/components/schemas/DashTotals' }
        series: { type: array, items: { $ref: '#/components/schemas/DashUsagePoint' } }
        by_app: { type: array, items: { $ref: '#/components/schemas/DashRequestRow' } }
        by_model: { type: array, items: { $ref: '#/components/schemas/DashRequestRow' } }
        by_provider: { type: array, items: { $ref: '#/components/schemas/DashRequestRow' } }
        by_department: { type: array, items: { $ref: '#/components/schemas/DashRequestRow' } }
        by_user: { type: array, items: { $ref: '#/components/schemas/DashRequestRow' } }
        forecast: { $ref: '#/components/schemas/DashForecast' }
        budgets: { type: array, items: { $ref: '#/components/schemas/BudgetStatus' }, description: 'Исполнение бюджетов текущего месяца; пусто без права budgets.read' }
    BudgetStatusList:
      type: object
      required: [month, items]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        items:
          type: array
          items: { $ref: '#/components/schemas/BudgetStatus' }
    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Provider' }
    ProviderCredential:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential: { type: string, minLength: 1, maxLength: 16384, pattern: '^[\x20-\x7e]+$', writeOnly: true, description: "Ключ API или авторизационные данные: только видимые символы ASCII и пробел" }
    ProviderExternal:
      type: object
      required: [external, reason]
      additionalProperties: false
      properties:
        external: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 500 }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль при снятии признака (ровно одно из password и code)' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора при снятии признака' }
    AppQuotas:
      type: object
      additionalProperties: false
      description: Лимиты (ТЗ 5.2); 0 — без лимита, не больше 10^9
      properties:
        requests_per_minute: { type: integer, minimum: 0 }
        requests_per_minute_per_user: { type: integer, minimum: 0 }
        requests_per_minute_per_key: { type: integer, minimum: 0 }
        tokens_per_minute: { type: integer, minimum: 0 }
        tokens_per_day: { type: integer, minimum: 0 }
        max_messages: { type: integer, minimum: 0 }
        max_tokens: { type: integer, minimum: 0 }
        max_input_bytes: { type: integer, minimum: 0 }
    AppList:
      type: object
      required: [id, category]
      additionalProperties: false
      description: Словарь или выражения заказчика для детектора `lists` (`docs/detectors.md`)
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
        category: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        threat: { type: string, enum: [DM-18, DM-19, DM-32, DM-35] }
        score: { type: number, minimum: 0.1, maximum: 1 }
        direction: { type: string, enum: [input, output, both] }
        words: { type: array, items: { type: string } }
        regex: { type: array, items: { type: string, maxLength: 512 } }
        case_sensitive: { type: boolean }
    ApplicationFields:
      type: object
      required: [name, env, provider_id, models]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        department: { type: string, maxLength: 200 }
        owner_id: { type: string, format: uuid, description: Владелец — действующая учётная запись; при создании по умолчанию создающий }
        env: { type: string, enum: [prod, test] }
        provider_id: { type: string, format: uuid }
        models: { type: array, minItems: 1, maxItems: 100, items: { type: string, pattern: '^[A-Za-z0-9._:/-]{1,128}$' } }
        aliases: { type: object, additionalProperties: { type: string }, description: Имя для приложения → разрешённая модель }
        user_from: { type: string, enum: [header, field, none], default: none }
        quotas: { $ref: '#/components/schemas/AppQuotas' }
    ApplicationProtection:
      type: object
      additionalProperties: false
      description: Поля защиты; меняет только обладатель права `applications.policy` (В15 ревью 2.r3b). Смена политики на ту, что по сравнению версий (`GET /policies/{id}/diff`) слабее текущей, — ослабление с повторной проверкой (В23 ревью 2.r5)
      properties:
        policy: { type: string, description: 'Шаблон (`base`, `pii-strict`, `external-no-pii`, `monitor-only`) или политика организации' }
        policy_mode: { type: string, enum: [monitor, enforce], description: По умолчанию — режим выбранной политики }
        storage: { type: string, enum: [none, masked, full], default: masked }
        fail_mode: { type: string, enum: [fail_open, fail_closed], default: fail_closed }
        lists: { type: array, maxItems: 63, items: { $ref: '#/components/schemas/AppList' } }
        exfil_allow_domains: { type: array, maxItems: 1000, items: { type: string } }
    Reauth:
      type: object
      description: Повторная проверка перед ослаблением защиты (Н32 ревью 2.r3b)
      properties:
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль (ровно одно из password и code)' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора' }
    ApplicationUpdate:
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
        - $ref: '#/components/schemas/Reauth'
    PromptBaselineUpdate:
      allOf:
        - $ref: '#/components/schemas/Reauth'
        - type: object
          required: [mode]
          properties:
            text: { type: string, minLength: 1, maxLength: 131072, description: 'Текст эталона; без поля — прежний' }
            mode: { type: string, enum: ['off', alert, block] }
    PromptBaseline:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        mode: { type: string, enum: ['off', alert, block] }
        hash: { type: string, pattern: '^[0-9a-f]{64}$', description: Хеш нормализованного текста (хеш криптопрофиля) }
        bytes: { type: integer, minimum: 1, maximum: 131072 }
        text: { type: string }
        updated_at: { type: string, format: date-time }
    ProtectionUpdate:
      allOf:
        - $ref: '#/components/schemas/ApplicationProtection'
        - $ref: '#/components/schemas/Reauth'
    NewApplication:
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
        - $ref: '#/components/schemas/ApplicationProtection'
        - $ref: '#/components/schemas/Reauth'
        - type: object
          required: [slug]
          properties:
            slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    Application:
      type: object
      required: [id, slug, name, description, department, owner_id, env, provider_id, models, aliases, policy,
        policy_mode, storage, fail_mode, user_from, quotas, lists, exfil_allow_domains, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        department: { type: string }
        owner_id: { type: string, format: uuid }
        env: { type: string, enum: [prod, test] }
        provider_id: { type: string, format: uuid }
        models: { type: array, items: { type: string } }
        aliases: { type: object, additionalProperties: { type: string } }
        policy: { type: string }
        policy_mode: { type: string, enum: [monitor, enforce] }
        storage: { type: string, enum: [none, masked, full] }
        fail_mode: { type: string, enum: [fail_open, fail_closed] }
        user_from: { type: string, enum: [header, field, none] }
        quotas: { $ref: '#/components/schemas/AppQuotas' }
        lists: { type: array, items: { $ref: '#/components/schemas/AppList' } }
        exfil_allow_domains: { type: array, items: { type: string } }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time }
    ApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Application' }
    AppKey:
      type: object
      required: [id, application_id, name, prefix, status, allowed_cidrs, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, pattern: '^aisec_[a-z0-9]{8}$', description: Начало ключа для поиска и показа; не секрет }
        status: { type: string, enum: [active, expired, revoked] }
        allowed_cidrs: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        rotated_from: { type: string, format: uuid }
        revoked_at: { type: string, format: date-time }
    AppKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppKey' }
    NewAppKey:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        expires_in_days: { type: integer, minimum: 1, maximum: 730, default: 365 }
        allowed_cidrs: { type: array, maxItems: 64, items: { type: string }, description: 'Подсети в каноническом виде (`10.0.0.0/8`); пусто — с любых адресов' }
    AppKeyRotation:
      type: object
      additionalProperties: false
      properties:
        overlap_hours: { type: integer, minimum: 0, maximum: 720, default: 24 }
        expires_in_days: { type: integer, minimum: 1, maximum: 730, default: 365 }
    CreatedAppKey:
      type: object
      required: [app_key, key]
      properties:
        app_key: { $ref: '#/components/schemas/AppKey' }
        key:
          type: string
          pattern: '^aisec_[a-z0-9]{8}_[A-Za-z0-9_-]{43}$'
          description: 'Ключ для заголовка `Authorization: Bearer` в шлюзе. Показывается один раз'
        previous: { $ref: '#/components/schemas/AppKey' }
    RoleAssigned:
      type: object
      required: [user, revoked_sessions]
      properties:
        user: { $ref: '#/components/schemas/User' }
        revoked_sessions: { type: integer, description: Сколько сессий пользователя завершено }
    User:
      type: object
      required: [id, login, display_name, role, status, locked, must_change_password, password_changed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, deactivated] }
        locked: { type: boolean, description: 'Заблокирована после неудачных попыток (ИАФ.4)' }
        locked_until: { type: string, format: date-time, description: 'Нет при блокировке до разблокировки администратором' }
        must_change_password: { type: boolean }
        password_changed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
        deactivated_at: { type: string, format: date-time }
    NewUser:
      type: object
      required: [login, display_name, role]
      additionalProperties: false
      properties:
        login: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
    UserWithPassword:
      type: object
      required: [user, temporary_password]
      properties:
        user: { $ref: '#/components/schemas/User' }
        temporary_password: { type: string, format: password, description: 'Показывается один раз (ИАФ.3)' }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
    Me:
      type: object
      required: [user, session_state, permissions, timezone]
      properties:
        user: { $ref: '#/components/schemas/User' }
        session_state: { $ref: '#/components/schemas/SessionState' }
        password_expires_in_days: { type: integer, description: 'Есть, если пора предупредить о смене пароля (ИАФ.2)' }
        mfa:
          type: object
          required: [enabled, required]
          description: Второй фактор (ИАФ.5)
          properties:
            enabled: { type: boolean }
            required: { type: boolean, description: 'Обязателен по роли или по политике mfa_required_all' }
        permissions:
          type: array
          items: { type: string }
          description: 'Разрешения, действующие в сессии, включая `session` и, после второго фактора, `self`. Консоль скрывает недоступное; права проверяет сервер'
        own_scope:
          type: array
          items: { type: string }
          description: 'Разрешения из `permissions` с областью `own` — только на свои объекты (УПД.8), например `reports.read` владельца приложения'
        timezone: { type: string, description: 'Часовой пояс показа времени из настроек установки (ВРМ.2): консоль показывает даты в нём' }
    SessionState:
      type: string
      enum: [active, password_change, mfa_pending, mfa_setup]
      description: |
        `active` — полный доступ; `password_change` — только смена пароля; `mfa_pending` —
        ждёт код второго фактора (5 минут); `mfa_setup` — только подключение второго фактора (15 минут).
    MFASetupRequest:
      type: object
      additionalProperties: false
      properties:
        current_password: { type: string, format: password, description: 'Текущий пароль; обязателен из полной сессии, в сессии `mfa_setup` не нужен' }
    MFASetup:
      type: object
      required: [secret, otpauth_uri, qr]
      properties:
        secret: { type: string, format: password, description: 'Секрет TOTP в base32 без «=»; показывается один раз' }
        otpauth_uri: { type: string, format: password, description: 'Ссылка otpauth://totp/… для приложения-аутентификатора' }
        qr:
          type: array
          description: Матрица модулей QR-кода ссылки — строка на ряд, «1» — тёмный модуль
          items: { type: string, pattern: '^[01]+$' }
    MFACode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 64, description: 'Код из приложения (6 цифр)' }
    MFAVerify:
      type: object
      additionalProperties: false
      description: Ровно одно из полей
      properties:
        code: { type: string, maxLength: 64, description: 'Код из приложения (6 цифр)' }
        recovery_code: { type: string, maxLength: 64, format: password, description: 'Код восстановления XXXX-XXXX-XXXX-XXXX' }
    RecoveryCodes:
      type: object
      required: [recovery_codes, session_state]
      properties:
        recovery_codes:
          type: array
          description: Коды восстановления — показываются один раз
          items: { type: string, format: password }
        session_state: { $ref: '#/components/schemas/SessionState' }
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, state, created_at, last_seen_at, expires_at, user_agent]
            properties:
              id: { type: string, format: uuid }
              state: { $ref: '#/components/schemas/SessionState' }
              created_at: { type: string, format: date-time }
              last_seen_at: { type: string, format: date-time }
              expires_at: { type: string, format: date-time }
              source_ip: { type: string }
              user_agent: { type: string }
    Problem:
      description: Problem Details (RFC 9457); `detail` — русский текст для пользователя
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, description: 'URN вида urn:aisec:problem:<code>' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [invalid_request, unauthorized, forbidden, not_found, method_not_allowed, conflict,
                 payload_too_large, unsupported_media_type, unprocessable, rate_limited,
                 internal_error, service_unavailable, reauthentication_failed, bundle_key_mismatch,
                 reissue_not_needed, self_review]
        errors:
          type: array
          items:
            type: object
            required: [field, detail]
            properties:
              field: { type: string }
              detail: { type: string }
    Event:
      description: Событие без содержимого запросов и ответов (ТЗ 5.5)
      type: object
      required: [id, time, received_at, gateway_id, type, storage, threats, stream, non_text_unchecked, has_content]
      properties:
        id: { type: string, format: uuid }
        time: { type: string, format: date-time, description: Время события по часам шлюза }
        received_at: { type: string, format: date-time }
        gateway_id: { type: string, format: uuid }
        type: { type: string, enum: [gateway_request, check, auth_failure] }
        app: { type: string }
        env: { type: string }
        user: { type: string, description: Псевдоним пользователя (HMAC), не исходный идентификатор }
        provider: { type: string }
        model: { type: string }
        source: { type: string }
        policy_mode: { type: string, enum: [monitor, enforce] }
        action: { type: string }
        rule: { type: string }
        severity: { type: string }
        storage: { type: string, enum: [none, masked, full] }
        threats:
          type: array
          items: { type: string, pattern: '^DM-\d{2}$' }
        stream: { type: boolean }
        non_text_unchecked: { type: boolean }
        has_content: { type: boolean }
        mark: { $ref: '#/components/schemas/EventMark' }
        details:
          type: object
          description: Только в карточке и выгрузке JSON — решение с трассировкой, находки, задержки, токены, проверка ответа
          additionalProperties: true
          properties:
            content_truncated: { type: boolean, description: 'Содержимое full обрезано сервером под предел хранения 256 КиБ (В10 ревью 2.r3a)' }
    EventPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Event' }
    AuditRecord:
      type: object
      required: [seq, id, ts, actor, source_ip, action, action_title, object, result, details, hash]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1, description: Номер записи в цепочке }
        id: { type: string, format: uuid }
        ts: { type: [string, 'null'], format: date-time, description: 'null — время записи не читается (подмена в обход продукта)' }
        actor:
          type: object
          required: [type, id, name]
          additionalProperties: false
          properties:
            type: { type: string, enum: [user, api_token, system, gateway, cli] }
            id: { type: string, maxLength: 128 }
            name: { type: string, maxLength: 256 }
        source_ip: { type: [string, 'null'], description: 'Адрес субъекта; null — без адреса (системные события)' }
        action: { type: string, maxLength: 64 }
        action_title: { type: string, description: 'Описание события из перечня; пусто — кода нет в перечне этой версии' }
        object:
          type: object
          required: [type, id]
          additionalProperties: false
          properties:
            type: { type: string, maxLength: 64 }
            id: { type: string, maxLength: 256 }
        result: { type: string, enum: [success, failure, denied] }
        details: { description: 'Подробности, как записаны (каноническая форма); секреты замаскированы при записи' }
        hash: { type: string, description: Хеш записи в цепочке (hex) — для сверки с архивом }
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditRecord' }
    AuditVerification:
      type: object
      required: [checked_at, ok, checked, last_seq, reason, broken_seq, cached]
      additionalProperties: false
      properties:
        checked_at: { type: string, format: date-time }
        cached: { type: boolean, description: 'Итог прежней проверки не старше 10 минут, новая не выполнялась' }
        ok: { type: boolean }
        checked: { type: integer, minimum: 0, description: Проверено записей }
        last_seq: { type: integer, minimum: 0, description: Последняя проверенная запись }
        reason:
          type: string
          description: |
            ok или причина: `rewritten` — проверенная раньше запись пропала или изменилась
            (журнал обрезан или пересчитан после прошлой проверки); `tail_truncated` — после
            контрольной точки архивации нет записей.
          enum: [ok, hash_mismatch, prev_mismatch, gap, head_missing, tail_truncated, rewritten, alg_mismatch,
            invalid_record, checkpoint_invalid, anchor_forged]
        broken_seq: { type: [integer, 'null'], minimum: 0, description: 'Запись, на которой цепочка нарушена' }
    EventContentRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: Причина доступа (УПД.7) }
    EventContent:
      type: object
      required: [event_id, storage]
      properties:
        event_id: { type: string, format: uuid }
        storage: { type: string, enum: [masked, full] }
        request: { type: string }
        response: { type: string }
    EventExportRequest:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format: { type: string, enum: [csv, json] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        filter: { type: string, maxLength: 2048 }
    EventAggregate:
      type: object
      required: [bucket, app, type, action, severity, events, with_findings, non_text_unchecked,
                 tokens_prompt, tokens_completion, threats]
      properties:
        bucket: { type: string, format: date-time }
        app: { type: string, description: Пустая строка — приложение не указано }
        type: { type: string }
        action: { type: string }
        severity: { type: string }
        events: { type: integer }
        with_findings: { type: integer }
        non_text_unchecked: { type: integer }
        tokens_prompt: { type: integer }
        tokens_completion: { type: integer }
        threats:
          type: object
          description: Число событий по ID строк матрицы обнаружения
          additionalProperties: { type: integer }
    EventStats:
      type: object
      required: [interval, from, to, items]
      properties:
        interval: { type: string, enum: [minute, hour] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/EventAggregate' }
    NewSavedFilter:
      type: object
      required: [name, filter]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        filter: { type: string, maxLength: 2048 }
    SavedFilter:
      type: object
      required: [id, name, filter, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        filter: { type: string, description: Каноническая запись фильтра }
        created_at: { type: string, format: date-time }
    SavedFilterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SavedFilter' }
    EventRetention:
      type: object
      required: [metadata_days, content_days, updated_at]
      properties:
        metadata_days: { type: integer, minimum: 30, maximum: 3650 }
        content_days: { type: integer, minimum: 7, maximum: 3650 }
        updated_at: { type: string, format: date-time }
    EventRetentionInput:
      type: object
      required: [metadata_days, content_days]
      additionalProperties: false
      properties:
        metadata_days: { type: integer, minimum: 30, maximum: 3650 }
        content_days: { type: integer, minimum: 7, maximum: 3650 }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль при сокращении срока (ровно одно из password и code)' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора при сокращении срока, если второй фактор подключён' }
    PolicyRule:
      type: object
      required: [id, detector, action, severity]
      additionalProperties: false
      description: Правило политики; поля и значения — как в YAML (`docs/cert/security-functions.md`, «Политики»).
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        detector: { type: string, description: ID детектора, например pii.ru }
        directions: { type: array, items: { type: string, enum: [input, output] } }
        categories: { type: array, maxItems: 32, items: { type: string } }
        sources: { type: array, items: { type: string, enum: [user, rag, tool, output] } }
        threshold: { type: number, exclusiveMinimum: 0, maximum: 1 }
        action: { type: string, enum: [allow, log, redact, pseudonymize, block] }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        message: { type: string, maxLength: 300 }
    PolicySpec:
      type: object
      required: [name, mode, rules]
      additionalProperties: false
      description: Содержимое политики (ТЗ 5.3). ID и номер версии задаёт сервер.
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        mode: { type: string, enum: [monitor, enforce] }
        non_text: { type: string, enum: [allow_unchecked, allow_inline, block], description: 'Пусто при сохранении — allow_inline (решение 1.19)' }
        response_check: { type: string, enum: [buffered, incremental, monitor], description: 'Пусто при сохранении — incremental' }
        block_message: { type: string, maxLength: 300 }
        rules: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/PolicyRule' } }
        exceptions:
          type: array
          maxItems: 1000
          description: 'Исключения (задача 3.22). При сохранении: поле не передано — исключения текущей версии сохраняются; пустой список — удаляются. Автора и created_at новых и изменённых ставит сервер'
          items: { $ref: '#/components/schemas/PolicyException' }
    PolicyException:
      type: object
      required: [id, detector, reason]
      additionalProperties: false
      description: Исключение (ТЗ 5.3, решение Р8 этапа 3); поля — как в YAML политики. Условия соединяются «и».
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        detector: { type: string, description: ID детектора }
        category: { type: string, description: Категория находки, например pii.card }
        pattern: { type: string, pattern: '^[\x21-\x7e]{1,128}$', description: Правило детектора (шаблон) }
        fragment: { type: string, pattern: '^[0-9a-f]{32}$', description: Хеш фрагмента (HMAC на ключе шлюза) из находки события }
        app: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        user: { type: string, pattern: '^[0-9a-f]{32}$', description: Псевдоним пользователя из события }
        source: { type: string, enum: [user, rag, tool, output] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        author: { type: string, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        expires_at: { type: string, format: date-time, description: 'Не дальше 365 суток от сохранения; при сохранении без срока — 30 суток' }
        event_id: { type: string, format: uuid, description: Событие, по отметке которого создано исключение }
    PolicyExceptionItem:
      allOf:
        - $ref: '#/components/schemas/PolicyException'
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [active, expired], description: 'expired — шлюз исключение не применяет' }
    PolicyExceptionList:
      type: object
      required: [policy, version, items]
      properties:
        policy: { type: string }
        version: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/PolicyExceptionItem' } }
    ExceptionCondition:
      type: object
      required: [detector]
      properties:
        detector: { type: string }
        category: { type: string }
        pattern: { type: string, pattern: '^[\x21-\x7e]{1,128}$' }
        fragment: { type: string, pattern: '^[0-9a-f]{32}$' }
        app: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        user: { type: string, pattern: '^[0-9a-f]{32}$' }
        source: { type: string, enum: [user, rag, tool, output] }
        reason: { type: string, maxLength: 500 }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }
        expires_at: { type: string, format: date-time }
        event_id: { type: string, format: uuid }
    NewPolicyException:
      allOf:
        - $ref: '#/components/schemas/ExceptionCondition'
        - type: object
          required: [base_version, reason]
          properties:
            base_version: { type: integer, minimum: 1 }
            comment: { type: string, maxLength: 500 }
            password: { type: string, maxLength: 1024, format: password, description: Текущий пароль (добавление — ослабление защиты) }
            code: { type: string, maxLength: 64, description: Код из приложения-аутентификатора вместо пароля }
    PolicyExceptionExtend:
      type: object
      required: [base_version]
      additionalProperties: false
      description: Ровно одно из `expires_in_days` и `expires_at`.
      properties:
        base_version: { type: integer, minimum: 1 }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }
        expires_at: { type: string, format: date-time }
        reason: { type: string, maxLength: 500, description: Новая причина; пусто — прежняя }
        comment: { type: string, maxLength: 500 }
        password: { type: string, maxLength: 1024, format: password }
        code: { type: string, maxLength: 64 }
    PolicyExceptionChange:
      type: object
      required: [policy]
      properties:
        policy: { $ref: '#/components/schemas/Policy' }
        exception: { $ref: '#/components/schemas/PolicyExceptionItem' }
    ExceptionDraft:
      type: object
      required: [event_id, template, items]
      properties:
        event_id: { type: string, format: uuid }
        policy: { type: string, description: Политика события }
        policy_version: { type: integer, description: Версия политики в момент события }
        base_version: { type: integer, description: Текущая версия политики (base_version для создания) }
        template: { type: boolean, description: Политика события — шаблон }
        items: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/ExceptionCondition' } }
    EventMark:
      type: object
      required: [mark, marked_at, marked_by]
      properties:
        mark: { type: string, enum: [false_positive, confirmed] }
        comment: { type: string, maxLength: 1000 }
        marked_at: { type: string, format: date-time }
        marked_by: { type: string, description: 'Тип и ID субъекта: user:<id> или api_token:<id>' }
        marked_by_name: { type: string }
    EventMarkRequest:
      type: object
      required: [mark]
      additionalProperties: false
      properties:
        mark: { type: string, enum: [false_positive, confirmed, none], description: 'none — снять отметку' }
        comment: { type: string, maxLength: 1000 }
    EventMarkResult:
      type: object
      required: [event_id, mark]
      properties:
        event_id: { type: string, format: uuid }
        mark: { $ref: '#/components/schemas/EventMark' }
        draft: { $ref: '#/components/schemas/ExceptionDraft' }
    PolicySummary:
      type: object
      required: [id, name, mode, template]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { type: string, enum: [monitor, enforce] }
        template: { type: boolean, description: Шаблон — только чтение, без версий }
        current_version: { type: integer }
        updated_at: { type: string, format: date-time }
    PolicyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PolicySummary' } }
    PolicyVersion:
      type: object
      required: [version, hash, hash_alg, source, comment, created_at, created_by]
      properties:
        version: { type: integer }
        hash: { type: string, description: Хеш каноничного YAML версии (hex) по криптопрофилю }
        hash_alg: { type: string }
        source: { type: string, enum: [api, import, rollback, template] }
        comment: { type: string }
        rolled_back_from: { type: integer, description: Номер версии, содержимое которой вернул откат }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    PolicyVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PolicyVersion' } }
        next_before: { type: integer }
    Policy:
      allOf:
        - $ref: '#/components/schemas/PolicySummary'
        - type: object
          required: [spec]
          properties:
            version: { $ref: '#/components/schemas/PolicyVersion' }
            spec: { $ref: '#/components/schemas/PolicySpec' }
    NewPolicy:
      type: object
      required: [id]
      additionalProperties: false
      description: Ровно одно из `spec` и `from_template`.
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$', description: 'ID политики; ID шаблонов заняты' }
        spec: { $ref: '#/components/schemas/PolicySpec' }
        from_template: { type: string, enum: [base, pii-strict, external-no-pii, monitor-only] }
        name: { type: string, maxLength: 128, description: Название копии шаблона }
        comment: { type: string, maxLength: 500 }
    PolicyUpdate:
      type: object
      required: [base_version, spec]
      additionalProperties: false
      properties:
        base_version: { type: integer, minimum: 1, description: Версия, которую открыли для изменения }
        spec: { $ref: '#/components/schemas/PolicySpec' }
        comment: { type: string, maxLength: 500 }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль, если версия ослабляет защиту (В23 ревью 2.r5)' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора вместо пароля' }
    PolicyRollback:
      type: object
      required: [version, base_version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, description: Версия, содержимое которой вернуть }
        base_version: { type: integer, minimum: 1 }
        comment: { type: string, maxLength: 500 }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль, если откат ослабляет защиту (В23 ревью 2.r5)' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора вместо пароля' }
    PolicyImport:
      type: object
      required: [document]
      additionalProperties: false
      description: Загрузка в обёртке JSON — так вместе с документом передаётся пароль или код, если версия ослабляет защиту (В23 ревью 2.r5)
      properties:
        document: { type: string, maxLength: 1048576, description: Документ YAML политики }
        base_version: { type: integer, minimum: 1 }
        comment: { type: string, maxLength: 500 }
        password: { type: string, maxLength: 1024, format: password }
        code: { type: string, maxLength: 64 }
    PolicyImportPreview:
      type: object
      required: [dry_run, policy, created, current_version, diff]
      additionalProperties: false
      description: Итог проверки загрузки без сохранения (задача 3.35). Ничего не сохранено.
      properties:
        dry_run: { type: boolean, enum: [true] }
        policy: { type: string, description: ID политики из документа }
        created: { type: boolean, description: 'Политики нет: загрузка создаст её версией 1' }
        current_version: { type: integer, minimum: 0, description: Текущая версия, с которой сравнивается документ; 0 — новая политика }
        diff: { $ref: '#/components/schemas/PolicyDiff' }
    PolicyDiff:
      type: object
      required: [from, to, fields, rules_added, rules_removed, rules_changed, reordered, weakening, weakening_reasons,
        exceptions_added, exceptions_removed, exceptions_changed]
      properties:
        from: { type: integer }
        to: { type: integer }
        fields:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field: { type: string, enum: [name, mode, non_text, response_check, block_message] }
              before: { type: string }
              after: { type: string }
        rules_added: { type: array, items: { $ref: '#/components/schemas/PolicyRule' } }
        rules_removed: { type: array, items: { $ref: '#/components/schemas/PolicyRule' } }
        rules_changed:
          type: array
          items:
            type: object
            required: [id, fields, before, after]
            properties:
              id: { type: string }
              fields: { type: array, items: { type: string } }
              before: { $ref: '#/components/schemas/PolicyRule' }
              after: { $ref: '#/components/schemas/PolicyRule' }
        reordered: { type: boolean }
        weakening: { type: boolean, description: Изменение ослабляет защиту (DM-40) }
        weakening_reasons:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [mode_monitor, non_text_weakened, response_check_weakened, rule_removed, action_weakened,
                  threshold_raised, scope_narrowed, detector_changed, exception_added, exception_extended, exception_changed]
              rule: { type: string }
              exception: { type: string }
        exceptions_added: { type: array, items: { $ref: '#/components/schemas/PolicyException' } }
        exceptions_removed: { type: array, items: { $ref: '#/components/schemas/PolicyException' } }
        exceptions_changed:
          type: array
          items:
            type: object
            required: [id, fields, before, after]
            properties:
              id: { type: string }
              fields: { type: array, items: { type: string } }
              before: { $ref: '#/components/schemas/PolicyException' }
              after: { $ref: '#/components/schemas/PolicyException' }
    PolicyTestRequest:
      type: object
      required: [request]
      additionalProperties: false
      description: Ровно одно из `policy_id` и `spec`.
      properties:
        policy_id: { type: string, description: ID политики или шаблона }
        version: { type: integer, minimum: 1, description: Версия политики; по умолчанию текущая }
        spec: { $ref: '#/components/schemas/PolicySpec' }
        application_id: { type: string, format: uuid }
        request: { $ref: '#/components/schemas/CheckRequest' }
    PolicyTestResult:
      type: object
      required: [draft, direction, mode, decision, action, blocked, fail_block, incomplete, unchecked, failures, findings, texts]
      properties:
        policy_id: { type: string }
        version: { type: integer }
        draft: { type: boolean }
        application_id: { type: string, format: uuid }
        direction: { type: string, enum: [input, output] }
        mode: { type: string, enum: [monitor, enforce] }
        decision: { type: string, enum: [allow, redact, pseudonymize, block], description: 'Что сделано с текстом (как заголовок X-AISec-Decision шлюза)' }
        action: { type: string, enum: [allow, log, redact, pseudonymize, block], description: Решение как в enforce }
        rule: { type: string, description: 'Правило, давшее решение' }
        blocked: { type: boolean }
        fail_block: { type: boolean, description: 'Сбой детектора при fail_closed: шлюз ответил бы 503' }
        message: { type: string }
        incomplete: { type: boolean }
        unchecked: { type: boolean }
        failures:
          type: array
          items:
            type: object
            required: [detector, location, reason]
            properties:
              detector: { type: string }
              location: { type: string }
              reason: { type: string, enum: [timeout, error] }
        findings:
          type: array
          items:
            type: object
            required: [detector, category, score, start, end, location]
            properties:
              detector: { type: string }
              category: { type: string }
              score: { type: number }
              start: { type: integer, description: Байтовое смещение в UTF-8 в исходном фрагменте }
              end: { type: integer }
              location: { type: string }
              threat: { type: string }
              rule: { type: string, description: 'Правило с самым сильным действием по находке; пусто — не совпало ни одно' }
              action: { type: string }
              apply: { type: string, description: 'Что сделано с фрагментом: redact или пусто' }
        findings_truncated: { type: boolean }
        texts:
          type: array
          description: Фрагменты после защиты данных; пусто при блокировке.
          items:
            type: object
            required: [location, text, changed]
            properties:
              location: { type: string }
              role: { type: string }
              text: { type: string }
              changed: { type: boolean }
    AlertSeverity:
      type: string
      enum: [info, low, medium, high, critical]
    AlertKind:
      type: string
      description: Вид правила (ТЗ 5.6); через API создаются threshold, new, frequency, anomaly и budget
      enum: [threshold, new, frequency, anomaly, budget, system, security]
    Alert:
      type: object
      required: [id, rule_id, rule_name, kind, severity, title, status, group, count, suppressed, created_at,
        last_triggered_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        rule_id: { type: string, format: uuid }
        rule_name: { type: string }
        kind: { $ref: '#/components/schemas/AlertKind' }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        title: { type: string, maxLength: 300 }
        status: { type: string, enum: [new, in_progress, closed] }
        group: { type: object, additionalProperties: { type: string }, description: Значения полей группировки (ключ дедупликации) }
        count: { type: integer, description: Срабатываний в оповещении }
        suppressed: { type: integer, description: Срабатываний в окне подавления после закрытия }
        first_event_at: { type: string, format: date-time }
        last_event_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        last_triggered_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        assignee_id: { type: string, format: uuid }
        closed_at: { type: string, format: date-time }
        closed_by: { type: string }
        incident_id: { type: string, format: uuid }
    AlertPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Alert' }
    AlertCard:
      allOf:
        - $ref: '#/components/schemas/Alert'
        - type: object
          required: [events, events_truncated, history, details]
          properties:
            events:
              type: array
              maxItems: 100
              items:
                type: object
                required: [id, ts]
                properties:
                  id: { type: string, format: uuid }
                  ts: { type: string, format: date-time }
            events_truncated: { type: boolean }
            history:
              type: array
              items:
                type: object
                required: [at, actor, from, to, comment]
                properties:
                  at: { type: string, format: date-time }
                  actor: { type: string }
                  from: { type: string, enum: [new, in_progress, closed] }
                  to: { type: string, enum: [new, in_progress, closed] }
                  comment: { type: string }
            details: { type: object, additionalProperties: true, description: Подробности без содержимого запросов (список изменений) }
    AlertStatusUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [in_progress, closed] }
        comment: { type: string, maxLength: 2000 }
    AlertCondition:
      type: object
      additionalProperties: false
      properties:
        filter: { type: string, maxLength: 2048, description: Фильтр событий (язык — в описании GET /api/v1/events) }
        min_severity: { $ref: '#/components/schemas/AlertSeverity' }
        field: { type: string, enum: [model, provider, user, app], description: Поле правила «новое» }
        count: { type: integer, minimum: 2, maximum: 100000, description: 'Порог «частоты»: событий в окне по ключу группировки' }
        window_minutes: { type: integer, minimum: 1, maximum: 1440, description: Окно «частоты», минут }
        metric:
          type: string
          enum: [requests, tokens, completion_tokens]
          description: Метрика «аномалии» (запросы, токены, токены ответа) по часовым агрегатам событий
        factor:
          type: number
          minimum: 1.5
          maximum: 100
          description: 'Во сколько раз объём окна «аномалии» (последний час) выше медианы того же часа недели за 2–8 недель; по умолчанию 3'
        min_volume:
          type: integer
          minimum: 1
          maximum: 1000000000000
          description: 'Наименьший объём окна «аномалии»; по умолчанию 100 запросов, 200 000 токенов, 100 000 токенов ответа'
        warn_percent: { type: integer, minimum: 50, maximum: 99, description: 'Предупреждение «бюджета», % месячного бюджета (по умолчанию 80); второй порог — 100 %' }
    AlertRecipients:
      type: object
      additionalProperties: false
      description: Получатели сверх обязательных ролей security_admin и auditor
      properties:
        roles: { type: array, maxItems: 10, items: { type: string, pattern: '^[a-z][a-z0-9_]{2,47}$' } }
        users: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    AlertRuleInput:
      type: object
      required: [kind, name, condition]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [threshold, new, frequency, anomaly, budget] }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        enabled: { type: boolean, default: true }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        condition: { $ref: '#/components/schemas/AlertCondition' }
        group_by:
          type: array
          maxItems: 4
          items: { type: string, enum: [type, app, env, user, provider, model, source, gateway, action, rule, severity, policy_mode] }
        suppress_minutes: { type: integer, minimum: 0, maximum: 10080, default: 60 }
        recipients: { $ref: '#/components/schemas/AlertRecipients' }
        version: { type: integer, description: Не используется при создании }
    AlertRuleUpdate:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/AlertKind' }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        enabled: { type: boolean }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        condition: { $ref: '#/components/schemas/AlertCondition' }
        group_by: { type: array, maxItems: 4, items: { type: string } }
        suppress_minutes: { type: integer, minimum: 0, maximum: 10080 }
        recipients: { $ref: '#/components/schemas/AlertRecipients' }
        version: { type: integer, minimum: 1, description: Версия, которую открыли для изменения }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль, если изменение ослабляет оповещения' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора вместо пароля' }
    AlertSettings:
      type: object
      required: [retention_days]
      additionalProperties: false
      properties:
        retention_days: { type: integer, minimum: 90, maximum: 1825, description: 'Срок хранения закрытых оповещений, суток' }
    AlertSettingsUpdate:
      type: object
      required: [retention_days]
      additionalProperties: false
      properties:
        retention_days: { type: integer, minimum: 90, maximum: 1825 }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль, если срок сокращается' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора вместо пароля' }
    IncidentSettings:
      type: object
      required: [retention_days]
      additionalProperties: false
      properties:
        retention_days: { type: integer, minimum: 365, maximum: 1825, description: 'Срок хранения закрытых инцидентов, суток' }
    IncidentSettingsUpdate:
      type: object
      required: [retention_days]
      additionalProperties: false
      properties:
        retention_days: { type: integer, minimum: 365, maximum: 1825 }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль, если срок сокращается' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора вместо пароля' }
    NotifyChannelSettings:
      type: object
      additionalProperties: false
      description: |
        Настройки без секретов. Почта — host, port (587), username, from, to (1–20 адресов); webhook —
        format (generic, mattermost); syslog — host, port (6514), format (json, cef), facility (0–23,
        по умолчанию 10), hostname (по умолчанию aisec-server). Для всех — ca_pem.
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        ca_pem: { type: string, maxLength: 262144, description: Корневые сертификаты получателя в PEM }
        username: { type: string, maxLength: 256 }
        from: { type: string, format: email, maxLength: 254 }
        to: { type: array, maxItems: 20, items: { type: string, format: email, maxLength: 254 } }
        format: { type: string, enum: [generic, mattermost, json, cef] }
        facility: { type: integer, minimum: 0, maximum: 23 }
        hostname: { type: string, maxLength: 255 }
        url_origin: { type: string, readOnly: true, description: Схема, узел и порт адреса webhook (сам адрес — секрет) }
    NotifyChannelSecrets:
      type: object
      additionalProperties: false
      description: Секреты канала; поле не передано — прежнее значение, пустая строка — удалить необязательный.
      properties:
        password: { type: string, maxLength: 1024, format: password, description: Пароль SMTP }
        url: { type: string, maxLength: 2048, format: password, description: Адрес webhook https:// }
        signing_key: { type: string, minLength: 32, maxLength: 512, format: password, description: Ключ подписи webhook }
    NotifyChannelInput:
      type: object
      required: [name, type, settings]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [email, webhook, syslog] }
        enabled: { type: boolean, default: true }
        min_severity: { $ref: '#/components/schemas/AlertSeverity' }
        audit_stream:
          type: boolean
          default: false
          description: |
            Передавать журнал аудита в SIEM (РСБ.6): только syslog или webhook с форматом generic.
            Передача начинается с конца журнала на момент подписки; снятие подписки — ослабление (DM-40).
        settings: { $ref: '#/components/schemas/NotifyChannelSettings' }
        secrets: { $ref: '#/components/schemas/NotifyChannelSecrets' }
        version: { type: integer }
    NotifyChannelUpdate:
      type: object
      required: [name, settings, version]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [email, webhook, syslog], description: Не меняется }
        enabled: { type: boolean }
        min_severity: { $ref: '#/components/schemas/AlertSeverity' }
        audit_stream: { type: boolean, description: Не передано — прежнее значение }
        settings: { $ref: '#/components/schemas/NotifyChannelSettings' }
        secrets: { $ref: '#/components/schemas/NotifyChannelSecrets' }
        version: { type: integer, minimum: 1 }
        password: { type: string, maxLength: 1024, format: password, description: 'Текущий пароль, если изменение ослабляет доставку' }
        code: { type: string, maxLength: 64, description: 'Код из приложения-аутентификатора вместо пароля' }
    NotifyChannel:
      type: object
      required: [id, name, type, enabled, min_severity, audit_stream, settings, secrets_set, version, created_at, created_by, updated_at, updated_by]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [email, webhook, syslog] }
        enabled: { type: boolean }
        min_severity: { $ref: '#/components/schemas/AlertSeverity' }
        audit_stream: { type: boolean, description: Канал передаёт журнал аудита в SIEM }
        settings: { $ref: '#/components/schemas/NotifyChannelSettings' }
        secrets_set: { type: array, items: { type: string, enum: [password, url, signing_key] } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    ReportScheduleInput:
      type: object
      required: [name, report, frequency, at, format, channel_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        report: { type: string, enum: [summary, incidents, pilot] }
        frequency: { type: string, enum: [daily, weekly, monthly] }
        weekday: { type: integer, minimum: 1, maximum: 7, description: Для weekly; 1 — понедельник }
        day: { type: integer, minimum: 1, maximum: 28, description: Для monthly }
        at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Время в часовом поясе установки }
        format: { type: string, enum: [html, xlsx] }
        channel_id: { type: string, format: uuid }
        enabled: { type: boolean, default: true }
        version: { type: integer, minimum: 1, description: Для изменения }
    ReportSchedule:
      type: object
      required: [id, name, report, frequency, at, format, channel_id, enabled, next_run_at, version, created_at, created_by, updated_at, updated_by]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        report: { type: string, enum: [summary, incidents, pilot] }
        frequency: { type: string, enum: [daily, weekly, monthly] }
        weekday: { type: integer }
        day: { type: integer }
        at: { type: string }
        format: { type: string, enum: [html, xlsx] }
        channel_id: { type: string, format: uuid }
        enabled: { type: boolean }
        next_run_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    ReportScheduleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReportSchedule' } }
    ReportRun:
      type: object
      required: [id, due_at, period_first, period_last, status, attempts, created_at]
      properties:
        id: { type: string, format: uuid }
        due_at: { type: string, format: date-time }
        period_first: { type: string, format: date }
        period_last: { type: string, format: date }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        next_at: { type: string, format: date-time }
        error: { type: string, description: Код ошибки без текста ответа сервера }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
    ReportChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    ReportRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReportRun' } }
    NotifyChannelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotifyChannel' } }
    NotifyDelivery:
      type: object
      required: [id, channel_id, kind, status, attempts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        alert_id: { type: string, format: uuid }
        kind: { type: string, enum: [alert, test] }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer, minimum: 0, maximum: 5 }
        next_at: { type: string, format: date-time, description: Следующая попытка (только pending) }
        error:
          type: string
          description: |
            Код ошибки без текста ответа получателя: dial, tls, starttls_unsupported, auth, rejected,
            timeout, write, config (в том числе запрещённый адрес получателя), channel_disabled,
            internal, http_NNN; у тестовой отправки вместо сетевых кодов — unreachable.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
    NotifyDeliveryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotifyDelivery' } }
    AuditStreamState:
      type: object
      required: [subscribed, active, last_seq, head_seq, pending, lagging, attempts]
      properties:
        subscribed: { type: boolean, description: Канал подписан на журнал }
        active: { type: boolean, description: Подписан и включён — передача идёт }
        last_seq: { type: integer, format: int64, minimum: 0, description: Последняя переданная запись }
        head_seq: { type: integer, format: int64, minimum: 0, description: Последняя запись журнала }
        pending: { type: integer, format: int64, minimum: 0, description: Не передано записей }
        oldest_pending_at: { type: string, format: date-time, description: Время самой старой не переданной записи }
        lagging: { type: boolean, description: Отставание выше порога DM-44 }
        attempts: { type: integer, minimum: 0, description: Неудачных попыток подряд }
        next_at: { type: string, format: date-time, description: Следующая попытка (только active) }
        error:
          type: string
          description: Код последней ошибки без текста ответа приёмника (как в журнале доставки)
        last_sent_at: { type: string, format: date-time, description: Последняя успешная передача }
    AlertRule:
      type: object
      required: [id, kind, name, description, enabled, locked, severity, condition, group_by, suppress_minutes,
        group_minutes, recipients, effective_roles, version, created_at, created_by, updated_at, updated_by]
      properties:
        id: { type: string, format: uuid }
        builtin: { type: string, description: Ключ встроенного правила }
        kind: { $ref: '#/components/schemas/AlertKind' }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        locked: { type: boolean, description: Правило не отключается, меняются только получатели }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        condition: { $ref: '#/components/schemas/AlertCondition' }
        group_by: { type: array, items: { type: string } }
        suppress_minutes: { type: integer }
        group_minutes: { type: integer, description: Окно группировки (DM-40); 0 — пока оповещение не закрыто }
        recipients: { $ref: '#/components/schemas/AlertRecipients' }
        effective_roles: { type: array, items: { type: string } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    AlertRuleState:
      type: object
      required: [rule_id, kind, evaluated, learning, keys, keys_total, keys_hidden]
      properties:
        rule_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AlertKind' }
        evaluated: { type: boolean, description: Фоновая задача уже считала правило }
        evaluated_at: { type: string, format: date-time }
        learning: { type: boolean, description: '«Аномалия» на обучении: ни у одного ключа нет 14 суток истории' }
        learning_until: { type: string, format: date-time }
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', description: Месяц «бюджета» в часовом поясе установки }
        keys:
          type: array
          maxItems: 50
          items:
            type: object
            required: [group, learning, current, baseline, samples, triggered]
            properties:
              group: { type: object, additionalProperties: { type: string } }
              learning: { type: boolean }
              ready_at: { type: string, format: date-time }
              current: { type: number, description: 'Объём окна («аномалия»), процент расхода («бюджет») или событий в окне у ключей «частоты», сработавших в последнем проходе' }
              baseline: { type: number, description: Медиана базовой линии }
              samples: { type: integer, description: Недель в базовой линии }
              triggered: { type: boolean }
        keys_total: { type: integer }
        keys_hidden: { type: boolean, description: 'Ключи скрыты: у «аномалии» нужно право events.read, у «бюджета» — budgets.read' }
        warning:
          type: string
          enum: [evaluation_failed, timezone_invalid]
          description: 'Предупреждение последнего прохода: evaluation_failed — вычисление правила упало и откатано отдельно от остальных (причина — в техническом журнале), timezone_invalid — часовой пояс установки не распознан, расчёт по UTC (3В17, 3Н36 ревью 3.r2)'
    AlertRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlertRule' }
    IncidentCategoryID:
      type: string
      description: Категория инцидента (ТЗ 5.7); справочник — GET /api/v1/incident-categories
      enum: [prompt_injection, pii_leak, system_prompt_leak, quota_abuse, anomalous_activity, agent_policy_violation,
        model_compromise, platform_access, other]
    IncidentSource:
      type: string
      description: manual — вручную, alert — из оповещения, auto — правилом в приёме событий, reopen — повторное открытие
      enum: [manual, alert, auto, reopen]
    Incident:
      type: object
      required: [id, number, title, severity, category, status, source, reaction_due_at, overdue, created_at, created_by,
        updated_at, updated_by, version]
      properties:
        id: { type: string, format: uuid }
