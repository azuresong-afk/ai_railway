              schema: { $ref: '#/components/schemas/ProviderList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Создать провайдера
      description: |
        Право `providers.manage` (ТЗ 5.4). Новый провайдер всегда внешний (`external: true`);
        снять признак можно только отдельным действием с правом `providers.external`.
        Корневые сертификаты (`ca_pem`, до 256 КиБ) обязательны: доверие системному хранилищу —
        только его содержимым. Учётные данные задаются отдельно (`PUT …/credentials`).
        `slug` — ID провайдера в пакете для шлюзов, неизменяем. Пишет `provider.create`.
      x-permission: providers.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
