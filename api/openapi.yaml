          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAppKey' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/app-keys/{id}/rotate:
    post:
      summary: Ротация ключа приложения
      description: |
        Право `app_keys.manage`. Выпускает новый ключ с тем же именем и подсетями; прежний
        действует ещё `overlap_hours` (0–720, по умолчанию 24; срок только сокращается).
        Отозванный или истёкший ключ — 409. Новый ключ показывается один раз. Тело можно не
        передавать. Пишет `app_key.rotate` (новый и прежний префиксы, новый срок прежнего).
      x-permission: app_keys.manage
