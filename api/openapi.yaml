  /api/v1/policies:
    get:
      summary: Политики и шаблоны
      description: |
        Право `policies.read` (ТЗ 5.3). Сначала четыре шаблона (только чтение, без версий),
        затем политики организации по ID, не больше 1000.
      x-permission: policies.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Политики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Создать политику
      description: |
        Право `policies.manage` (признак `security`: только администратор безопасности, УПД.2;
        токену API недоступно). Содержимое `spec` или копия шаблона `from_template`; версия 1.
        Проверка строгая: неизвестный детектор, направление или категория — 400 с полем
        (`rules[2].action`). Пустой `non_text` — `allow_inline` (решение 1.19), пустой
        `response_check` — `incremental`; сохранённая версия хранит их явно. Пишет `policy.create`.
      x-permission: policies.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPolicy' }
      responses:
        '201':
          description: Политика создана
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/policies/import:
    post:
      summary: Загрузить политику из YAML
      description: |
        Право `policies.manage`. Тело — документ YAML до 1 МиБ по строгой схеме этапа 1
        (`docs/cert/security-functions.md`, «Политики»): неизвестное поле, второй документ, лишний размер, неизвестный
        детектор — 400. Политики с таким `id` нет — создаётся (201); есть — новая версия поверх
        `base_version` (200), без него — 409. Пустой `non_text` при загрузке — `allow_unchecked`,
        как в шлюзе этапа 1. Пишет `policy.import` (сводка изменений и признак `weakening`).
        Изменение, после которого пакет конфигурации шлюзов не соберётся (например, правило `lists.*` на словарь, которого нет у приложения), — 422 с причиной и ID приложений в `detail` (В16 ревью 2.r3b).
        Версия, ослабляющая защиту (`weakening`), принимается только в обёртке JSON (`PolicyImport`) с текущим паролем
        или кодом TOTP: без них — 400 с полем `password`, неверные — 403 `reauthentication_failed` (В23 ревью 2.r5).
        В обёртке `base_version` и `comment` берутся из тела, параметры запроса, кроме `dry_run`, не читаются.
        `dry_run=true` (задача 3.35) — проверка без сохранения: тот же разбор и те же пределы и
        проверки (400, 409 при устаревшем `base_version`, 413, 415, 422), ответ 200 —
        `PolicyImportPreview`: различия с текущей версией (для новой политики — с пустой) и
        признак ослабления с причинами. Версия не создаётся, запись аудита не пишется, пароль
        или код не нужны. Право то же — `policies.manage`: проверка — шаг загрузки, а
        `policies.test` (песочница аналитика и администратора системы) загрузить не позволяет.
      x-permission: policies.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: base_version
          in: query
          description: Текущая версия политики, поверх которой загружается файл; для новой — не указывается
          schema: { type: integer, minimum: 1 }
        - name: comment
          in: query
          description: Комментарий к версии
          schema: { type: string, maxLength: 500 }
        - name: dry_run
          in: query
          description: true — только проверка и различия, без сохранения (задача 3.35)
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string, maxLength: 1048576 }
          application/json:
            schema: { $ref: '#/components/schemas/PolicyImport' }
      responses:
        '200':
          description: Новая версия политики; с `dry_run=true` — итог проверки без сохранения
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Policy'
                  - $ref: '#/components/schemas/PolicyImportPreview'
        '201':
          description: Политика создана
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/policies/test:
    post:
      summary: Проверить текст в песочнице
      description: |
        Право `policies.test` (ТЗ 5.3). Текст проверяется тем же конвейером, что Check API
        шлюза (`endpoint=check`), сохранённой версией, шаблоном или черновиком `spec`; с
        `application_id` — с режимом политики, `fail_mode`, словарями `lists`, доменами
        `output.exfil` и признаком «внешний» провайдера приложения (нужно право
        `applications.read` на это приложение). Без приложения провайдер считается внешним.
        Ничего не сохраняется: ни событие, ни текст; к модели запрос не идёт. Пишет
        необязательную запись `policy.test` без текста (РСБ.3). Тело — до 256 КиБ.
      x-permission: policies.test
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyTestRequest' }
      responses:
        '200':
          description: Решение политики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyTestResult' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/policies/{id}:
    get:
      summary: Политика (текущая версия) или шаблон
      x-permission: policies.read
