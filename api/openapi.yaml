      description: |
        Право `applications.policy`. `text` — эталон: UTF-8 до 131072 байт, без управляющих
        символов, кроме табуляции и перевода строки; без `text` — прежний текст (смена режима;
        у приложения без эталона — 400). `mode`: `off` — не сверять, `alert` — находка
        `prompt.integrity` (DM-26) и оповещение, `block` — запрос с другим системным промптом
        блокируется (в режиме политики `monitor` — только журналируется). Сравнение —
        по хешу после нормализации пробельных символов: края обрезаются, последовательность
        пробелов, табуляций и переводов строки — один пробел. Пишет
        `application.prompt_baseline_set` (до и после: режим, хеш, размер; без текста).
        Понижение режима (`block` → `alert` → `off`) — ослабление (DM-40): `weakening: true`
        и повторная проверка (`password` или `code`; без них 400, неверные — 403
        `reauthentication_failed`). Без изменений — 200 без записи. Архивному приложению — 409.
      x-permission: applications.policy
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptBaselineUpdate' }
      responses:
        '200':
          description: Эталон задан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptBaseline' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      summary: Снять эталон системного промпта
      description: |
        Право `applications.policy`. Удаляет текст эталона; шлюзы перестают сверять системный
        промпт приложения с новым пакетом конфигурации. Снятие эталона в режиме `alert` или
        `block` — ослабление (DM-40): тело `{"password": …}` или `{"code": …}` (без них 400,
        неверные — 403 `reauthentication_failed`), запись `application.prompt_baseline_removed`
        с `weakening: true`. Эталона нет — 404.
      x-permission: applications.policy
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reauth' }
      responses:
        '204': { description: Эталон снят }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/gateway-certificate:
    get:
      summary: Сертификат заказчика для адреса шлюза
      description: |
        Право `gateway_tls.read` (S1, ТЗ 5.4; задача 3.27 этапа 3). Сведения о проверенном
        сертификате: кому и кем выдан, срок, имена, алгоритм ключа, отпечаток SHA-256. Закрытый
        ключ не возвращается — только признак `key_set`. Сертификата нет — `configured: false`
        (адрес шлюза обслуживает сертификат внутреннего УЦ).
      x-permission: gateway_tls.read
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Сведения о сертификате
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayCertificate' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      summary: Загрузить или заменить сертификат заказчика
      description: |
        Право `gateway_tls.manage` (администраторы системы и безопасности). Цепочка (лист,
        промежуточные и корневой сертификаты, только блоки `CERTIFICATE`, до 64 КиБ и 10
        сертификатов, порядок любой) и закрытый ключ (ровно один незашифрованный блок PKCS#8,
        PKCS#1 или SEC 1, до 16 КиБ) в PEM. Проверяется: ключ RSA от 2048 бит или ECDSA
        P-256/P-384 и подходит к сертификату; имя `host` есть в SAN; все сертификаты действуют
        сейчас; цепочка строится до самоподписанного корня и годится для TLS-сервера
        (`serverAuth`); лишних сертификатов нет. Ключ хранится зашифрованным ключом данных
        (ЗИ.1) и уходит шлюзам в пакете конфигурации, зашифрованным для каждого шлюза (HPKE);
        шлюзы переключают TLS на адресе приложений без перезапуска. Пишет `gateway_tls.set`
        (без цепочки и ключа). Неверные данные — 400 с причиной по-русски в `errors[].detail`.
      x-permission: gateway_tls.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayCertificateUpload' }
      responses:
        '200':
          description: Сертификат проверен и сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayCertificate' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      summary: Удалить сертификат заказчика
      description: |
        Право `gateway_tls.manage`. Шлюзы с новым пакетом конфигурации возвращаются к своему
        сертификату (`-tls-cert`). Пишет `gateway_tls.delete`. Сертификата нет — 404.
      x-permission: gateway_tls.manage
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Сертификат удалён }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/applications/{id}/keys:
    get:
      summary: Ключи приложения
      description: |
        Право `applications.read` (ИАФ.8). Без секретов: префикс, состояние, срок, подсети.
        Новые первыми, не больше 500. Чужое приложение при области `own` — 404.
      x-permission: applications.read
