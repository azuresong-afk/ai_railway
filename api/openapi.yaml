        source: { $ref: '#/components/schemas/IncidentSource' }
        reopened_from: { type: string, format: uuid }
        assignee_id: { type: string, format: uuid }
        reaction_due_at: { type: string, format: date-time, description: Срок реакции — создание плюс норматив по серьёзности }
        overdue: { type: boolean, description: Срок реакции истёк, а инцидент всё ещё новый }
        reacted_at: { type: string, format: date-time }
        contained_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        closed_at: { type: string, format: date-time }
        closed_by: { type: string }
        version: { type: integer }
    IncidentPage:
