        Право `incidents.manage`. Переходы: `new → in_progress`, `new → closed`,
        `in_progress → contained`, `in_progress → closed`, `contained → closed`; другой — 409.
        Закрытие — только с резолюцией `resolved`, `false_positive` или `risk_accepted`;
