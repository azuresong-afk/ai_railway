            application/json:
              schema: { $ref: '#/components/schemas/AppKeyList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Выпустить ключ приложения
      description: |
        Право `app_keys.manage` (ИАФ.8); с областью `own` — только для своего приложения
        (иначе 404). Ключ `aisec_<префикс>_<секрет>` показывается один раз, хранится только
        хеш профиля. Срок обязателен: 1–730 суток, по умолчанию 365. Привязка к подсетям — до 64
        подсетей в каноническом виде. Не больше 20 действующих ключей (422); архивное
        приложение — 409. Без `Idempotency-Key`: сохранённый ответ содержал бы ключ. Пишет
        `app_key.issue` (префикс, срок, подсети).
      x-permission: app_keys.manage
