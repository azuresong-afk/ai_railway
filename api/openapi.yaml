          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAPIToken' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/api-tokens/{id}:
    get:
      summary: Токен API
      description: Право `api_tokens.read`. Чужой токен при области `own` — 404 (УПД.8).
      security: [{ sessionCookie: [] }]
      x-permission: api_tokens.read
      parameters:
        - $ref: '#/components/parameters/APITokenID'
      responses:
        '200':
          description: Токен без секрета
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIToken' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
    delete:
      summary: Отозвать токен API
      description: |
        Право `api_tokens.manage`. Свой токен — при любой области; чужой — только при
        области `all` и если права владельца входят в права отзывающего (403, УПД.2), иначе
        404. Токен не удаляется: отмечается отзыв, отозванный токен не оживает; повторный
        отзыв — 409. Пишет `api_token.revoke`.
      security: [{ sessionCookie: [] }]
      x-permission: api_tokens.manage
      parameters:
        - $ref: '#/components/parameters/APITokenID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Токен отозван
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIToken' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /api/v1/events:
    get:
      summary: Список событий за период по фильтру
      description: |
        Право `events.read` (ТЗ 5.5). Только метаданные, без содержимого запросов и ответов.
        Порядок — от новых к старым по времени из ID события. Период — не длиннее 31 суток
        (по умолчанию последние 24 часа). Язык фильтра — условия через `and`, например
        `app = "crm-bot" and severity in ("high", "critical") and stream = true`; поля:
        type, app, env, user, provider, model, source, policy_mode, action, rule, severity,
        storage, gateway, threat, detector, exception (находки, пропущенные по исключению с этим ID),
        mark (`false_positive`, `confirmed` или `none` — без отметки), stream, non_text_unchecked,
        has_content; операторы
