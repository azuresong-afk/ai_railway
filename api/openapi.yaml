      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Политики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyList' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Создать политику
      description: |
        Право `policies.manage` (признак `security`: только администратор безопасности, УПД.2;
        токену API недоступно). Содержимое `spec` или копия шаблона `from_template`; версия 1.
        Проверка строгая: неизвестный детектор, направление или категория — 400 с полем
        (`rules[2].action`). Пустой `non_text` — `allow_inline` (решение 1.19), пустой
        `response_check` — `incremental`; сохранённая версия хранит их явно. Пишет `policy.create`.
