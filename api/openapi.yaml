        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events/{id}:
    get:
      summary: Карточка события без содержимого
      description: |
        Право `events.read`. Решение с трассировкой, находки, задержки, токены (`details`);
        `has_content` — есть ли сохранённое содержимое. Хеш фрагмента находки (`fragment`) —
        только субъекту с `events.content.read` или `policies.manage` (3Н41), источник текста
        находки — `source`. Пишет `events.view` (отключаемое).
      x-permission: events.read
