        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      summary: Снять бюджет приложения
      description: |
        Право `budgets.manage`. Расход продолжает учитываться. Пишет `budget.delete`
