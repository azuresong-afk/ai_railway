      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Бюджет снят }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
