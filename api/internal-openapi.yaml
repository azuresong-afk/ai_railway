# Контракт внутреннего API сервера управления для шлюзов (ТЗ 11.1, 13;
# ИАФ.10, решение Р8, ADR-0009). Отдельный порт aisec-server
# (-internal-listen, по умолчанию 127.0.0.1:8445) и отдельный файл: этот API
# не для веб-консоли и не попадает в типы фронтенда. Аутентификация — только
# mTLS: TLS не устанавливается без клиентского сертификата внутреннего УЦ
# (RequireAndVerifyClientCert), а сертификат при каждом запросе сверяется с
# действующей строкой реестра шлюзов (серийный номер и ID). Сертификат шлюз
# получает по токену на порту консоли: POST /api/v1/gateways/register в
# api/openapi.yaml. Ошибки — Problem Details (RFC 9457). Контрактный тест
# internal/api сверяет маршруты внутреннего порта с этим файлом в обе стороны.
# Приём событий (POST /internal/v1/events:batch) — задача 2.15; пакеты
# конфигурации (GET /internal/v1/policies/bundle и отчёт о применении) —
# задача 2.13.
openapi: 3.1.0
info:
  title: AISec internal API
  version: 0.0.0
security:
  - gatewayCert: []
paths:
  /internal/v1/heartbeat:
    post:
      summary: Heartbeat шлюза — последний контакт, версия шлюза и пакета
      description: |
        Сервер отмечает время, адрес, версию шлюза и ETag применённого пакета
        конфигурации. Не чаще одного раза в 10 секунд на шлюз (иначе 429 с
        `Retry-After`) и не больше общего предела внутреннего порта с адреса
        (600 в минуту). Ответ — время сервера (шлюз предупреждает о расхождении
        часов больше 30 секунд, ВРМ.1) и рекомендуемый период. Отозванный шлюз,
        заменённый или неизвестный сертификат — 401 и запись `gateway.mtls_denied`
        в аудит (не чаще раза в минуту на сертификат).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
      responses:
        '200':
          description: Контакт отмечен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeartbeatResponse' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
  /internal/v1/events:batch:
    post:
      summary: Пакет событий шлюза (ТЗ 5.5, решение Р9)
      description: |
        Шлюз отправляет события пакетами по 1–500, тело до 8 МиБ. Событие
        привязывается к шлюзу из клиентского сертификата; поля шлюза в теле нет
        (неизвестные поля — 400). Приём идемпотентен по ID события (UUIDv7):
        повтор пакета после обрыва ответа не создаёт дублей (`duplicates`).
        Ошибка структуры пакета — 400 на весь пакет; ошибка отдельного события —
        отказ только в нём (`rejected`: индекс и код). Окно приёма — время
        события не старше 7 суток и не дальше 5 минут в будущем и не дальше
        5 минут от времени в его UUIDv7. Содержимое `full` сервер шифрует ключом
        данных (ЗИ.1), `masked` хранит как прислал шлюз, при `none` содержимого
        быть не должно. Если открытый текст `full` не помещается в предел
        шифротекста (256 КиБ), сервер обрезает запрос и ответ по границе
        символа с «…», ставит событию `details.content_truncated` и считает
        его в `truncated`. Если СУБД отвергла событие, которое прошло проверку,
        отказ получает только оно (код `storage`), остальные события пакета
        записываются. Предел частоты — общий для внутреннего порта (600 в
        минуту с адреса). 503 с `Retry-After` — хранилище временно недоступно,
        пакет стоит повторить; 422 — хранилище отвергло счётчики шлюза
        (`stats`), повтор не поможет.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatch' }
      responses:
        '200':
          description: Пакет обработан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventBatchResult' }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '422': { $ref: '#/components/responses/ProblemUnprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/ProblemUnavailable' }
  /internal/v1/policies/bundle:
    get:
      summary: Подписанный пакет конфигурации шлюза (Р7, ОЦЛ.3, задача 2.13)
      description: |
        Пакет — приложения с хешами ключей и словарями, провайдеры без
        учётных данных, текущие версии политик (ADR-0009, раздел «Пакеты
        конфигурации»). Подпись Ed25519 ключом `bundle-signing.key` над байтами
        заголовка, содержимого и секретов; шлюз проверяет её, свой ID и версию
        до разбора содержимого. Учётные данные провайдеров — только в разделе
        `secrets`, зашифрованном HPKE (DHKEM X25519, HKDF-SHA256, AES-256-GCM)
        для ключа из заголовка `AISec-Bundle-Key`: открытым текстом их нет ни
        в ответе, ни в журналах. Сервер собирает новую версию, когда меняются
        данные (`bundle.build` в аудите). Приложение, которое шлюз отверг бы
        (например, политика ссылается на словарь, которого нет у приложения),
        в версию не входит: его ключи — в части `unavailable` содержимого,
        шлюз отвечает по нему 503 `app_unavailable`, остальные приложения
        получают версию (В16 ревью 2.r3b). Если не собирается всё содержимое
        (размер), выдаётся последняя корректная версия. Каждая выдача
        200 пишется в аудит (`bundle.deliver`), 304 — нет. Предел частоты —
        общий для внутреннего порта (600 в минуту с адреса); шлюз опрашивает
        раз в 30 секунд.
      parameters:
        - name: AISec-Bundle-Key
          in: header
          required: true
          description: Открытый ключ шлюза X25519 (32 байта, base64url без дополнения) для шифрования учётных данных
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        - name: If-None-Match
          in: header
          required: false
          description: ETag применённой версии; совпал — 304 без тела
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Пакет (не больше 8 МиБ)
          headers:
            ETag: { description: 'Версия пакета в кавычках, например "1761048000123"', schema: { type: string } }
            Cache-Control: { description: no-store, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigBundle' }
        '304':
          description: У шлюза уже эта версия
          headers:
            ETag: { schema: { type: string } }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
        '503': { $ref: '#/components/responses/ProblemUnavailable' }
  /internal/v1/policies/bundle/status:
    post:
      summary: Итог применения пакета на шлюзе
      description: |
        Шлюз сообщает, что применил версию (`bundle.applied` в аудите) или
        отклонил пакет (`bundle.rejected`, DM-42: подпись, откат версии, чужой
        шлюз, формат, содержимое, размер, расшифрование). Одинаковые отчёты
        пишутся не чаще раза в минуту на шлюз. Тело до 1 КиБ.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleStatus' }
      responses:
        '204': { description: Отчёт записан }
        '400': { $ref: '#/components/responses/ProblemInvalid' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '413': { $ref: '#/components/responses/ProblemTooLarge' }
        '415': { $ref: '#/components/responses/ProblemUnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ProblemInternal' }
components:
  securitySchemes:
    gatewayCert:
      type: mutualTLS
      description: Клиентский сертификат шлюза от внутреннего УЦ (CN — ID шлюза, назначение clientAuth)
  responses:
    ProblemInvalid:
      description: Ошибка в теле запроса (`invalid_request`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemUnauthorized:
      description: Сертификат не принадлежит действующему шлюзу (`unauthorized`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemForbidden:
      description: Действие не разрешено шлюзу (`forbidden`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemTooLarge:
      description: Тело больше предела маршрута — heartbeat 4 КиБ, пакет событий 8 МиБ, отчёт о пакете 1 КиБ (`payload_too_large`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemUnsupportedMedia:
      description: Тело не в формате JSON (`unsupported_media_type`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Превышен предел частоты (`rate_limited`, ЗИ.6)
      headers:
        Retry-After: { description: Через сколько секунд повторить, schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemInternal:
      description: Внутренняя ошибка (`internal_error`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemUnprocessable:
      description: Хранилище отвергло данные пакета; повтор не поможет (`unprocessable`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemUnavailable:
      description: Хранилище временно недоступно; повторить после `Retry-After` (`service_unavailable`)
      headers:
        Retry-After: { description: Через сколько секунд повторить, schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ConfigBundle:
      description: |
        Конверт пакета (internal/policy/bundle). Части — стандартный base64:
        `header` — JSON {format, version, issued_at, gateway_id, content_hash,
        hash_alg}; `content` — JSON {providers, applications, policies,
        unavailable} без учётных данных; `secrets` — шифротекст HPKE списка
        {provider, credential}; `signature` — Ed25519 над
        `format || 0x00 || len(header) || header || len(content) || content || len(secrets) || secrets`
        (длины — 4 байта big-endian). Неизвестные поля на любом уровне — отказ
        на шлюзе.
      type: object
      required: [format, key_id, header, content, secrets, signature]
      additionalProperties: false
      properties:
        format: { type: string, enum: [aisec-config-bundle/1] }
        key_id: { type: string, pattern: '^[0-9a-f]{16}$', description: Первые 8 байт хеша открытого ключа подписи }
        header: { type: string }
        content: { type: string }
        secrets: { type: string }
        signature: { type: string }
    BundleStatus:
      type: object
      required: [result, version]
      additionalProperties: false
      properties:
        result: { type: string, enum: [applied, rejected] }
        version: { type: integer, minimum: 0, description: 'Версия из пакета; 0 — версия не прочитана (пакет отклонён до проверки подписи)' }
        reason:
          type: string
          enum: [too_large, format, signature, gateway_mismatch, rollback, invalid_content, decrypt]
          description: Только для rejected
    HeartbeatRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, minLength: 1, maxLength: 64, pattern: '^[0-9A-Za-z.+_-]+$', description: Версия шлюза }
        bundle_etag: { type: string, maxLength: 128, pattern: '^[!-~]*$', description: 'ETag применённого пакета конфигурации; пусто — пакета нет' }
        selftest:
          description: |
            Итог самотестирования шлюза при запуске (ОЦЛ.4–5, задача 2.20).
            Необязателен: шлюз прежней версии поле не присылает, сервер тогда
            показывает «нет данных». `reason` у самотеста не задаётся.
          allOf: [{ $ref: '#/components/schemas/CheckReport' }]
        integrity:
          description: |
            Последний итог контроля целостности шлюза (ОЦЛ.2). `reason` — из
            перечня; `ok: true` только при `reason: ok`.
          allOf: [{ $ref: '#/components/schemas/CheckReport' }]
    CheckReport:
      description: |
        Итог проверки шлюза: только результат и число провалов. Пути файлов,
        имена детекторов и тексты эталонов на сервер не передаются.
      type: object
      required: [ok, checked_at, failed]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        checked_at: { type: string, format: date-time, description: 'Время проверки; не позже чем на 5 минут вперёд от часов сервера' }
        reason:
          type: string
          enum: [ok, manifest_missing, manifest_invalid, signature_invalid, files_mismatch]
          description: Только у integrity
        failed: { type: integer, minimum: 0, maximum: 1000, description: 'Число провалов; при `ok: true` — 0' }
    HeartbeatResponse:
      type: object
      required: [server_time, interval_seconds]
      properties:
        server_time: { type: string, format: date-time }
        interval_seconds: { type: integer, minimum: 1, description: Рекомендуемый период heartbeat }
    EventBatch:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Event' }
        stats: { $ref: '#/components/schemas/SenderStats' }
    SenderStats:
      description: Счётчики отправителя шлюза с его запуска (DM-44, «Состояние системы»)
      type: object
      required: [started_at, dropped, rejected]
      additionalProperties: false
      properties:
        started_at: { type: string, format: date-time }
        dropped: { type: integer, minimum: 0, description: 'Отброшены: очередь переполнена или сервер недоступен при остановке' }
        rejected: { type: integer, minimum: 0, description: Отклонены сервером }
    Event:
      description: |
        Событие шлюза (ТЗ 5.5; схема — internal/events.Event). Строки
        приложения, среды, пользователя, провайдера, модели, источника, полей
        решения и находок — до 256 байт; содержимое запроса и ответа — до
        64 КиБ каждое; находок — до 1024; категорий угроз — до 64 (`DM-NN`);
        символ U+0000 не допускается. Неизвестные поля на любом уровне — 400.
      type: object
      required: [id, time, type]
      additionalProperties: false
      properties:
        id: { type: string, description: UUIDv7 в канонической записи строчными }
        time: { type: string, format: date-time }
        type: { type: string, enum: [gateway_request, check, auth_failure] }
        app: { type: string, maxLength: 256 }
        env: { type: string, maxLength: 256 }
        user: { type: string, maxLength: 256, description: 'Псевдоним пользователя (HMAC), не исходный идентификатор' }
        provider: { type: string, maxLength: 256 }
        model: { type: string, maxLength: 256 }
        source: { type: string, maxLength: 256 }
        policy_mode: { type: string, enum: [monitor, enforce] }
        decision: { type: object, description: 'Решение и трассировка (internal/events.Decision)' }
        findings: { type: array, maxItems: 1024, items: { type: object } }
        threats: { type: array, maxItems: 64, items: { type: string, pattern: '^DM-[0-9]{2}$' } }
        latency_ms: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        tokens: { type: object }
        stream: { type: boolean }
        non_text_unchecked: { type: boolean }
        storage: { type: string, enum: [none, masked, full] }
        content:
          type: object
          additionalProperties: false
          properties:
            request: { type: string }
            response: { type: string }
        response: { type: object }
        pseudonyms: { type: object }
        auth_failure: { type: object }
    EventBatchResult:
      type: object
      required: [accepted, duplicates, rejected]
      properties:
        accepted: { type: integer, minimum: 0, description: Записано новых событий }
        duplicates: { type: integer, minimum: 0, description: 'Уже были записаны (повтор пакета)' }
        rejected:
          type: array
          items:
            type: object
            required: [index, code]
            properties:
              index: { type: integer, minimum: 0, description: Номер события в пакете }
              code: { type: string, enum: [invalid, id, time, limits, nul, storage] }
        truncated: { type: integer, minimum: 0, description: 'Принятые события full, содержимое которых обрезано под предел хранения' }
    Problem:
      description: Problem Details (RFC 9457), как в api/openapi.yaml
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, detail]
            properties:
              field: { type: string }
              detail: { type: string }
