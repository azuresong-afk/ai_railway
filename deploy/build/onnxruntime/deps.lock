# Исходники ONNX Runtime 1.31.0 и его зависимостей для сборки без сети
# (ADR-0024, раздел 8; задача 4.19). Читают fetch.sh (шаг с сетью) и
# build.sh (шаг без сети).
#
# Формат: имя;вид;источник;версия;sha256;лицензия
#   git — источник — репозиторий, версия — полный коммит; архив —
#         git archive --format=tar --prefix=<имя>/ <коммит>: архивы GitHub
#         (codeload) из среды разработки недоступны, git clone работает;
#   url — источник — архив выпуска (только https), версия — «-».
# sha256 — хеш файла в локальном зеркале (<имя>.tar для git, имя файла
# источника для url). Имя совпадает с первым столбцом cmake/deps.txt ORT:
# build.sh подставляет в deps.txt путь к файлу зеркала и его SHA-1.
# Зависимость, которой здесь нет, сборка без сети не получит — ошибка cmake.
# Список — минимальный для библиотеки CPU без тестов, Python и телеметрии;
# лицензии — для docs/cert/components.yaml.
