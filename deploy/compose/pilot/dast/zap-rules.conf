# Правила ZAP baseline (ключ -c) для DAST пилота (задача 3.30, решение Р10).
# Формат: <id правила> <ДЕЙСТВИЕ> (<имя>), разделитель — табуляция.
# Действия: FAIL — находка выше порога и проваливает задание, пока не размечена
# как ложная в docs/cert/sast-triage/dast.yaml; WARN — ниже порога, попадает в
# отчёт; IGNORE — правило не применимо к установке (обоснование — в комментарии).
# Находка риска Medium и выше проваливает задание независимо от этого файла
# (tools/dast-triage). Остальные правила работают с действием WARN по умолчанию.
#
# Заголовки защиты консоли — требование ТЗ 6.9 (строгий CSP) и ЗИ: их
# отсутствие недопустимо.
10020	FAIL	(Anti-clickjacking Header)
10021	FAIL	(X-Content-Type-Options Header Missing)
10035	FAIL	(Strict-Transport-Security Header)
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10055	FAIL	(CSP)
10096	WARN	(Timestamp Disclosure)
