# Стенд разработки: шлюз перед mock-llm (ТЗ, 11.5). Запуск — make dev.
# PostgreSQL — с задачи 2.1 этапа 2 (порт 127.0.0.1:5432, пароль — .dev-keys/pg-password);
# сервер управления и веб-консоль появятся позже.
#
# Сертификаты, ключ приложения (.dev-keys/app-key) и конфигурацию шлюза
# выпускает make devcerts в .dev-keys/ (ключи с правами 0600). События шлюза
# пишутся в .dev-data/events.jsonl.
# Контейнеры работают от UID и GID пользователя, который запускает стенд
# (AISEC_UID, AISEC_GID задаёт make dev), иначе ключ нельзя было бы прочитать
# без ослабления прав.
name: aisec-dev

x-hardening: &hardening
  user: "${AISEC_UID:?задайте AISEC_UID (make dev)}:${AISEC_GID:?задайте AISEC_GID (make dev)}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 256m

services:
  mock-llm:
    <<: *hardening
    build:
      context: ../../..
      dockerfile: deploy/compose/dev/Dockerfile
      target: mock-llm
    image: aisec-dev/mock-llm
    # Только внутренняя сеть без выхода наружу: доступен лишь шлюзу.
    networks: [internal]
    volumes:
      - ../../../.dev-keys/server.pem:/keys/server.pem:ro
      - ../../../.dev-keys/server-key.pem:/keys/server-key.pem:ro
    command: ["-listen", "0.0.0.0:9443", "-cert", "/keys/server.pem", "-key", "/keys/server-key.pem"]

  aisec-gateway:
    <<: *hardening
    build:
      context: ../../..
      dockerfile: deploy/compose/dev/Dockerfile
      target: aisec-gateway
    image: aisec-dev/aisec-gateway
    # internal — к mock-llm; edge — только ради опубликованного порта.
    networks: [internal, edge]
    # Только нужные шлюзу файлы: ключ приложения (app-key) — клиентский,
    # в контейнер шлюза он не попадает.
    volumes:
      - ../../../.dev-keys/server.pem:/keys/server.pem:ro
      - ../../../.dev-keys/server-key.pem:/keys/server-key.pem:ro
      - ../../../.dev-keys/ca.pem:/keys/ca.pem:ro
      - ../../../.dev-keys/gateway.yaml:/keys/gateway.yaml:ro
      - ../../../.dev-data:/data
    command:
      - "-config=/keys/gateway.yaml"
      - "-listen=0.0.0.0:8443"
      - "-tls-cert=/keys/server.pem"
      - "-tls-key=/keys/server-key.pem"
    # Только на 127.0.0.1 хоста: стенд разработки, проверок содержимого пока нет.
    ports: ["127.0.0.1:8443:8443"]
    depends_on: [mock-llm]

  postgres:
    <<: *hardening
    image: postgres:17.6-alpine
    networks: [internal, edge]
    environment:
      POSTGRES_USER: aisec
      POSTGRES_DB: aisec
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ../../../.dev-keys/pg-password:/run/secrets/pg-password:ro
      - ../../../.dev-data/pg:/var/lib/postgresql/data
    tmpfs: ["/tmp", "/var/run/postgresql"]
    mem_limit: 512m
    # Только на 127.0.0.1 хоста: для тестов store и aisec-cli migrate.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisec -d aisec"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Внутренняя сеть без выхода в интернет.
  internal:
    internal: true
  edge: {}
