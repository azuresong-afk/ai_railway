# Пакет aisec-ml: шлюз подключается к ML-детекторам (как compose.ml.yaml).
# Wants=, а не Requires=: падение aisec-ml не останавливает шлюз — проверки
# получают признак ml_unavailable (ADR-0024). Удаление пакета aisec-ml
# удаляет и это дополнение.
[Unit]
Wants=aisec-ml.service
After=aisec-ml.service

[Service]
Environment=AISEC_GATEWAY_ML_SOCKET=/run/aisec-ml/aisec-ml.sock
