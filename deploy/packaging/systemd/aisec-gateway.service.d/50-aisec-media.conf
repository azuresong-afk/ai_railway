# Пакет aisec-media: шлюз передаёт изображения анализатору (как
# compose.media.yaml). Wants=, а не Requires=: падение aisec-media не
# останавливает шлюз — изображения получают отметку «не проверено»
# (ADR-0032, раздел 8). Удаление пакета aisec-media удаляет и это дополнение.
[Unit]
Wants=aisec-media.service
After=aisec-media.service

[Service]
Environment=AISEC_GATEWAY_MEDIA_SOCKET=/run/aisec-media/aisec-media.sock
