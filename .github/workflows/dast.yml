# DAST пилота (задача 3.30 этапа 3, решение Р10): OWASP ZAP baseline против
# консоли и шлюза установки в docker compose. Пассивная проверка, активных
# атак нет. ZAP — только здесь, в поставку и в make check он не входит.
# Находки Medium и выше или правила FAIL (deploy/compose/pilot/dast/zap-rules.conf)
# проваливают задание, пока не размечены в docs/cert/sast-triage/dast.yaml;
# ниже порога — попадают в отчёт. Вся логика — в Makefile (ADR-0002).
name: dast

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # по понедельникам: регулярный прогон без изменений кода
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe для версии образов

      # Образы пилота с тестовым ключом манифеста — НЕ ДЛЯ ПОСТАВКИ.
      - name: Образы пилота
        run: make images-test-docker

      - name: Тестовый бинарник стенда
        run: make e2e-pilot-bin-docker

      - name: ZAP baseline по консоли и шлюзу
        run: make dast-run

      - name: Сверка находок с правилами и разметкой
        run: make dast-triage-docker

      - name: Отчёты DAST
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-reports
          if-no-files-found: warn
          retention-days: 90
          path: build/dast/
