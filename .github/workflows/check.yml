# CI — тонкая обёртка над make (ADR-0002): вся логика в Makefile, здесь —
# только сборочный образ, запуск make check в нём и выгрузка отчётов.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Устаревшие прогоны отменяются только для pull request; проверки коммитов
  # в main доводятся до конца.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Сквозные тесты этапа 2 идут на живой PostgreSQL (ADR-0002, дополнение):
    # тот же образ, что в compose пилота (ADR-0019). Пароль — тестовый, база одноразовая.
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: aisec
          POSTGRES_PASSWORD: devtest
          POSTGRES_DB: aisec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisec -d aisec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AISEC_TEST_DATABASE_URL: postgres://aisec:devtest@127.0.0.1:5432/aisec_test?sslmode=disable
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe для версии в SBOM

      - name: make check в сборочном образе
        run: make check-docker

      - name: Отчёты проверок
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports
          if-no-files-found: warn
          retention-days: 90
          path: |
            build/sast/
            build/sbom/
            build/dm-coverage.md
            build/dm-coverage.json

  # Образы поставки пилота (ADR-0019, ЗИ.5): сборка с тестовым ключом
  # манифеста — НЕ ДЛЯ ПОСТАВКИ — и проверка tools/imagecheck: не root, нет
  # оболочки и пакетов ОС, только свои порты, бинарники совпадают с
  # подписанным выпуском; правила compose пилота. Поставочные образы
  # (make images, RELEASE=1) собирает владелец ключа производителя.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe для версии образов

      - name: Сборка и проверка образов
        run: make images-test-docker

      # Задачи 3.7 и 3.8 этапа 3: compose пилота без выхода наружу с ловушкой
      # сети, копия и восстановление. Тестовый бинарник — от root (sudo -n).
      - name: e2e пилота — без интернета, копия и восстановление
        run: |
          make e2e-pilot-bin-docker
          make e2e-pilot-run

      - name: SBOM и архивы образов
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-images-test
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/images/
            build/release/aisec-manifest.json
            build/release/aisec-manifest.json.sig
