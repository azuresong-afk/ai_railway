# CI — тонкая обёртка над make (ADR-0002): вся логика в Makefile, здесь —
# только сборочный образ, запуск make check в нём и выгрузка отчётов.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Устаревшие прогоны отменяются только для pull request; проверки коммитов
  # в main доводятся до конца.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Сквозные тесты этапа 2 идут на живой PostgreSQL (ADR-0002, дополнение):
    # той же версии, что в docker compose. Пароль — тестовый, база одноразовая.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: aisec
          POSTGRES_PASSWORD: devtest
          POSTGRES_DB: aisec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisec -d aisec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AISEC_TEST_DATABASE_URL: postgres://aisec:devtest@127.0.0.1:5432/aisec_test?sslmode=disable
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe для версии в SBOM

      - name: make check в сборочном образе
        run: make check-docker

      - name: Отчёты проверок
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports
          if-no-files-found: warn
          retention-days: 90
          path: |
            build/sast/
            build/sbom/
            build/dm-coverage.md
            build/dm-coverage.json
