# База требований: персональные данные (ТЗ 2.4; задача 4.24). Пересказ
# своими словами. Пункты ПП № 1119 не приводятся: ТЗ их не называет, а
# редакция постановления меняется; уточнение — в обновлении базы.
format: aisec-compliance-base-v1
version: 1
date: "2026-10-28"
sources:
  - {id: fz-152, title: "Федеральный закон № 152-ФЗ «О персональных данных»"}
  - {id: pp-1119, title: "Постановление Правительства РФ № 1119"}
requirements:
  - id: fz152.external-models
    source: fz-152
    clause: "ст. 12, ст. 19"
    title: "Персональные данные в запросах к внешним моделям, в том числе за границу"
    summary: "Данные людей не уходят внешнему провайдеру без защиты; для зарубежных сервисов оператор отдельно оценивает правомерность передачи. Платформа убирает ПДн из запроса, а правовое основание подтверждает человек."
    applies: [ispdn, commercial]
    manual: true
    checks:
      - {name: pii_protection_external, params: {env: prod}}
    evidence:
      - {kind: screen, title: "Провайдеры: внешние сервисы", path: /providers}
      - {kind: screen, title: "Политики: защита ПДн", path: /policies}
  - id: fz152.leak-response
    source: fz-152
    clause: "ст. 21, ч. 3.1"
    title: "Выявление утечек и уведомление об инцидентах с персональными данными"
    summary: "Утечки замечаются сразу и разбираются как инциденты; о произошедшем оператор уведомляет надзорный орган в установленный срок. Платформа показывает находки и ведёт инциденты, уведомление отправляет человек."
    applies: [ispdn, commercial]
    manual: true
    checks:
      - {name: alert_rules_enabled, params: {min: "3"}}
      - {name: notification_channel}
    evidence:
      - {kind: screen, title: "Инциденты", path: /incidents}
      - {kind: screen, title: "Оповещения", path: /alerts}
  - id: pp1119.protection-measures
    source: pp-1119
    clause: "в целом"
    title: "Выбор и реализация мер защиты персональных данных в информационной системе"
    summary: "Для информационной системы определён уровень защищённости ПДн и реализованы меры, соответствующие ему. Это решение оператора; платформа входит в состав мер."
    applies: [ispdn, commercial]
    manual: true
  - id: pp1119.access-log
    source: pp-1119
    clause: "в целом"
    title: "Регистрация событий безопасности и управление доступом к персональным данным"
    summary: "Действия с данными и права доступа фиксируются в журнале, который нельзя тихо изменить; вход в консоль защищён вторым фактором."
    applies: [ispdn, commercial]
    checks:
      - {name: mfa_privileged_roles}
      - {name: audit_chain_verified, params: {max_age_hours: "48"}}
    evidence:
      - {kind: audit, title: "Журнал аудита", path: /admin, hint: "вкладка «Журнал аудита»"}
      - {kind: screen, title: "Администрирование: пользователи и роли", path: /admin}
  - id: pp1119.certified-tools
    source: pp-1119
    clause: "в целом"
    title: "Применение средств защиты, прошедших оценку соответствия"
    summary: "Используемые средства защиты информации прошли процедуру оценки соответствия. Сертификат платформы приобщается к документам оператора."
    applies: [ispdn]
    manual: true
