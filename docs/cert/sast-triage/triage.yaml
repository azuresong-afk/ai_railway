# Разметка срабатываний статического анализа (ТЗ, 8.4). Формат — README.md рядом.
schema_version: 1
entries:
  - rule: gosec/G101
    file: internal/chat/request.go
    snippet: 'CodeMaxTokens      = "max_tokens_exceeded"'
    verdict: false_positive
    justification: Код ошибки в формате OpenAI для ответа приложению («max_tokens больше квоты»). Правило реагирует на слово Tokens в имени константы; это число токенов модели, а не учётные данные, секрета в строке нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-06
  - rule: gosec/G704
    file: internal/providers/core.go
    snippet: 'resp, err := b.client.Do(hr)'
    verdict: false_positive
    justification: Запрос к провайдеру собирают адаптеры (post, YandexGPT.postFolder) только на адрес, вычисленный при создании провайдера из base_url и auth_url файла конфигурации администратора (allowlist исходящих соединений, ЗИ.3); из запроса приложения адрес не берётся. Перенаправления клиент не выполняет (CheckRedirect), прокси из окружения не используются. Анализ помечает параметр функции как недоверенный, не видя, откуда он пришёл.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-08
  - rule: gosec/G124
    file: internal/api/session.go
    snippet: 'http.SetCookie(w, &http.Cookie{Name: CSRFCookie, Value: csrf, Path: "/",'
    verdict: false_positive
    justification: Cookie __Host-aisec_csrf намеренно без HttpOnly — это схема двойной отправки (решение Р6 этапа 2, ТЗ 6.9) — интерфейс читает CSRF-токен из cookie и возвращает его в заголовке X-CSRF-Token. Secure и SameSite=Strict выставлены в той же записи. Токен не даёт доступа без cookie сессии __Host-aisec_session (HttpOnly) и привязан к своей сессии; сессионный токен скриптам недоступен.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-20
  - rule: gosec/G101
    file: internal/gwregistry/gwregistry.go
    snippet: 'const TokenPrefix = "aisec_gwreg_"'
    verdict: false_positive
    justification: Публичный префикс формата токена регистрации шлюза (как «ghp_» у GitHub) — по нему токен распознаётся в логах и сканерами секретов. Секретная часть — 32 случайных байта от генератора криптопрофиля (aisecCrypto.RandomBytes) — дописывается при выпуске в IssueToken и в коде не хранится; в БД — только хеш токена (SHA-256 в профиле standard).
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-21
  - rule: gosec/G101
    file: cmd/aisec-gateway/register.go
    snippet: 'tokenEnv = "AISEC_GATEWAY_REGISTRATION_TOKEN"'
    verdict: false_positive
    justification: Имя переменной окружения, из которой aisec-gateway register читает токен регистрации (аргументом токен не принимается, чтобы он не был виден в списке процессов). Значения токена в коде нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-21
  - rule: gosec/G124
    file: internal/api/session.go
    snippet: 'http.SetCookie(w, &http.Cookie{Name: CSRFCookie, Value: "", Path: "/", MaxAge: -1,'
    verdict: false_positive
    justification: Удаление cookie __Host-aisec_csrf при выходе (пустое значение, MaxAge -1) с теми же атрибутами, что при выдаче — без HttpOnly по схеме двойной отправки (Р6), с Secure и SameSite=Strict. Значения в cookie нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-20
  - rule: gosec/G101
    file: internal/auth/permissions.go
    snippet: 'PermAPITokensManage = "api_tokens.manage"'
    verdict: false_positive
    justification: Имя разрешения RBAC «выпуск и отзыв токенов API» (задача 2.10) — строка каталога прав, которая попадает в api/openapi.yaml (x-permission) и в матрицу ролей. Правило реагирует на слово Tokens в имени константы; секрета в строке нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-21
  - rule: gosec/G703
    file: cmd/aisec-server/main.go
    snippet: 'if _, err := os.Stat(path); err == nil {'
    verdict: false_positive
    justification: Путь собирается из каталога ключей (флаг -keys-dir, задаёт администратор при запуске сервера) и констант bundleSigningPubFile и bundleSigningNextFile; из запросов к серверу путь не берётся. os.Stat только проверяет наличие файла, чтобы поставить его под контроль целостности.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G101
    file: internal/backup/format.go
    snippet: 'PassphraseHint = "возьмите 4–5 случайных слов через пробел"'
    verdict: false_positive
    justification: Подсказка пользователю aisec-cli, как выбрать фразу резервной копии (Н41 ревью 2.r4). Правило реагирует на слово Passphrase в имени константы; фразы или ключа в строке нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G101
    file: internal/backup/snapshot.go
    snippet: 'secretUserHMACKey        = "user_hmac_key"'
    verdict: false_positive
    justification: Имя вида секрета в разделе секретов резервной копии (метка, по которой при восстановлении находится запись). Сам ключ HMAC в коде не хранится, в копии он зашифрован ключом копии.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G104
    file: internal/integrity/monitor.go
    snippet: 'res, _, err := m.checkRecorded(ctx, trig, by, ip)'
    verdict: false_positive
    justification: Отбрасывается recErr — ошибка сохранения итога проверки в БД. checkRecorded уже записывает её в технический журнал (класс db), а реакция на итог применяется и без записи. Ошибку самой проверки (err) check возвращает вызывающему.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G101
    file: cmd/aisec-cli/backup_test.go
    snippet: 'pw := "$argon2id$v=19$m=65536,t=3,p=2$c2FsdHNhbHRzYWx0c2FsdA$a2V5a2V5a2V5a2V5a2V5a2V5a2V5a2V5a2V5a2U"'
    verdict: false_positive
    justification: Синтетический хэш argon2id для теста восстановления. Соль и значение — повторы слов salt и key в base64; пароля, которому он соответствует, нет, и нигде он не выдавался.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G101
    file: internal/backup/format_test.go
    snippet: 'Users: []User{{ID: user1, Login: "admin", DisplayName: "Админ", Role: "security_admin", Status: "active",'
    verdict: false_positive
    justification: Синтетический пользователь теста формата копии с синтетическим хэшем argon2id (повторы слов salt и key в base64). Пароля, которому соответствует хэш, нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G703
    file: cmd/aisec-cli/backup_test.go
    snippet: 'if err := os.WriteFile(tampered, bad, 0o600); err != nil {'
    verdict: false_positive
    justification: Путь — filepath.Join от t.TempDir() и константного имени файла; внешнего ввода в тесте нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G703
    file: tools/manifest/main_test.go
    snippet: 'if err := os.WriteFile(asVendor, testSign, 0o400); err != nil {'
    verdict: false_positive
    justification: Путь — filepath.Join от t.TempDir() и константного имени файла; внешнего ввода в тесте нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G704
    file: test/e2e/stage2_bundle_test.go
    snippet: 'req, err := http.NewRequestWithContext(r.Context(), r.Method, p.upstream+r.URL.RequestURI(), bytes.NewReader(body))'
    verdict: false_positive
    justification: Тестовый прокси между шлюзом и сервером e2e-теста. Адрес назначения p.upstream задаёт сам тест (внутренний порт запущенного им сервера на 127.0.0.1); из запроса берётся только путь, хост и схема — нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G704
    file: test/e2e/stage2_bundle_test.go
    snippet: 'resp, err := p.up.Do(req)'
    verdict: false_positive
    justification: Отправка запроса тестового прокси, собранного строкой выше на адрес p.upstream, который задаёт сам тест (127.0.0.1); хост из входящего запроса не берётся.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
  - rule: gosec/G304
    file: test/e2e/stage2_bundle_test.go
    snippet: 'b, err := os.ReadFile(path)'
    verdict: false_positive
    justification: Читаются файлы, которые создал сам тест в своём временном каталоге (сертификаты TLS, файл пакета шлюза); внешнего ввода в тесте нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-22
