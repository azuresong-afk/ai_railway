# Разметка срабатываний статического анализа (ТЗ, 8.4). Формат — README.md рядом.
schema_version: 1
entries:
  - rule: gosec/G101
    file: internal/chat/request.go
    snippet: 'CodeMaxTokens      = "max_tokens_exceeded"'
    verdict: false_positive
    justification: Код ошибки в формате OpenAI для ответа приложению («max_tokens больше квоты»). Правило реагирует на слово Tokens в имени константы; это число токенов модели, а не учётные данные, секрета в строке нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-06
  - rule: gosec/G704
    file: internal/providers/core.go
    snippet: 'resp, err := b.client.Do(hr)'
    verdict: false_positive
    justification: Запрос к провайдеру собирают адаптеры (post, YandexGPT.postFolder) только на адрес, вычисленный при создании провайдера из base_url и auth_url файла конфигурации администратора (allowlist исходящих соединений, ЗИ.3); из запроса приложения адрес не берётся. Перенаправления клиент не выполняет (CheckRedirect), прокси из окружения не используются. Анализ помечает параметр функции как недоверенный, не видя, откуда он пришёл.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-08
  - rule: gosec/G124
    file: internal/api/session.go
    snippet: 'http.SetCookie(w, &http.Cookie{Name: CSRFCookie, Value: csrf, Path: "/",'
    verdict: false_positive
    justification: Cookie __Host-aisec_csrf намеренно без HttpOnly — это схема двойной отправки (решение Р6 этапа 2, ТЗ 6.9) — интерфейс читает CSRF-токен из cookie и возвращает его в заголовке X-CSRF-Token. Secure и SameSite=Strict выставлены в той же записи. Токен не даёт доступа без cookie сессии __Host-aisec_session (HttpOnly) и привязан к своей сессии; сессионный токен скриптам недоступен.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-20
  - rule: gosec/G101
    file: internal/gwregistry/gwregistry.go
    snippet: 'const TokenPrefix = "aisec_gwreg_"'
    verdict: false_positive
    justification: Публичный префикс формата токена регистрации шлюза (как «ghp_» у GitHub) — по нему токен распознаётся в логах и сканерами секретов. Секретная часть — 32 случайных байта от генератора криптопрофиля (aisecCrypto.RandomBytes) — дописывается при выпуске в IssueToken и в коде не хранится; в БД — только хеш токена (SHA-256 в профиле standard).
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-21
  - rule: gosec/G101
    file: cmd/aisec-gateway/register.go
    snippet: 'tokenEnv = "AISEC_GATEWAY_REGISTRATION_TOKEN"'
    verdict: false_positive
    justification: Имя переменной окружения, из которой aisec-gateway register читает токен регистрации (аргументом токен не принимается, чтобы он не был виден в списке процессов). Значения токена в коде нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-21
  - rule: gosec/G124
    file: internal/api/session.go
    snippet: 'http.SetCookie(w, &http.Cookie{Name: CSRFCookie, Value: "", Path: "/", MaxAge: -1,'
    verdict: false_positive
    justification: Удаление cookie __Host-aisec_csrf при выходе (пустое значение, MaxAge -1) с теми же атрибутами, что при выдаче — без HttpOnly по схеме двойной отправки (Р6), с Secure и SameSite=Strict. Значения в cookie нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-20
  - rule: gosec/G101
    file: internal/auth/permissions.go
    snippet: 'PermAPITokensManage = "api_tokens.manage"'
    verdict: false_positive
    justification: Имя разрешения RBAC «выпуск и отзыв токенов API» (задача 2.10) — строка каталога прав, которая попадает в api/openapi.yaml (x-permission) и в матрицу ролей. Правило реагирует на слово Tokens в имени константы; секрета в строке нет.
    author: Claude Code (ИИ-ассистент); проверяет владелец при ревью
    date: 2026-10-21
