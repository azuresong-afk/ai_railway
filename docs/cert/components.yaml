    version: v0.58.0
    type: go-module
    scope: product
    purpose: Argon2id для паролей учётных записей (PasswordHasher, ТЗ 10.2); используются только пакеты argon2 и blake2b, импорт — только в internal/crypto (depguard).
    license: BSD-3-Clause
    repository: https://go.googlesource.com/crypto
    attack_surface: true
    security_function: true
    provided_by: The Go Authors (Google)
    justification: Argon2id нет в стандартной библиотеке Go, а собственные реализации алгоритмов запрещены. Библиотеку называет ТЗ 11.2; сопровождает команда Go, выпуски ежемесячно. В vendor попадают только argon2 и blake2b; x/net и x/term нужны лишь для графа модулей и в сборку не входят. Граф x/crypto поднимает версии x/sync и x/text, которые вендорятся для pgx.
