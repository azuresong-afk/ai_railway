# Реестр заимствованных компонентов (ТЗ, 8.6, раздел 9; CLAUDE.md, «Зависимости»).
#
# Каждый компонент, который попадает в продукт или используется в сборочной
# среде, записан здесь. Проверка — make licenses (tools/license-check):
# состав сверяется с vendor/modules.txt, go.mod и Makefile, лицензии —
# с политикой CLAUDE.md. Данные идут в SBOM (make sbom): туда попадают только
# компоненты с scope: product.
#
# Поля:
#   name, version        — имя и точная версия.
#   type                 — go-module | toolchain | tool | image | github-action | npm-package | font | native-library.
#                          Для native-library: библиотека C/C++ из исходников по deploy/build/onnxruntime/deps.lock
#                          (ONNX Runtime и статически встроенные в неё); version — версия выпуска и коммит.
#                          Для image: name — репозиторий образа (golang), version — «тег@sha256:…».
#                          Для npm-package: прямая зависимость web/package.json (dependencies — scope product,
#                          devDependencies — build); транзитивные пакеты проверяет make licenses по web/package-lock.json
#                          (ADR-0011), в реестр попадают только исключения с license_decision.
#                          Для github-action: version — «тег@SHA коммита».
#   scope                — product (в поставке, в SBOM) | build (только сборочная среда, ADR-0003).
#   purpose              — зачем нужен.
#   license              — выражение SPDX (AND, OR, скобки).
#   license_decision     — ссылка на решение (начинается с ADR-NNNN, файл должен существовать), если лицензия допускается только отдельным решением
#                          (MPL-2.0, LGPL; GPL — только для scope: build).
#   repository           — ссылка https на исходный код.
#   attack_surface       — обрабатывает ли компонент недоверенные данные (GOST:attack_surface).
#   security_function    — реализует ли функцию безопасности (GOST:security_function).
#   provided_by          — кто поставляет компонент (GOST:provided_by).
#   justification        — почему не хватает стандартной библиотеки или собственного кода.
#   decision, decided    — где принято решение и когда (ГГГГ-ММ-ДД).
#   makefile_var         — переменная Makefile с версией (для инструментов); сверяется.
#   license_files        — для модулей Go: SHA-256 файлов лицензий (LICENSE*, COPYING*, NOTICE*)
#                          из vendor/; при смене текста лицензии проверка падает.
schema_version: 1
components:
