    purpose: Исполнитель моделей ML-детекторов в процессе aisec-ml (ADR-0024) — libonnxruntime.so.1.31.0, только исполнитель CPU, без телеметрии, тестов и Python. Загружается aisec-ml по дескриптору файла после сверки хеша со встроенным при сборке.
