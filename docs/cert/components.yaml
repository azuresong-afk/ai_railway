# Реестр заимствованных компонентов (ТЗ, 8.6, раздел 9; CLAUDE.md, «Зависимости»).
#
# Каждый компонент, который попадает в продукт или используется в сборочной
# среде, записан здесь. Проверка — make licenses (tools/license-check):
# состав сверяется с vendor/modules.txt, go.mod и Makefile, лицензии —
# с политикой CLAUDE.md. Данные идут в SBOM (make sbom): туда попадают только
# компоненты с scope: product.
#
# Поля:
#   name, version        — имя и точная версия.
#   type                 — go-module | toolchain | tool | image | github-action.
#                          Для image: name — репозиторий образа (golang), version — «тег@sha256:…».
#                          Для github-action: version — «тег@SHA коммита».
#   scope                — product (в поставке, в SBOM) | build (только сборочная среда, ADR-0003).
#   purpose              — зачем нужен.
#   license              — выражение SPDX (AND, OR, скобки).
#   license_decision     — ссылка на решение (начинается с ADR-NNNN, файл должен существовать), если лицензия допускается только отдельным решением
#                          (MPL-2.0, LGPL; GPL — только для scope: build).
#   repository           — ссылка https на исходный код.
#   attack_surface       — обрабатывает ли компонент недоверенные данные (GOST:attack_surface).
#   security_function    — реализует ли функцию безопасности (GOST:security_function).
#   provided_by          — кто поставляет компонент (GOST:provided_by).
#   justification        — почему не хватает стандартной библиотеки или собственного кода.
#   decision, decided    — где принято решение и когда (ГГГГ-ММ-ДД).
#   makefile_var         — переменная Makefile с версией (для инструментов); сверяется.
#   license_files        — для модулей Go: SHA-256 файлов лицензий (LICENSE*, COPYING*, NOTICE*)
#                          из vendor/; при смене текста лицензии проверка падает.
schema_version: 1
components:
  - name: Go toolchain и стандартная библиотека
    version: go1.27.2
    type: toolchain
    scope: product
    purpose: Компилятор и стандартная библиотека; стандартная библиотека входит во все бинарники продукта (HTTP, TLS, JSON, криптография в internal/crypto).
    license: BSD-3-Clause
    repository: https://go.googlesource.com/go
    attack_surface: true
    security_function: true
    provided_by: The Go Authors (Google LLC)
    justification: Язык реализации продукта (ТЗ, 11.1).
    decision: ТЗ 11.1; ADR-0001; go1.27.2 — исправления уязвимостей стандартной библиотеки (GO-2026-6603…6617)
    decided: 2026-10-10

  - name: go.yaml.in/yaml/v3
    version: v3.0.5
    type: go-module
    scope: product
    purpose: Разбор YAML — реестр компонентов и разметка SAST в утилитах; с этапа 1 — политики и конфигурация.
    license: MIT AND Apache-2.0
    repository: https://github.com/yaml/go-yaml
    attack_surface: true
    security_function: false
    provided_by: YAML Organization (github.com/yaml)
    justification: В стандартной библиотеке нет YAML, а формат задан ТЗ (components.yaml, импорт и экспорт политик, 5.3). Продолжение gopkg.in/yaml.v3, который с апреля 2025 г. не сопровождается. Собственных зависимостей нет.
    decision: ТЗ 11.2; ADR-0001; план этапа 0, Д2
    decided: 2026-09-29
    license_files:
      LICENSE: d18f6323b71b0b768bb5e9616e36da390fbd39369a81807cca352de4e4e6aa0b
      NOTICE: f6c2dd3a67b576eafb89b80200b8b1627230bf3821a0c14cb99a22ac19107d00

  - name: golangci-lint
    version: v2.14.0
    type: tool
    scope: build
    purpose: Линтеры Go, в том числе depguard, gosec, staticcheck, errcheck; SARIF для статического анализа.
    license: GPL-3.0-only
    license_decision: ADR-0003 — инструмент сборочной среды, не линкуется в продукт и не поставляется (план этапа 0, Д1)
    repository: https://github.com/golangci/golangci-lint
    attack_surface: false
    security_function: false
    provided_by: golangci (сообщество)
    justification: В go vet нет запрета импортов, проверок безопасности и большинства проверок качества (ТЗ, 8.4).
    decision: план этапа 0, Д1; ADR-0003
    decided: 2026-09-29
    makefile_var: GOLANGCI_LINT_VERSION

  - name: govulncheck (golang.org/x/vuln)
    version: v1.8.0
    type: tool
    scope: build
    purpose: Поиск известных уязвимостей в зависимостях и стандартной библиотеке (ТЗ, 8.6).
    license: BSD-3-Clause
    repository: https://go.googlesource.com/vuln
    attack_surface: false
    security_function: false
    provided_by: The Go Authors (Google LLC)
    justification: Официальный инструмент Go; иначе понадобилась бы собственная сверка с базой уязвимостей.
    decision: ТЗ 8.4; план этапа 0
    decided: 2026-09-29
    makefile_var: GOVULNCHECK_VERSION

  - name: sbom-utility
    version: v1.0.1
    type: tool
    scope: build
    purpose: Проверка SBOM по схеме CycloneDX 1.6 (критерий приёмки этапа 0).
    license: Apache-2.0
    repository: https://github.com/CycloneDX/sbom-utility
    attack_surface: false
    security_function: false
    provided_by: CycloneDX (OWASP Foundation)
    justification: В стандартной библиотеке нет проверки по JSON Schema.
    decision: план этапа 0, Д3
    decided: 2026-09-29
    makefile_var: SBOM_UTILITY_VERSION

  - name: golang
    version: 1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    type: image
    scope: build
    purpose: Основа сборочного образа (deploy/build/Dockerfile) и стадии сборки образов стенда разработки.
    # Go — BSD-3-Clause; пакеты Debian в образе (gcc, make, bash, git и др.) — в том числе GPL и LGPL.
    license: BSD-3-Clause AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later
    license_decision: ADR-0003 — образ сборочной среды, в поставку не входит; образы поставки собираются в scratch
    repository: https://github.com/docker-library/golang
    attack_surface: false
    security_function: false
    provided_by: Docker Official Images (Docker, Inc.); Go — The Go Authors
    justification: Официальный образ Go закреплён по digest (ТЗ, 8.7). Внутри — пакеты Debian под разными лицензиями, в том числе GPL; в продукт они не попадают — образы поставки собираются в scratch (ADR-0003).
    decision: план этапа 0, Д4; ADR-0003
    decided: 2026-10-01

