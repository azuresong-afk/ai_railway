    attack_surface: true
    security_function: false
    provided_by: YAML Organization (github.com/yaml)
    justification: В стандартной библиотеке нет YAML, а формат задан ТЗ (components.yaml, импорт и экспорт политик, 5.3). Продолжение gopkg.in/yaml.v3, который с апреля 2025 г. не сопровождается. Собственных зависимостей нет.
    decision: ТЗ 11.2; ADR-0001; план этапа 0, Д2
    decided: 2026-09-29
    license_files:
      LICENSE: d18f6323b71b0b768bb5e9616e36da390fbd39369a81807cca352de4e4e6aa0b
      NOTICE: f6c2dd3a67b576eafb89b80200b8b1627230bf3821a0c14cb99a22ac19107d00

  - name: golang.org/x/crypto
    version: v0.58.0
    type: go-module
    scope: product
    purpose: Argon2id для паролей учётных записей (PasswordHasher, ТЗ 10.2); используются только пакеты argon2 и blake2b, импорт — только в internal/crypto (depguard).
    license: BSD-3-Clause
    repository: https://go.googlesource.com/crypto
    attack_surface: true
    security_function: true
    provided_by: The Go Authors (Google)
    justification: Argon2id нет в стандартной библиотеке Go, а собственные реализации алгоритмов запрещены. Библиотеку называет ТЗ 11.2; сопровождает команда Go, выпуски ежемесячно. В vendor попадают argon2, blake2b и md4; md4 импортирует go-ldap/ldap/v3 для bind NTLM, который в продукте запрещён (forbidigo, ADR-0025, 2.2), — код продукта его не вызывает. x/net нужен лишь для графа модулей и в сборку не входит (x/term подключён отдельно, см. ниже). Граф x/crypto поднимает версии x/sync и x/text, которые вендорятся для pgx.
    decision: ТЗ 11.2; ADR-0006; согласие владельца в потоке A2 этапа 2
    decided: 2026-10-20
    license_files:
      LICENSE: 911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad

  - name: golang.org/x/sys
    version: v0.49.0
    type: go-module
    scope: product
    purpose: Транзитивная зависимость golang.org/x/crypto (пакет cpu — выбор ускоренной реализации BLAKE2b по возможностям процессора) и golang.org/x/term (пакеты unix, windows, plan9 — системные вызовы терминала).
    license: BSD-3-Clause
    repository: https://go.googlesource.com/sys
    attack_surface: false
    security_function: false
    provided_by: The Go Authors (Google)
    justification: Требуется golang.org/x/crypto (cpu) и golang.org/x/term (unix; windows и plan9 вендорятся по тегам сборки, в сборку для Linux не входят). Версию не поднимает — x/term v0.47.0 требует ту же v0.49.0. unsafe внутри x/sys — системные вызовы ОС, в коде продукта unsafe по-прежнему запрещён (depguard).
    decision: ADR-0006; согласие владельца в потоке A2 этапа 2; пакет unix — ADR-0017, согласие владельца 22.10.2026 (поток H1)
    decided: 2026-10-20
    license_files:
      LICENSE: 911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad

  - name: golang.org/x/term
    version: v0.47.0
    type: go-module
    scope: product
    purpose: Ввод парольной фразы резервной копии с терминала без отображения (aisec-cli backup, ADR-0017); импорт — только в cmd/aisec-cli.
    license: BSD-3-Clause
    repository: https://go.googlesource.com/term
    attack_surface: true
    security_function: true
    provided_by: The Go Authors (Google)
    justification: В стандартной библиотеке нет выключения отображения ввода на терминале. Прежний способ — вызов stty из состава ОС через os/exec — требует внешнего процесса и не работает в образах без stty (distroless). Сопровождает команда Go, выпуски ежемесячно; единственная зависимость — golang.org/x/sys, уже входящая в граф x/crypto. Уже был в графе модулей x/crypto той же версии.
    decision: ADR-0017, п. 8; согласие владельца 22.10.2026 (поток H1)
    decided: 2026-10-22
    license_files:
      LICENSE: 911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad

  - name: rsc.io/qr
    version: v0.2.0
    type: go-module
    scope: product
    purpose: Кодирование ссылки otpauth в матрицу QR-кода при подключении второго фактора (ИАФ.5, задача 2.8); сервер отдаёт матрицу модулей, консоль рисует её SVG-прямоугольниками.
    license: BSD-3-Clause
    repository: https://github.com/rsc/qr
    attack_surface: false
    security_function: false
    provided_by: Russ Cox (The Go Authors)
    justification: В стандартной библиотеке Go нет кодировщика QR (Рида — Соломона и масок), а собственная реализация — лишний непроверенный код. Модуль без зависимостей (go.mod без require), чистый Go, только кодирование; вход — строка, сформированная сервером (логин до 64 символов). В vendor попадают пакеты qr, qr/coding, qr/gf256; libqrencode (cgo) не импортируется и в сборку не входит. Последний выпуск v0.2.0 — июнь 2018 года; кодировщик стандарта ISO/IEC 18004 не требует обновлений, а входные данные доверенные (формирует сервер), поэтому низкая активность допустима.
    decision: решение Р2 этапа 2; согласие владельца на план задачи 2.8 (поток C1, 21.10.2026)
    decided: 2026-10-21
    license_files:
      LICENSE: 2d36597f7117c38b006835ae7f537487207d8ec407aa9d9980794b2030cbc067

