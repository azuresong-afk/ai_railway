  - name: github.com/go-ldap/ldap/v3
    version: v3.4.15
    type: go-module
    scope: product
    purpose: Протокол LDAP для входа в консоль по учётной записи каталога (ТЗ 5.14, ИАФ.7; ADR-0025, раздел 2; задача 4.16) — simple bind, поиск, StartTLS, разбор DN и экранирование фильтров. Импорт — только в internal/auth/ldap (depguard).
    license: MIT
    repository: https://github.com/go-ldap/ldap
    attack_surface: true
    security_function: true
    provided_by: go-ldap Authors (github.com/go-ldap)
    justification: В стандартной библиотеке Go нет LDAP и нет кодека BER (encoding/asn1 — только DER, без потокового чтения сообщений); собственный разборщик BER недоверенных ответов каталога — больший риск, чем проверенная библиотека с fuzz-тестом разбора пакетов. Выпуски v3.4.x регулярно (v3.4.15 — 07.10.2026), используется в Grafana и Gitea. Соединение устанавливает internal/auth/ldap сам (проверка адреса, LDAPS через internal/crypto; для StartTLS рукопожатие выполняет библиотека (crypto/tls) с *tls.Config из криптопрофиля internal/crypto — в профиле gost это нужно будет заменить; предел ответа 1 МиБ); NTLM, DIGEST-MD5, SASL/GSSAPI, анонимный bind, собственные функции соединения библиотеки и её отладочный журнал запрещены forbidigo. Подпакет gssapi и его зависимости (jcmturner/gokrb5, alexbrainman/sspi) в vendor и сборку не попадают; testify — только тесты библиотеки.
    decision: ADR-0025, раздел 2, п. 7; согласие владельца 27.10.2026 (поток 4-B3)
    decided: 2026-10-27
    license_files:
      LICENSE: 35f64977248ea3fd59074171ad76e883fe4a576a7b1c58bba85c8e5c880bb269

